name: Auto Plugin Release

# Automatically cut plugin release tags when the nexus-vfs rev pin
# changes in Cargo.toml. This ensures plugin artifacts always match
# the nexusd-cluster binary's ABI — no manual tag ceremony, no dev
# signing keys needed for testing.
#
# Flow:
#   1. PR merges to develop with Cargo.toml nexus-vfs rev change
#   2. This workflow detects the rev diff
#   3. Determines next semver for each plugin (patch bump from latest tag)
#   4. Cuts annotated tags → triggers release-{vault,fuse,local-connector}-plugin.yml
#
# The individual release workflows handle build + sign + COS upload.
# Vault must complete before fuse/local-connector (dogfood signing).

on:
  push:
    branches: [develop]
    paths:
      - "Cargo.toml"

permissions:
  # Push the tags.
  contents: write
  # Dispatch the release workflows. `workflow_dispatch` via the API is an
  # `actions` write, not a `contents` one — without this the dispatch step
  # gets HTTP 403 "Resource not accessible by integration" and the tags land
  # with no releases behind them, which is the exact failure this workflow's
  # dispatch step exists to prevent.
  actions: write

jobs:
  check-rev-change:
    name: Detect nexus-vfs rev change
    runs-on: ubuntu-latest
    outputs:
      rev_changed: ${{ steps.diff.outputs.rev_changed }}
      new_rev: ${{ steps.diff.outputs.new_rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if nexus-vfs rev changed
        id: diff
        run: |
          OLD_REV=$(git show HEAD~1:Cargo.toml | grep -oP '(?<=rev = ")[a-f0-9]{40}' | sort -u | head -1 || echo "")
          NEW_REV=$(grep -oP '(?<=rev = ")[a-f0-9]{40}' Cargo.toml | sort -u | head -1)
          if [ "$OLD_REV" != "$NEW_REV" ] && [ -n "$NEW_REV" ]; then
            echo "rev_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_rev=${NEW_REV}" >> "$GITHUB_OUTPUT"
            echo "nexus-vfs rev changed: ${OLD_REV:0:12} → ${NEW_REV:0:12}"
          else
            echo "rev_changed=false" >> "$GITHUB_OUTPUT"
            echo "nexus-vfs rev unchanged (${NEW_REV:0:12})"
          fi

  cut-tags:
    name: Cut plugin release tags
    needs: check-rev-change
    if: needs.check-rev-change.outputs.rev_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for tag listing

      - name: Determine next versions and cut tags
        env:
          NEW_REV: ${{ needs.check-rev-change.outputs.new_rev }}
        run: |
          set -euo pipefail

          # Annotated tags (`git tag -a`) are commit-shaped objects that
          # embed a tagger identity, so git refuses to create them
          # without user.email + user.name set. `actions/checkout@v4`
          # wires the push credential but not the identity — configure
          # the standard github-actions[bot] identity here so this step
          # doesn't exit 128 on the first `git tag -a` call.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          next_patch() {
            local prefix="$1"
            local latest
            latest=$(git tag -l "${prefix}*" --sort=-v:refname | head -1 || echo "")
            if [ -z "$latest" ]; then
              echo "${prefix}0.1.0"
              return
            fi
            local version="${latest#${prefix}}"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$version"
            echo "${prefix}${major}.${minor}.$((patch + 1))"
          }

          VAULT_TAG=$(next_patch "vault-v")
          FUSE_TAG=$(next_patch "fuse-v")
          LC_TAG=$(next_patch "local-connector-v")
          SEARCH_TAG=$(next_patch "search-v")

          echo "Cutting tags: $VAULT_TAG, $FUSE_TAG, $LC_TAG, $SEARCH_TAG"
          echo "nexus-vfs rev: ${NEW_REV:0:12}"

          MSG="rebuild against nexus-vfs ${NEW_REV:0:12} (auto-release on rev bump)"

          # Vault first (other plugins depend on it for dogfood signing)
          git tag -a "$VAULT_TAG" HEAD -m "vault ${VAULT_TAG#vault-v} — $MSG"
          git push origin "$VAULT_TAG"
          echo "vault_tag=$VAULT_TAG" >> "$GITHUB_ENV"

          # Fuse + local-connector + search can go together (all use dogfood
          # signing which fetches the latest vault-v* release — vault must
          # be released first, which the dispatch step below orders).
          git tag -a "$FUSE_TAG" HEAD -m "fuse-plugin ${FUSE_TAG#fuse-v} — $MSG"
          git tag -a "$LC_TAG" HEAD -m "local-connector ${LC_TAG#local-connector-v} — $MSG"
          git tag -a "$SEARCH_TAG" HEAD -m "search-plugin ${SEARCH_TAG#search-v} — $MSG"
          git push origin "$FUSE_TAG" "$LC_TAG" "$SEARCH_TAG"

          {
            echo "fuse_tag=$FUSE_TAG"
            echo "lc_tag=$LC_TAG"
            echo "search_tag=$SEARCH_TAG"
          } >> "$GITHUB_ENV"

          echo "### Auto Plugin Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "nexus-vfs rev: \`${NEW_REV:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Plugin | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| vault | $VAULT_TAG |" >> "$GITHUB_STEP_SUMMARY"
          echo "| fuse | $FUSE_TAG |" >> "$GITHUB_STEP_SUMMARY"
          echo "| local-connector | $LC_TAG |" >> "$GITHUB_STEP_SUMMARY"
          echo "| search-plugin | $SEARCH_TAG |" >> "$GITHUB_STEP_SUMMARY"

      # Cutting the tag is NOT what releases the plugin — this step is.
      #
      # GitHub does not start a workflow from an event raised with the
      # default `GITHUB_TOKEN`, so the `on: push: tags:` trigger in each
      # release wrapper never fired for a tag pushed above. The tags landed,
      # the releases did not, and every downstream that pins a plugin version
      # (sudowork pins nexus-vault by version + SHA256) was stuck on the last
      # hand-released build while the daemon's ABI moved underneath it —
      # ten rev bumps' worth, silently.
      #
      # `workflow_dispatch` is the documented exception: it may be triggered
      # with `GITHUB_TOKEN`. Each wrapper already accepts the tag as an input
      # for exactly this kind of retry, so dispatch them explicitly rather
      # than hoping for a trigger that cannot fire.
      #
      # Vault goes first and we WAIT for it: every other plugin dogfoods its
      # signing key out of the newest vault-v* release, so releasing them
      # against a stale vault is how a signature ends up covering the wrong
      # key. Ordering it here also retires the race the old comment described.
      - name: Dispatch the release workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dispatch() { # workflow-file tag
            echo "dispatching $1 for $2"
            gh workflow run "$1" --ref "${{ github.ref_name }}" -f "tag=$2"
          }

          dispatch release-vault-plugin.yml "$vault_tag"

          # Wait for the vault release to exist before the dogfooding
          # plugins go, rather than letting them race it.
          deadline=$((SECONDS + 1500))
          until gh release view "$vault_tag" --json tagName >/dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::vault release $vault_tag did not appear within 25m; \
          the dogfooding plugins were NOT dispatched. Re-run them by hand once \
          vault is published."
              exit 1
            fi
            sleep 20
          done
          echo "vault release $vault_tag is published"

          dispatch release-fuse-plugin.yml "$fuse_tag"
          dispatch release-local-connector-plugin.yml "$lc_tag"
          dispatch release-search-plugin.yml "$search_tag"
