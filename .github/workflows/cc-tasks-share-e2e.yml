name: cc-tasks-share E2E

# Runs `tests/e2e/docker/test_cc_tasks_share_e2e.py` against the
# founder + joiner cluster in
# `dockerfiles/docker-compose.cc-tasks-share.yml`.  The suite has two
# layers:
#
#   * `TestLocalConnectorThroughVFS` — single-node substrate: each
#     daemon loads `libnexus_local_connector.so` via `--plugin-dir`,
#     `--mount-driver` lands the LocalConnector backend, and the
#     host-fs SSOT property holds end-to-end through the gRPC vfs_*
#     surface.
#
#   * `TestCrossNodeLazyMaterialization` — the actual cc-tasks-share
#     workflow: founder CC writes a task JSON directly to host fs
#     (no Nexus syscall), joiner's first vfs_read fans out to founder
#     via `peer_client.fetch`, founder's `BlobFetcher::read`
#     materialises metadata via the lazy observe substrate
#     (nexus-vfs#46), and joiner's second read takes the
#     `try_remote_fetch` fast path with `last_writer_address`.
#
# Independent of federation-e2e.yml — that suite covers the lower-tier
# 3-voter HA surface; this one covers the dylib + operator-mount +
# cross-node-passthrough surface layered on top.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'dockerfiles/Dockerfile.local-connector-plugin'
      - 'dockerfiles/docker-compose.cc-tasks-share.yml'
      - 'dockerfiles/Dockerfile.nexusd-cluster'
      - 'dockerfiles/Dockerfile.federation-test'
      - 'rust/backends/local-connector/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/docker/test_cc_tasks_share_e2e.py'
      - 'tests/e2e/docker/cc_tasks_share_helpers.py'
      - 'tests/e2e/docker/runbook_helpers.py'
      - '.github/workflows/cc-tasks-share-e2e.yml'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cc-tasks-share-e2e:
    name: cc-tasks-share E2E (Docker)
    runs-on: ubuntu-latest
    # Cold cache: cluster image build + dylib build + compose up + 4
    # tests is ~10-12 min.  Warm gha cache shaves the rust compile.
    # 25 min upper bound leaves margin for slow-building rust deps.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect cc-tasks-share-relevant changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD > /tmp/changed_files.txt
          cat /tmp/changed_files.txt
          # Workflow file itself intentionally not in the regex —
          # editing this YAML alone should not force a full Docker
          # cluster build for an unrelated change.  Post-merge push
          # paths above pick it up.
          if grep -Eq '^(dockerfiles/(Dockerfile\.(local-connector-plugin|nexusd-cluster|federation-test)|docker-compose\.cc-tasks-share\.yml)|rust/backends/local-connector/|Cargo\.toml$|Cargo\.lock$|tests/e2e/docker/(test_cc_tasks_share_e2e|cc_tasks_share_helpers|runbook_helpers)\.py$)' /tmp/changed_files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip cc-tasks-share E2E
        if: steps.changes.outputs.run != 'true'
        run: |
          echo "No cc-tasks-share-relevant files changed; reporting required check without running suite."

      - name: Set up Docker Buildx
        if: steps.changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      # Pin SSOT: the nexus-vfs SHA the cluster binary + plugin dylibs
      # compile against lives in `Cargo.toml`'s workspace dep rev.
      # Parse it once and reuse for the checkout step below.
      - name: Read NEXUS_VFS_REV from Cargo.toml
        if: steps.changes.outputs.run == 'true'
        id: vfs_rev
        run: |
          sha=$(grep -oP '(?<=rev = ")[a-f0-9]{40}' Cargo.toml | sort -u | head -1)
          if [ -z "$sha" ]; then
            echo "::error::Could not parse nexus-vfs SHA from Cargo.toml"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved nexus-vfs SHA: $sha"

      - name: Checkout nexus-vfs source at pinned SHA
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: nexi-lab/nexus-vfs
          ref: ${{ steps.vfs_rev.outputs.sha }}
          path: nexus-vfs-src
          fetch-depth: 1

      # Build the production cluster image first, with a registry
      # cache.  Both the local-connector-plugin image and the
      # federation-test image FROM nexusd-cluster:latest, so they all
      # stay on one buildx instance.  `build-contexts` feeds the
      # checked-out nexus-vfs source tree to the Dockerfile's
      # `COPY --from=nexus-vfs-src` step.
      - name: Build nexusd-cluster image
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.nexusd-cluster
          build-contexts: |
            nexus-vfs-src=nexus-vfs-src
          load: true
          tags: nexusd-cluster:latest
          cache-from: type=gha,scope=cc-tasks-share-cluster
          cache-to: type=gha,scope=cc-tasks-share-cluster,mode=max

      - name: Build local-connector-plugin + federation-test images
        if: steps.changes.outputs.run == 'true'
        # BUILDX_BUILDER=default forces compose build to use the
        # docker-daemon builder rather than the docker-container
        # builder from setup-buildx-action.  Both downstream images
        # start `FROM nexusd-cluster:latest`, which only the daemon
        # builder can resolve against the previous step's
        # `load: true` artifact.  See federation-e2e.yml for the same
        # workaround.
        env:
          BUILDX_BUILDER: default
          # Feeds the compose-level `plugin_signing_key` build secret —
          # the plugin image Ed25519-signs the local-connector dylib in
          # the builder stage (kernel 67ac07f+ refuses unsigned plugins).
          PLUGIN_SIGNING_PRIVKEY: ${{ secrets.PLUGIN_SIGNING_PRIVKEY }}
        run: |
          if [ -z "$PLUGIN_SIGNING_PRIVKEY" ]; then
            echo "::error::PLUGIN_SIGNING_PRIVKEY secret is not available — cannot sign the local-connector plugin (kernel refuses unsigned plugins)."
            exit 1
          fi
          docker compose -f dockerfiles/docker-compose.cc-tasks-share.yml build \
            founder joiner test

      - name: Start cc-tasks-share cluster
        if: steps.changes.outputs.run == 'true'
        run: |
          docker compose -f dockerfiles/docker-compose.cc-tasks-share.yml up -d founder joiner
          docker compose -f dockerfiles/docker-compose.cc-tasks-share.yml ps

      - name: Wait for founder + joiner healthy
        if: steps.changes.outputs.run == 'true'
        run: |
          deadline=$((SECONDS + 180))
          while [ $SECONDS -lt $deadline ]; do
            if docker exec nexus-cc-tasks-founder bash -c 'timeout 1 bash -c "</dev/tcp/localhost/2126" 2>/dev/null' && \
               docker exec nexus-cc-tasks-joiner bash -c 'timeout 1 bash -c "</dev/tcp/localhost/2126" 2>/dev/null'; then
              echo "Founder + joiner healthy (gRPC 2126 reachable on both) after ${SECONDS}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Timed out waiting for cluster ready (180s)"
          docker compose -f dockerfiles/docker-compose.cc-tasks-share.yml logs --tail=300
          exit 1

      - name: Run cc-tasks-share E2E tests
        if: steps.changes.outputs.run == 'true'
        run: |
          docker compose -f dockerfiles/docker-compose.cc-tasks-share.yml \
            run --rm test

      - name: Dump container logs on failure
        if: failure() && steps.changes.outputs.run == 'true'
        run: |
          for c in nexus-cc-tasks-founder nexus-cc-tasks-joiner; do
            echo "::group::$c"
            docker logs "$c" --tail=400 2>&1 || echo "(no logs)"
            echo "::endgroup::"
          done

      - name: Tear down
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          docker compose -f dockerfiles/docker-compose.cc-tasks-share.yml down -v --remove-orphans || true
