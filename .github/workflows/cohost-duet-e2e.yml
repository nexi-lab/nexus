# Co-host A2A duet E2E — builds the `nexusd-cluster-cohost` image (the assembly
# binary with the in-process sudocode runtime linked) and runs a REAL LLM agent
# duet over the nexus A2A mailbox in a container. Guards the merged
# spawn-AgentState / SudoCodeSpawnAdapter path against regression, over the wire.
#
# See dockerfiles/Dockerfile.nexusd-cohost + docker-compose.cohost-duet.yml +
# tests/e2e/docker/test_cohost_duet_e2e.py.
#
# REQUIRED repo secrets — the job FAILS without them, deliberately. The agent
# loop itself is gated secret-free by sudocode's `cohost_mock_llm`; what only
# this job can cover is the container, the daemon boot and the gRPC entry, so a
# run that cannot do those has to say so rather than report success:
#   * COHOST_BUILD_TOKEN  — a PAT with READ on BOTH private deps
#     (nexi-lab/nexus-vfs AND sudoprivacy/sudocode); the cohost image git-fetches
#     them at build time via a BuildKit secret. The default GITHUB_TOKEN cannot
#     reach the cross-org sudocode repo.
#   * SUDOROUTER_API_KEY  — the FUNDED sudorouter key (vault "SudoRouter" entry,
#     unlimited main pool). The LLM turn 403s on a balance-capped key, so the
#     test's reply assertion needs a funded one.

name: cohost-duet-e2e

on:
  # On-demand — the primary path (run it when the cohost surface changes, or to
  # re-verify the duet). Manual dispatch avoids paying for a full cross-repo
  # image build + a live LLM turn on every push.
  workflow_dispatch: {}
  # Weekly regression guard (Mondays 03:00 UTC). One run ≈ 10-15 min of
  # ubuntu-latest (~$0.12 Actions) + one short LLM turn (~$0.02-0.05, negligible
  # against the unlimited main pool). Switch to '0 3 * * *' for daily.
  schedule:
    - cron: '0 3 * * 1'

jobs:
  cohost-duet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout nexus
        uses: actions/checkout@v4

      # A guard that cannot run is not a guard. This step used to warn, set
      # `run=false` and let every later step skip — so the job reported SUCCESS
      # without building the image, booting the daemon or running the duet, and
      # the weekly runs were green from 2026-09-14 onward while covering nothing.
      # Missing secrets now FAIL: a dispatch asked for the duet and did not get
      # it, and a schedule is meant to notice exactly this.
      - name: Preflight — required secrets present
        env:
          BUILD_TOKEN: ${{ secrets.COHOST_BUILD_TOKEN }}
          SR_KEY: ${{ secrets.SUDOROUTER_API_KEY }}
        run: |
          missing=""
          [ -z "$BUILD_TOKEN" ] && missing="$missing COHOST_BUILD_TOKEN"
          [ -z "$SR_KEY" ] && missing="$missing SUDOROUTER_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::cohost duet cannot run — missing secret(s):$missing"
            echo "COHOST_BUILD_TOKEN: a PAT with READ on nexi-lab/nexus-vfs AND"
            echo "  sudoprivacy/sudocode; the image git-fetches both at build time."
            echo "SUDOROUTER_API_KEY: the FUNDED sudorouter key; the duet's LLM turn"
            echo "  403s on a balance-capped one."
            echo "Until they are set, the co-hosted agent LOOP is still gated by"
            echo "  sudocode's cohost_mock_llm (scripted model, no secrets). What is"
            echo "  uncovered is this job's own subject: the container, the daemon"
            echo "  boot and the gRPC StartSession entry."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build nexusd-cluster-cohost image
        env:
          GH_TOKEN: ${{ secrets.COHOST_BUILD_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f dockerfiles/Dockerfile.nexusd-cohost \
            --secret id=ghtoken,env=GH_TOKEN \
            -t nexusd-cluster-cohost:latest .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps (nexus gRPC client + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Start the cohost daemon
        env:
          SUDOROUTER_API_KEY: ${{ secrets.SUDOROUTER_API_KEY }}
        run: |
          docker compose -f dockerfiles/docker-compose.cohost-duet.yml up -d
          docker compose -f dockerfiles/docker-compose.cohost-duet.yml ps

      - name: Wait for the daemon healthy
        run: |
          deadline=$((SECONDS + 120))
          while [ $SECONDS -lt $deadline ]; do
            if docker exec nexus-cohost-duet bash -c 'timeout 1 bash -c "</dev/tcp/localhost/2126" 2>/dev/null'; then
              echo "cohost daemon healthy (gRPC 2126) after ${SECONDS}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::cohost daemon never became healthy (120s)"
          docker compose -f dockerfiles/docker-compose.cohost-duet.yml logs --tail=200
          exit 1

      - name: Run the co-host duet E2E
        env:
          COHOST_DUET_E2E: '1'
          SUDOROUTER_API_KEY: ${{ secrets.SUDOROUTER_API_KEY }}
          COHOST_DUET_GRPC: localhost:2126
        run: |
          pytest tests/e2e/docker/test_cohost_duet_e2e.py -v

      - name: Dump daemon logs on failure
        if: failure()
        run: |
          echo "::group::nexus-cohost-duet"
          docker logs nexus-cohost-duet --tail=400 2>&1 || echo "(no logs)"
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: |
          docker compose -f dockerfiles/docker-compose.cohost-duet.yml down -v --remove-orphans || true
