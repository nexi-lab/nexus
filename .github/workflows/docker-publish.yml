name: Docker Publish

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: git SHA short)"
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nexus
  # Plugin-host image (#4613): nexusd-cluster + signed search plugin.
  # Post-P12 the Rust plugin is the sole search backend, so a published
  # server image without a published plugin-host image cannot serve
  # search — the two are tagged from the same commit so deployments can
  # pin the pairing by digest.
  CLUSTER_IMAGE_NAME: ${{ github.repository_owner }}/nexusd-cluster

jobs:
  # Review R3: a workflow_dispatch custom tag is pushed as the
  # immutable staging reference BEFORE the smoke — so it must never be
  # allowed to name a public release tag, or the smoke gate is
  # bypassed by typing "edge" into the dispatch box.
  validate-inputs:
    name: Validate dispatch inputs
    runs-on: ubuntu-latest
    steps:
      - name: Reject reserved release tags as custom dispatch tags
        env:
          CUSTOM_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$CUSTOM_TAG" ]; then
            echo "no custom tag — nothing to validate"
            exit 0
          fi
          if printf '%s' "$CUSTOM_TAG" | grep -qE '^(edge|stable|latest|v?[0-9]+(\.[0-9]+)*.*)$'; then
            echo "::error::custom tag '$CUSTOM_TAG' is a reserved release tag — release tags are only applied by promote-tags AFTER the e2e smoke passes"
            exit 1
          fi
          echo "custom tag '$CUSTOM_TAG' accepted"

  # Fan out amd64 and arm64 onto native GitHub-hosted runners; emit one
  # push-by-digest image per platform. QEMU-emulated multi-arch on a
  # single ubuntu-latest runner is 5-10x slower than native and times
  # out on heavy images. `ubuntu-24.04-arm` is free for public repos
  # (GA early 2025) and private repos (GA 2026-01-29).
  # See docs: https://docs.docker.com/build/ci/github-actions/multi-platform/
  build-platform:
    name: Build ${{ matrix.platform }}
    needs: [validate-inputs]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize platform pair (for artifact name)
        id: pair
        run: |
          pair="${{ matrix.platform }}"
          echo "value=${pair//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ steps.pair.outputs.value }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ steps.pair.outputs.value }},ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-docker-publish-${{ steps.pair.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    name: Build & push multi-arch image
    needs: [build-platform]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-docker-publish-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Review R2 (#4613 ask 3): this job pushes ONLY the immutable
      # staging reference (commit SHA, or the dispatch's custom tag).
      # Every mutable/public tag — edge, stable, latest, semver — is
      # promoted by the promote-tags job AFTER the e2e smoke passes,
      # so a broken image can no longer land on a tag the public pulls.
      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,prefix=,enable=${{ github.event.inputs.tag == '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t image_tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${image_tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          digest_args=()
          for digest in *; do
            digest_args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${digest_args[@]}"

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

  # ---------------------------------------------------------------------------
  # Plugin-host image (#4613): nexusd-cluster + signed nexus-search-plugin
  # baked into /plugins.  Built from dockerfiles/Dockerfile.nexusd-cluster-plugins
  # (self-contained — cluster binary from the pinned nexus-vfs rev, plugin
  # cdylib from this repo, Ed25519 signing in-build) and published with the
  # SAME tag set as the server image so every server tag has a matching
  # plugin-host tag from the same commit.
  # ---------------------------------------------------------------------------
  build-cluster-platform:
    name: Build cluster ${{ matrix.platform }}
    needs: [validate-inputs]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check plugin signing key availability
        env:
          PLUGIN_SIGNING_PRIVKEY: ${{ secrets.PLUGIN_SIGNING_PRIVKEY }}
        run: |
          if [ -z "$PLUGIN_SIGNING_PRIVKEY" ]; then
            echo "::error::PLUGIN_SIGNING_PRIVKEY secret is not available — cannot sign the plugin, and an unsigned plugin would only defer the failure to daemon boot."
            exit 1
          fi

      - name: Read NEXUS_VFS_REV from Cargo.toml
        id: vfs_rev
        run: |
          sha=$(grep -oP '(?<=rev = ")[a-f0-9]{40}' Cargo.toml | sort -u | head -1)
          if [ -z "$sha" ]; then
            echo "::error::Could not parse nexus-vfs SHA from Cargo.toml"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout nexus-vfs source at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: nexi-lab/nexus-vfs
          ref: ${{ steps.vfs_rev.outputs.sha }}
          path: nexus-vfs-src
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize platform pair (for artifact name)
        id: pair
        run: |
          pair="${{ matrix.platform }}"
          echo "value=${pair//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.nexusd-cluster-plugins
          build-contexts: |
            nexus-vfs-src=nexus-vfs-src
          secrets: |
            plugin_signing_key=${{ secrets.PLUGIN_SIGNING_PRIVKEY }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=cluster-publish-${{ steps.pair.outputs.value }}
          cache-to: type=gha,mode=max,scope=cluster-publish-${{ steps.pair.outputs.value }},ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-cluster-publish-${{ steps.pair.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-cluster-manifest:
    name: Push multi-arch cluster image
    needs: [build-cluster-platform]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-cluster-publish-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable staging reference only — mutable tags are promoted
      # after the smoke by promote-tags (same rule as the server image).
      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,prefix=,enable=${{ github.event.inputs.tag == '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t image_tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${image_tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          digest_args=()
          for digest in *; do
            digest_args+=("${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}@sha256:${digest}")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${digest_args[@]}"

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

  # ---------------------------------------------------------------------------
  # E2E smoke tests against the just-pushed IMMUTABLE image references.
  # Runs for EVERY publishing trigger (develop, main, tags, dispatch) —
  # review R2: a publish path that skips the smoke can ship a plugin
  # that never loaded.  Mutable tags (edge/stable/latest/semver) are
  # only promoted by promote-tags after this job passes.
  # ---------------------------------------------------------------------------
  e2e-edge:
    name: E2E edge smoke tests
    needs: [build-and-push, push-cluster-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # Search plugin sidecar (P12 topology contract): post-#4598 the
      # Rust nexus-search-plugin cdylib is the sole search backend.
      # The edge image is Python-server-only (no plugin baked in), so
      # the smoke tests that assert auto-index-on-write (sections 9+10
      # of test_build_perf_e2e.py) need a plugin process reachable at
      # NEXUS_SEARCH_PLUGIN_TARGET.
      #
      # #4613: the sidecar now runs the PUBLISHED plugin-host image
      # (pushed by push-cluster-manifest earlier in this workflow)
      # instead of an in-workflow build — the smoke validates the
      # exact artifact the public pulls, so a tag can no longer pass
      # e2e using an image that doesn't exist outside CI.
      # ---------------------------------------------------------------
      - name: Prepare shared workspace volume
        run: |
          # Both containers see the same /workspace bytes.  Post-P12
          # the plugin has to read a file by absolute path when
          # NotifyFileChange fires, so nexus-e2e's writes must land
          # somewhere the plugin container can also read.
          docker volume create nexus-shared-workspace
          sudo chmod 777 "$(docker volume inspect nexus-shared-workspace --format '{{.Mountpoint}}')"

      - name: Start search-plugin sidecar on 127.0.0.1:2126
        run: |
          # Same single-node topology + flags as the search-plugin-e2e
          # compose's bootstrap entrypoint, but running the published
          # image.  Reachable 0.0.0.0 bind + --no-tls trips the
          # loopback auth invariant; this is a trusted CI smoke, so
          # take the sanctioned escape.
          docker run -d --name nexus-search-plugin-node \
            -p 2126:2126 \
            -e NEXUS_HOSTNAME=node \
            -e NEXUS_ADVERTISE_ADDR=127.0.0.1:2126 \
            -e RUST_LOG=info,nexus_raft=info,kernel::plugins=debug,plugins=debug \
            -v nexus-shared-workspace:/workspace \
            "${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ needs.push-cluster-manifest.outputs.version }}" \
            --bind-addr 0.0.0.0:2126 \
            --data-dir /app/data \
            --no-tls \
            --insecure-no-auth \
            --plugin-dir /plugins
          # Wait for the plugin's gRPC bind to be reachable from the
          # host (2126:2126 mapping so --network host of nexus-e2e
          # sees the same port).
          deadline=$((SECONDS + 120))
          while [ $SECONDS -lt $deadline ]; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/2126' 2>/dev/null; then
              echo "Search plugin sidecar healthy after ${SECONDS}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Search plugin sidecar failed to bind 127.0.0.1:2126 within 120s"
          docker logs --tail=200 nexus-search-plugin-node || true
          exit 1

      - name: Start Nexus edge container
        run: |
          # Container runs as nexus (UID 1000) — match host volume ownership
          mkdir -p /tmp/nexus-data && sudo chown -R 1000:1000 /tmp/nexus-data
          docker run -d --name nexus-e2e \
            --network host \
            -e NEXUS_DATABASE_URL=postgresql://postgres:nexus@localhost/nexus \
            -e NEXUS_HOST=0.0.0.0 \
            -e NEXUS_PORT=2026 \
            -e NEXUS_GRPC_PORT=2028 \
            -e NEXUS_GRPC_TLS=false \
            -e NEXUS_PROFILE=full \
            -e NEXUS_ENFORCE_PERMISSIONS=true \
            -e NEXUS_ALLOW_ADMIN_BYPASS=true \
            -e NEXUS_DB_ASYNC_USE_POOL=1 \
            -e NEXUS_DB_POOL_SIZE=5 \
            -e NEXUS_DB_MAX_OVERFLOW=10 \
            -e NEXUS_THREAD_POOL_SIZE=24 \
            -e NEXUS_INDEX_MAX_CONCURRENCY=2 \
            -e NEXUS_INDEX_MAX_EMBEDDING_CONCURRENCY=1 \
            -e NEXUS_ML_WORKERS=1 \
            -e NEXUS_VDB_WORKERS=1 \
            -e NEXUS_SEARCH_POOL_MIN=2 \
            -e NEXUS_SEARCH_POOL_MAX=8 \
            -e NEXUS_SEARCH_PLUGIN_TARGET=127.0.0.1:2126 \
            -v /tmp/nexus-data:/app/data \
            -v nexus-shared-workspace:/workspace \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}"

          # Wait for server to be ready
          echo "Waiting for Nexus to start..."
          for i in $(seq 1 180); do
            if ! docker ps --format '{{.Names}}' | grep -qx nexus-e2e; then
              echo "::error::nexus-e2e exited before becoming healthy"
              docker inspect nexus-e2e --format 'exit_code={{.State.ExitCode}} status={{.State.Status}} started_at={{.State.StartedAt}} finished_at={{.State.FinishedAt}} error={{json .State.Error}}' || true
              echo "Crash signatures from container logs:"
              docker logs nexus-e2e 2>&1 | grep -E -m 20 'Illegal instruction|Traceback|ERROR:|FATAL:|panic|segmentation fault|core dumped' || true
              echo "Last 200 container log lines:"
              docker logs nexus-e2e 2>&1 | tail -200 || true
              exit 1
            fi
            if docker exec nexus-e2e curl --max-time 5 -sf http://127.0.0.1:2026/health > /dev/null 2>&1; then
              echo "Nexus is ready (attempt ${i}/180)"
              break
            fi
            sleep 1
          done
          if ! docker exec nexus-e2e curl --max-time 5 -sf http://127.0.0.1:2026/health > /dev/null 2>&1; then
            echo "::error::nexus-e2e never became healthy from inside the container"
            docker inspect nexus-e2e --format 'exit_code={{.State.ExitCode}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started_at={{.State.StartedAt}} finished_at={{.State.FinishedAt}} error={{json .State.Error}}' || true
            echo "Container-internal health probe:"
            docker exec nexus-e2e curl -v --max-time 5 http://127.0.0.1:2026/health || true
            echo "Host-side health probe:"
            curl -v --max-time 5 http://127.0.0.1:2026/health || true
            echo "Container listen sockets:"
            docker exec nexus-e2e sh -c 'ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true' || true
            echo "Crash signatures from container logs:"
            docker logs nexus-e2e 2>&1 | grep -E -m 20 'Illegal instruction|Traceback|ERROR:|FATAL:|panic|segmentation fault|core dumped' || true
            echo "Last 200 container log lines:"
            docker logs nexus-e2e 2>&1 | tail -200 || true
            exit 1
          fi

      - name: Initialize and extract credentials
        run: |
          # Container startup already runs docker-entrypoint.sh, initializes the
          # database, and writes /app/data/.admin-api-key. Re-running the
          # entrypoint via docker exec starts a second long-running server path.
          ADMIN_KEY=$(curl --max-time 5 -sf http://127.0.0.1:2026/api/admin/bootstrap 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('api_key',''))" 2>/dev/null || true)
          if [ -z "$ADMIN_KEY" ]; then
            echo "Bootstrap not available, reading admin key from container..."
            ADMIN_KEY=$(timeout 30s docker exec nexus-e2e sh -c "
              for i in \$(seq 1 30); do
                if [ -s /app/data/.admin-api-key ]; then
                  cat /app/data/.admin-api-key
                  exit 0
                fi
                sleep 1
              done
              exit 1
            " 2>/dev/null || true)
          fi
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::Unable to obtain Nexus admin API key"
            docker inspect nexus-e2e --format 'exit_code={{.State.ExitCode}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' || true
            exit 1
          fi
          echo "NEXUS_URL=http://127.0.0.1:2026" >> "$GITHUB_ENV"
          echo "NEXUS_API_KEY=${ADMIN_KEY}" >> "$GITHUB_ENV"
          echo "Admin key obtained: ${ADMIN_KEY:0:10}..."

      - name: Seed demo workspace
        run: |
          # nexus demo init needs a nexus.yaml — create a minimal one
          docker exec nexus-e2e sh -c "printf 'preset: demo\nserver_url: http://127.0.0.1:2026\ndata_dir: /app/data\nports:\n  http: 2026\n  grpc: 2028\n' > /app/nexus.yaml"
          docker exec \
            -w /app \
            -e NEXUS_URL=http://127.0.0.1:2026 \
            -e NEXUS_API_KEY="${NEXUS_API_KEY}" \
            -e NEXUS_PROFILE=remote \
            -e NEXUS_GRPC_PORT=2028 \
            -e NEXUS_GRPC_TLS=false \
            nexus-e2e nexus demo init --skip-semantic

      - name: Copy test scripts into container
        run: |
          docker cp permissions_demo_enhanced.sh nexus-e2e:/tmp/
          docker cp scripts/test_build_perf_e2e.py nexus-e2e:/tmp/

      - name: Check VFS gRPC availability
        id: vfs_grpc
        run: |
          # SSOT: read the port from the container the daemon is actually
          # running in, not a workflow-side duplicate. The container env was
          # set with ``-e NEXUS_GRPC_PORT=...`` on ``docker run`` above; if a
          # future change rebinds the daemon, the probe follows automatically.
          GRPC_PORT=$(docker exec nexus-e2e sh -c 'printf %s "${NEXUS_GRPC_PORT:-2028}"')
          if [ -z "$GRPC_PORT" ]; then
            echo "::error::Container has empty NEXUS_GRPC_PORT — daemon won't expose VFS gRPC"
            exit 1
          fi
          if docker exec -i -e GRPC_PORT="$GRPC_PORT" nexus-e2e python3 - <<'PY'
          import os
          import socket
          import sys

          port = int(os.environ["GRPC_PORT"])
          try:
              with socket.create_connection(("127.0.0.1", port), timeout=2):
                  pass
          except OSError:
              sys.exit(1)
          PY
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "VFS gRPC is available on 127.0.0.1:${GRPC_PORT}"
          else
            # Loud (warning, not notice) so the skip surfaces in the PR
            # summary instead of being invisible. The underlying root cause —
            # the edge Docker image bundles Python ``nexusd`` whose lifespan
            # no longer starts a VFS gRPC server (the server moved to Rust /
            # ``nexusd-cluster``) — is tracked separately; until it lands,
            # downstream gRPC-only smoke steps cannot run on this image.
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=VFS gRPC unavailable in edge image::No gRPC listener on 127.0.0.1:${GRPC_PORT}. Edge image ships Python nexusd (no Rust VFS gRPC); permissions demo + build-perf e2e will be skipped. Tracked: https://github.com/nexi-lab/nexus/issues?q=is%3Aissue+VFS+gRPC+edge+image"
          fi

      - name: Run permissions demo
        if: steps.vfs_grpc.outputs.available == 'true'
        run: |
          docker exec \
            -e NEXUS_URL=http://127.0.0.1:2026 \
            -e NEXUS_API_KEY="${NEXUS_API_KEY}" \
            -e NEXUS_PROFILE=remote \
            nexus-e2e bash /tmp/permissions_demo_enhanced.sh

      - name: Seed search index
        run: |
          # Docker Publish uses `nexus demo init --skip-semantic` above to keep
          # demo data seeding fast. Seed search here in one place:
          #   1. nexus reindex --target search  — rebuilds BM25 keyword index from MCL
          #   2. nexus search index /workspace/demo — generates vector embeddings
          # Both are required for HERB hybrid retrieval.

          # Step 1: Rebuild BM25 keyword index from MCL
          echo "Step 1: Rebuilding BM25 keyword index..."
          docker exec \
            -e NEXUS_URL=http://127.0.0.1:2026 \
            -e NEXUS_API_KEY="${NEXUS_API_KEY}" \
            -e NEXUS_PROFILE=remote \
            nexus-e2e nexus reindex --target search || true

          # Step 2: Diagnostics — verify files are in file_paths after demo init.
          # nexus search index queries file_paths WHERE virtual_path LIKE '/workspace/demo/%';
          # if this table is empty the index step returns "Files indexed: 0".
          echo "Step 2: Checking file_paths table after demo init..."
          docker exec -i nexus-e2e python3 - <<'PY' || echo "  (SQL diagnostic unavailable — skipping)"
          from sqlalchemy import create_engine, text
          eng = create_engine("postgresql://postgres:nexus@localhost/nexus")
          with eng.connect() as conn:
              row = conn.execute(text(
                  "SELECT count(*) AS demo_files, min(zone_id) AS min_zone, max(zone_id) AS max_zone "
                  "FROM file_paths WHERE virtual_path LIKE '/workspace/demo%' AND deleted_at IS NULL"
              )).mappings().one()
              op_rows = conn.execute(text(
                  "SELECT count(*) FROM operation_log WHERE path LIKE '/workspace/demo%'"
              )).scalar()
          print(f"  demo_files={row['demo_files']} zones={row['min_zone']}..{row['max_zone']} op_log_rows={op_rows}")
          PY

          # Step 3: Show search daemon stats for diagnostics
          echo "Step 3: Search daemon stats..."
          curl --max-time 5 -sf \
            -H "Authorization: Bearer ${NEXUS_API_KEY}" \
            http://127.0.0.1:2026/api/v2/search/stats 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"  backend={d.get('backend')} bm25_docs={d.get('bm25_documents')} txtai_model={d.get('txtai_model')} last_refresh={d.get('last_index_refresh')}\")" 2>/dev/null || true

          # Step 4: Explicit search index (retry up to 3×).
          # Do this before readiness queries: on cold runners, querying hybrid
          # search while txtai is still warming can block long enough to burn
          # the workflow timeout before explicit indexing ever runs.
          echo "Step 4: Explicit search index (with 3-attempt retry)..."
          for i in $(seq 1 3); do
            idx_out=$(timeout 300s docker exec \
              -e NEXUS_URL=http://127.0.0.1:2026 \
              -e NEXUS_API_KEY="${NEXUS_API_KEY}" \
              -e NEXUS_PROFILE=remote \
              -e NEXUS_GRPC_PORT=2028 \
              -e NEXUS_GRPC_TLS=false \
              nexus-e2e nexus search index /workspace/demo 2>&1 || true)
            files_indexed=$(echo "$idx_out" | grep -oP "Files indexed:\s*\K[0-9]+" || echo "0")
            echo "  attempt ${i}: Files indexed=${files_indexed}"
            if [ "${files_indexed:-0}" -gt 0 ] 2>/dev/null; then
              echo "  Indexing succeeded on attempt ${i}"
              break
            fi
            echo "  0 files — waiting 30s before retry (model may still be loading)..."
            sleep 30
          done

          # Step 5: Final diagnostics and readiness check
          echo "Step 5: Final search daemon stats..."
          curl --max-time 5 -sf \
            -H "Authorization: Bearer ${NEXUS_API_KEY}" \
            http://127.0.0.1:2026/api/v2/search/stats 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"  backend={d.get('backend')} bm25={d.get('bm25_documents')} refresh={d.get('last_index_refresh')}\")" 2>/dev/null || true
          # Final status (non-fatal — test script enforces the HERB gate)
          timeout 30s docker exec \
            -e NEXUS_URL=http://127.0.0.1:2026 \
            -e NEXUS_API_KEY="${NEXUS_API_KEY}" \
            -e NEXUS_PROFILE=remote \
            nexus-e2e nexus search query "Nexus Core" --path /workspace/demo/herb --mode hybrid --limit 1 || true

      # ---------------------------------------------------------------
      # Search HTTP contract smoke (#4616/#4617) — UNCONDITIONAL.
      # The full build-perf script below needs VFS gRPC and is skipped
      # when the edge image lacks it, which previously meant a tag
      # could publish without ANY check that the plugin actually
      # LOADED (TCP bind alone doesn't prove dlopen + signature
      # verification succeeded) or that the repaired wire contracts
      # hold.  This step needs only HTTP, so it always runs: it FAILS
      # the workflow when /search/health is not healthy/degraded (the
      # server→plugin gRPC link end-to-end) or when the /index,
      # /stats, and /query/batch response shapes drift.
      # ---------------------------------------------------------------
      - name: Search HTTP contract smoke
        run: |
          docker exec \
            -e NEXUS_URL=http://127.0.0.1:2026 \
            -e NEXUS_API_KEY="${NEXUS_API_KEY}" \
            -i nexus-e2e python3 - <<'PY'
          import json, os, urllib.request

          url, key = os.environ["NEXUS_URL"], os.environ["NEXUS_API_KEY"]

          def http(method, path, body=None):
              req = urllib.request.Request(
                  f"{url}{path}",
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                  method=method,
              )
              resp = urllib.request.urlopen(req, timeout=60)
              return resp.status, json.loads(resp.read().decode())

          failures = []

          # 1. Plugin actually loaded: the server-side probe + live link.
          st, health = http("GET", "/api/v2/search/health")
          if health.get("status") not in ("healthy", "degraded"):
              failures.append(f"plugin link not healthy: {health}")
          for k in ("initialized", "daemon_initialized", "backend",
                    "bm25_index_loaded", "db_pool_ready", "zoekt_available"):
              if k not in health:
                  failures.append(f"health missing contract key {k!r}: {health}")

          # 2. /index count is a plain int + zoneId casing (#4617).
          st, idx = http("POST", "/api/v2/search/index",
                         {"documents": [{"path": "/workspace/demo/README.md",
                                         "text": "contract smoke seed doc"}]})
          if st != 200 or idx.get("count") != 1 or "zoneId" not in idx or "skippedCount" not in idx:
              failures.append(f"index contract drift (want count==1 int + zoneId + skippedCount): status={st} body={idx}")

          # 3. /stats identity + visibility fields (#4617/#4623).
          st, stats = http("GET", "/api/v2/search/stats")
          for k in ("initialized", "backend", "embedding_model", "indexing_in_progress"):
              if k not in stats:
                  failures.append(f"stats missing contract key {k!r}: {stats}")

          # 4. /query/batch answers with per-entry error semantics (#4616/#4612).
          st, batch = http("POST", "/api/v2/search/query/batch",
                           {"queries": [{"q": "contract smoke seed", "type": "keyword", "limit": 3},
                                        {"q": "bad", "limit": 0}]})
          entries = batch.get("queries", [])
          if st != 200 or len(entries) != 2:
              failures.append(f"batch endpoint broken: status={st} body={batch}")
          else:
              if "error" in entries[0]:
                  failures.append(f"batch valid entry carries error: {entries[0]}")
              if "error" not in entries[1]:
                  failures.append(f"batch invalid spec missing per-entry error: {entries[1]}")

          if failures:
              print("SEARCH CONTRACT SMOKE FAILED:")
              for f in failures:
                  print(f"  - {f}")
              raise SystemExit(1)
          print("search contract smoke OK (health/index/stats/batch)")
          PY

      - name: Run build perf e2e
        if: steps.vfs_grpc.outputs.available == 'true'
        run: |
          docker exec \
            -e NEXUS_URL=http://127.0.0.1:2026 \
            -e NEXUS_API_KEY="${NEXUS_API_KEY}" \
            -e NEXUS_PROFILE=remote \
            -e NEXUS_GRPC_PORT=2028 \
            -e NEXUS_GRPC_TLS=false \
            nexus-e2e python3 /tmp/test_build_perf_e2e.py

      - name: Collect container logs on failure
        if: failure() || cancelled()
        run: |
          docker inspect nexus-e2e --format 'exit_code={{.State.ExitCode}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started_at={{.State.StartedAt}} finished_at={{.State.FinishedAt}} error={{json .State.Error}}' || true
          echo "Crash signatures from container logs:"
          docker logs nexus-e2e 2>&1 | grep -E -m 20 'Illegal instruction|Traceback|ERROR:|FATAL:|panic|segmentation fault|core dumped' || true
          echo "Last 200 container log lines:"
          docker logs nexus-e2e 2>&1 | tail -200 || true

      - name: Collect sidecar logs on failure
        if: failure() || cancelled()
        run: |
          echo "Search-plugin sidecar (published image) last 200 log lines:"
          docker logs --tail=200 nexus-search-plugin-node 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f nexus-e2e 2>/dev/null || true
          docker rm -f nexus-search-plugin-node 2>/dev/null || true
          docker volume rm -f nexus-shared-workspace 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Tag promotion (review R2, #4613 ask 3): mutable/public tags — edge,
  # stable, latest, semver — are applied ONLY after the e2e smoke passed
  # against the immutable staging references.  A broken build therefore
  # leaves every public tag pointing at the last good image instead of
  # shipping and going red after the fact.  Dispatch runs publish only
  # their custom/SHA tag, so there is nothing to promote there.
  # ---------------------------------------------------------------------------
  promote-tags:
    name: Promote release tags
    needs: [build-and-push, push-cluster-manifest, e2e-edge]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine promotion tags (server image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For tagged releases: v1.2.3 -> 1.2.3, latest, stable
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # For main, develop, or tagged releases: edge
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Determine promotion tags (cluster image)
        id: cluster_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}

      # Paired promotion (review R3): the server/plugin-host pair must
      # move in lockstep.  Registries offer no cross-repo transaction,
      # so: capture the cluster tags' PRIOR digests, promote cluster
      # first, then server; if the server promotion fails, restore the
      # cluster tags to their prior digests so the public pair never
      # stays split.  (A pull landing inside the small promote window
      # can still observe a mismatch — deployments needing a hard
      # guarantee pin both images by digest per
      # docs/deployment/search-plugin.md.)
      # DOCKER_METADATA_OUTPUT_JSON holds the LAST metadata-action
      # invocation — both tag sets are pinned explicitly instead.
      - name: Promote paired release tags (rollback on partial failure)
        env:
          SERVER_SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}
          CLUSTER_SOURCE: ${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ needs.push-cluster-manifest.outputs.version }}
          SERVER_TAGS_JSON: ${{ steps.meta.outputs.json }}
          CLUSTER_TAGS_JSON: ${{ steps.cluster_meta.outputs.json }}
        run: |
          set -u
          promote() {
            local source="$1" tags_json="$2"
            local tag_args=()
            while IFS= read -r tag; do
              tag_args+=("-t" "$tag")
            done < <(jq -r '.tags[]' <<< "$tags_json")
            docker buildx imagetools create "${tag_args[@]}" "$source"
          }

          # Snapshot the cluster tags' current digests for rollback.
          declare -A prior_cluster
          while IFS= read -r tag; do
            digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "$digest" ]; then
              prior_cluster["$tag"]="$digest"
            fi
          done < <(jq -r '.tags[]' <<< "$CLUSTER_TAGS_JSON")

          promote "$CLUSTER_SOURCE" "$CLUSTER_TAGS_JSON"

          if ! promote "$SERVER_SOURCE" "$SERVER_TAGS_JSON"; then
            echo "::error::server tag promotion failed — rolling cluster tags back to their prior digests"
            base="${CLUSTER_SOURCE%%:*}"
            for tag in "${!prior_cluster[@]}"; do
              docker buildx imagetools create -t "$tag" "${base}@${prior_cluster[$tag]}" || \
                echo "::error::rollback of $tag failed — pair is split; repair manually"
            done
            exit 1
          fi

      - name: Inspect promoted tags
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ steps.cluster_meta.outputs.version }}"
