name: Docker Publish

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: git SHA short)"
        required: false
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'dockerfiles/**'
      - 'Cargo.toml'
      - 'scripts/nexus_vfs_revision.py'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'src/nexus/**'
      - 'rust/**'
      - 'scripts/test_*plugin.py'
      - 'scripts/test_rust_http_search_cli.py'
      - 'scripts/test_published_search_quality.py'
      - 'scripts/fixtures/herb.json'
      - 'scripts/prepare_published_fixture.sh'
      - 'scripts/ts_search_fixture.py'
      - 'packages/nexus-api-client/**'
      - 'packages/nexus-tui/**'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nexus
  # Plugin-host image (#4613): nexusd-cluster + signed search plugin.
  # Post-P12 the Rust plugin is the sole search backend, so a published
  # server image without a published plugin-host image cannot serve
  # search — the two are tagged from the same commit so deployments can
  # pin the pairing by digest.
  CLUSTER_IMAGE_NAME: ${{ github.repository_owner }}/nexusd-cluster

jobs:
  # Review R3: a workflow_dispatch custom tag is pushed as the
  # immutable staging reference BEFORE the smoke — so it must never be
  # allowed to name a public release tag, or the smoke gate is
  # bypassed by typing "edge" into the dispatch box.
  validate-inputs:
    name: Validate dispatch inputs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Reject reserved release tags as custom dispatch tags
        env:
          CUSTOM_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$CUSTOM_TAG" ]; then
            echo "no custom tag — nothing to validate"
            exit 0
          fi
          if printf '%s' "$CUSTOM_TAG" | grep -qE '^(edge|stable|latest|v?[0-9]+(\.[0-9]+)*.*)$'; then
            echo "::error::custom tag '$CUSTOM_TAG' is a reserved release tag — release tags are only applied by promote-tags AFTER the e2e smoke passes"
            exit 1
          fi
          echo "custom tag '$CUSTOM_TAG' accepted"

  # Fan out amd64 and arm64 onto native GitHub-hosted runners; emit one
  # push-by-digest image per platform. QEMU-emulated multi-arch on a
  # single ubuntu-latest runner is 5-10x slower than native and times
  # out on heavy images. `ubuntu-24.04-arm` is free for public repos
  # (GA early 2025) and private repos (GA 2026-01-29).
  # See docs: https://docs.docker.com/build/ci/github-actions/multi-platform/
  build-platform:
    name: Build ${{ matrix.platform }}
    needs: [validate-inputs]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize platform pair (for artifact name)
        id: pair
        run: |
          pair="${{ matrix.platform }}"
          echo "value=${pair//\//-}" >> "$GITHUB_OUTPUT"
          # Each Git ref uses its own build cache.
          cache_ref="$(printf '%s' "$GITHUB_REF" | sha256sum | cut -d' ' -f1)"
          echo "cache_ref=$cache_ref" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-publish-${{ steps.pair.outputs.cache_ref }}-${{ steps.pair.outputs.value }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-publish-${{ steps.pair.outputs.cache_ref }}-${{ steps.pair.outputs.value }},mode=max,ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-docker-publish-${{ steps.pair.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    name: Build & push multi-arch image
    needs: [build-platform]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-docker-publish-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Review R2 (#4613 ask 3): this job pushes ONLY the immutable
      # staging reference (commit SHA, or the dispatch's custom tag).
      # Every mutable/public tag — edge, stable, latest, semver — is
      # promoted by the promote-tags job AFTER the e2e smoke passes,
      # so a broken image can no longer land on a tag the public pulls.
      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,prefix=,enable=${{ github.event.inputs.tag == '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t image_tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${image_tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          digest_args=()
          for digest in *; do
            digest_args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${digest_args[@]}"

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

  # ---------------------------------------------------------------------------
  # Plugin-host image (#4613): nexusd-cluster + signed nexus-search-plugin
  # baked into /plugins.  Built from dockerfiles/Dockerfile.nexusd-cluster-plugins
  # (self-contained — cluster binary from the pinned nexus-vfs rev, plugin
  # cdylib from this repo, Ed25519 signing in-build) and published with the
  # SAME tag set as the server image so every server tag has a matching
  # plugin-host tag from the same commit.
  # ---------------------------------------------------------------------------
  build-cluster-platform:
    name: Build cluster ${{ matrix.platform }}
    needs: [validate-inputs]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check plugin signing key availability
        env:
          PLUGIN_SIGNING_PRIVKEY: ${{ secrets.PLUGIN_SIGNING_PRIVKEY }}
        run: |
          if [ -z "$PLUGIN_SIGNING_PRIVKEY" ]; then
            echo "::error::PLUGIN_SIGNING_PRIVKEY secret is not available — cannot sign the plugin, and an unsigned plugin would only defer the failure to daemon boot."
            exit 1
          fi

      - name: Read NEXUS_VFS_REV from Cargo.toml
        id: vfs_rev
        run: |
          sha=$(python3 scripts/nexus_vfs_revision.py)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout nexus-vfs source at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: nexi-lab/nexus-vfs
          ref: ${{ steps.vfs_rev.outputs.sha }}
          path: nexus-vfs-src
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize platform pair (for artifact name)
        id: pair
        run: |
          pair="${{ matrix.platform }}"
          echo "value=${pair//\//-}" >> "$GITHUB_OUTPUT"
          # Each Git ref uses its own build cache.
          cache_ref="$(printf '%s' "$GITHUB_REF" | sha256sum | cut -d' ' -f1)"
          echo "cache_ref=$cache_ref" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.nexusd-cluster-plugins
          build-contexts: |
            nexus-vfs-src=nexus-vfs-src
          secrets: |
            plugin_signing_key=${{ secrets.PLUGIN_SIGNING_PRIVKEY }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:buildcache-publish-${{ steps.pair.outputs.cache_ref }}-${{ steps.pair.outputs.value }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:buildcache-publish-${{ steps.pair.outputs.cache_ref }}-${{ steps.pair.outputs.value }},mode=max,ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-cluster-publish-${{ steps.pair.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-cluster-manifest:
    name: Push multi-arch cluster image
    needs: [build-cluster-platform]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-cluster-publish-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable staging reference only — mutable tags are promoted
      # after the smoke by promote-tags (same rule as the server image).
      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,prefix=,enable=${{ github.event.inputs.tag == '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t image_tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${image_tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          digest_args=()
          for digest in *; do
            digest_args+=("${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}@sha256:${digest}")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${digest_args[@]}"

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

  # ---------------------------------------------------------------------------
  # E2E smoke tests against the just-pushed IMMUTABLE image references.
  # Runs for EVERY publishing trigger (develop, main, tags, dispatch) —
  # review R2: a publish path that skips the smoke can ship a plugin
  # that never loaded.  Mutable tags (edge/stable/latest/semver) are
  # only promoted by promote-tags after this job passes.
  # ---------------------------------------------------------------------------
  e2e-edge:
    name: E2E edge smoke tests
    needs: [build-and-push, push-cluster-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache embedder assets (ORT dylib + mE5-small model)
        uses: actions/cache@v4
        with:
          path: /tmp/nexus-embedder
          key: nexus-embedder-ort-1.28.0-me5small-onnx-v1

      - name: Provision embedder assets for the search-plugin sidecar
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: |
          set -euo pipefail
          ORT_VERSION=1.28.0   # ort 2.0.0-rc.13 (Cargo.lock) is built for ONNX Runtime 1.28
          ASSETS=/tmp/nexus-embedder
          mkdir -p "$ASSETS/ort" "$ASSETS/model"

          if [ ! -f "$ASSETS/ort/libonnxruntime.so" ]; then
            curl -fL --retry 5 --retry-delay 2 \
              -o /tmp/onnxruntime.tgz \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
            tar -xzf /tmp/onnxruntime.tgz -C /tmp
            # Copy the real versioned .so to a stable mount name.
            cp "/tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" \
              "$ASSETS/ort/libonnxruntime.so"
          fi

          # The model comes from our own COS mirror, never from
          # huggingface.co.  HF rate-limits GitHub's runner IP ranges and
          # answers 429 to every retry while it does; that failed this step,
          # which meant the cache above never got written, which meant the
          # next run missed the cache and hit the same 429 — a loop with no
          # exit once the cache expired.  `mirror-embedder-assets.yml` puts
          # the bytes somewhere we control; refresh it when the model moves.
          if [ -z "$COS_BUCKET" ]; then
            echo "::error::COS_BUCKET is not configured; the embedder mirror is unreachable."
            exit 1
          fi
          MIRROR="https://${COS_BUCKET}.cos.accelerate.myqcloud.com/nexus/embedder/intfloat-multilingual-e5-small/onnx"

          # Layout contract from FastEmbedder::load (embedder.rs): the
          # five files of the HF onnx/ export, flat in the model dir.
          for f in model.onnx tokenizer.json config.json special_tokens_map.json tokenizer_config.json; do
            if [ ! -s "$ASSETS/model/$f" ]; then
              curl -fL --retry 5 --retry-delay 2 -o "$ASSETS/model/$f" "$MIRROR/$f"
            fi
          done

          # Verify the bytes, cached or freshly pulled: a truncated model
          # fails at inference time as a scoring regression, which reads as
          # a product bug rather than a bad download.
          curl -fsSL --retry 5 -o /tmp/embedder-SHA256SUMS.txt "$MIRROR/SHA256SUMS.txt"
          (cd "$ASSETS/model" && sha256sum -c /tmp/embedder-SHA256SUMS.txt)

          # Sidecar runs as nexus (UID 1000) — must be able to read.
          chmod -R a+rX "$ASSETS"
          ls -la "$ASSETS/ort" "$ASSETS/model"

      - name: Start the published SDK image
        run: |
          docker run -d --name nexus-e2e --network host --no-healthcheck \
            -v "${GITHUB_WORKSPACE}:/tests:ro" \
            --entrypoint sleep \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}" infinity

      - name: Start the published Rust Search host with the local embedder
        run: |
          docker run -d --name nexus-search-plugin-node --network host \
            -e NEXUS_BIND_ADDR=127.0.0.1:2126 \
            -e NEXUS_ADVERTISE_ADDR=127.0.0.1:2126 \
            -e NEXUS_HTTP_ADDR=127.0.0.1:2127 \
            -e NEXUS_REBAC_ENABLED=true \
            -e NEXUS_API_KEY_SECRET=search-quality-ci-only \
            -e NEXUS_CLUSTER_INIT=sharedzone \
            -e NEXUS_CLUSTER_INIT_MOUNTS=/workspace=sharedzone \
            -e ORT_DYLIB_PATH=/embedder/ort/libonnxruntime.so \
            -e NEXUS_SEARCH_MODEL_DIR=/embedder/model \
            -e NEXUS_SEARCH_QUERY_EXPANSION=false \
            -e NEXUS_SEARCH_CONTEXTUAL_CHUNKING=false \
            -e NEXUS_SEARCH_EMBED_API_URL= \
            -v /tmp/nexus-embedder:/embedder:ro \
            "${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ needs.push-cluster-manifest.outputs.version }}" \
            --data-dir /app/data --plugin-dir /plugins
          bash scripts/prepare_published_fixture.sh nexus-search-plugin-node nexus-e2e /tmp/search-quality

      - name: Verify SearchService against the published plugin
        run: |
          docker exec \
            -e NEXUS_SEARCH_PLUGIN_TARGET=127.0.0.1:2126 \
            -e NEXUS_SEARCH_PLUGIN_TLS=true \
            -e NEXUS_SEARCH_PLUGIN_TLS_CA=/tmp/search-quality/tls/ca.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_CERT=/tmp/search-quality/tls/node.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_KEY=/tmp/search-quality/tls/node-key.pem \
            -e NEXUS_SEARCH_TEST_ADMIN_KEY=/tmp/search-quality/search-admin-key \
            nexus-e2e python /tests/scripts/test_search_service_plugin.py

      - name: Verify VFS indexing visibility and published hybrid retrieval quality
        run: |
          docker exec \
            -e NEXUS_SEARCH_PLUGIN_TARGET=127.0.0.1:2126 \
            -e NEXUS_SEARCH_TEST_HTTP=http://127.0.0.1:2127 \
            -e NEXUS_SEARCH_PLUGIN_TLS_CA=/tmp/search-quality/tls/ca.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_CERT=/tmp/search-quality/tls/node.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_KEY=/tmp/search-quality/tls/node-key.pem \
            -e NEXUS_SEARCH_TEST_ADMIN_KEY=/tmp/search-quality/search-admin-key \
            nexus-e2e python /tests/scripts/test_published_search_quality.py

      - name: Verify caller credentials with production ReBAC and node mTLS
        run: |
          docker exec nexus-e2e python -c "from sqlalchemy import create_engine; from nexus.storage.models.path_context import PathContextModel; PathContextModel.__table__.create(create_engine('sqlite:////tmp/search-path-contexts.db'))"
          docker cp nexus-e2e:/tmp/search-path-contexts.db /tmp/search-path-contexts.db
          chmod a+rw /tmp/search-path-contexts.db
          docker run -d --name nexus-search-credentials-node --network host \
            -e NEXUS_BIND_ADDR=127.0.0.1:2326 \
            -e NEXUS_ADVERTISE_ADDR=127.0.0.1:2326 \
            -e NEXUS_HTTP_ADDR=127.0.0.1:2327 \
            -e DATABASE_URL=sqlite:////app/data/path-contexts.db \
            -e NEXUS_PATH_CONTEXT_FRESHNESS_SECONDS=3600 \
            -e NEXUS_REBAC_ENABLED=true \
            -e NEXUS_API_KEY_SECRET=search-credentials-ci-only \
            -e NEXUS_CLUSTER_INIT=sharedzone \
            -e NEXUS_CLUSTER_INIT_MOUNTS=/docs=sharedzone \
            -e ORT_DYLIB_PATH=/embedder/ort/libonnxruntime.so \
            -e NEXUS_SEARCH_MODEL_DIR=/embedder/model \
            -e NEXUS_SEARCH_QUERY_EXPANSION=false \
            -e NEXUS_SEARCH_CONTEXTUAL_CHUNKING=false \
            -e NEXUS_SEARCH_EMBED_API_URL= \
            -v /tmp/search-path-contexts.db:/app/data/path-contexts.db \
            -v /tmp/nexus-embedder:/embedder:ro \
            "${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ needs.push-cluster-manifest.outputs.version }}" \
            --data-dir /app/data --plugin-dir /plugins
          bash scripts/prepare_published_fixture.sh nexus-search-credentials-node nexus-e2e /tmp/search-credentials
          docker cp scripts/test_search_credentials_plugin.py nexus-e2e:/tmp/test_search_credentials_plugin.py
          docker exec \
            -e NEXUS_SEARCH_PLUGIN_TARGET=127.0.0.1:2326 \
            -e NEXUS_SEARCH_PLUGIN_TLS=true \
            -e NEXUS_SEARCH_PLUGIN_TLS_CA=/tmp/search-credentials/tls/ca.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_CERT=/tmp/search-credentials/tls/node.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_KEY=/tmp/search-credentials/tls/node-key.pem \
            -e NEXUS_SEARCH_TEST_ADMIN_KEY=/tmp/search-credentials/search-admin-key \
            nexus-e2e python /tmp/test_search_credentials_plugin.py

      - name: Verify SDK discovery against the signed Search plugin
        run: |
          docker cp scripts/test_discovery_service_plugin.py nexus-e2e:/tmp/test_discovery_service_plugin.py
          docker exec \
            -e NEXUS_SEARCH_PLUGIN_TARGET=127.0.0.1:2326 \
            -e NEXUS_SEARCH_TEST_HTTP=http://127.0.0.1:2327 \
            -e NEXUS_TLS_CA=/tmp/search-credentials/tls/ca.pem \
            -e NEXUS_TLS_CERT=/tmp/search-credentials/tls/node.pem \
            -e NEXUS_TLS_KEY=/tmp/search-credentials/tls/node-key.pem \
            -e NEXUS_SEARCH_TEST_ADMIN_KEY=/tmp/search-credentials/search-admin-key \
            nexus-e2e python /tmp/test_discovery_service_plugin.py

      - name: Verify Search CLI against Rust HTTP
        run: |
          docker cp scripts/test_rust_http_search_cli.py nexus-e2e:/tmp/test_rust_http_search_cli.py
          docker cp scripts/bench_gbrain_evals.py nexus-e2e:/tmp/bench_gbrain_evals.py
          docker exec \
            -e NEXUS_SEARCH_PLUGIN_TARGET=127.0.0.1:2326 \
            -e NEXUS_SEARCH_PLUGIN_TLS_CA=/tmp/search-credentials/tls/ca.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_CERT=/tmp/search-credentials/tls/node.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_KEY=/tmp/search-credentials/tls/node-key.pem \
            -e NEXUS_SEARCH_TEST_ADMIN_KEY=/tmp/search-credentials/search-admin-key \
            nexus-e2e python /tmp/test_rust_http_search_cli.py

      - name: Verify agent SDK files Search and live authorization
        run: |
          docker cp scripts/test_search_agent_credentials_plugin.py nexus-e2e:/tmp/test_search_agent_credentials_plugin.py
          docker exec \
            -e NEXUS_SEARCH_PLUGIN_TARGET=127.0.0.1:2326 \
            -e NEXUS_SEARCH_PLUGIN_TLS_CA=/tmp/search-credentials/tls/ca.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_CERT=/tmp/search-credentials/tls/node.pem \
            -e NEXUS_SEARCH_PLUGIN_TLS_KEY=/tmp/search-credentials/tls/node-key.pem \
            -e NEXUS_SEARCH_TEST_ADMIN_KEY=/tmp/search-credentials/search-admin-key \
            -e NEXUS_SEARCH_TEST_AGENT_A=/tmp/search-credentials/agent-a \
            -e NEXUS_SEARCH_TEST_AGENT_B=/tmp/search-credentials/agent-b \
            nexus-e2e python /tmp/test_search_agent_credentials_plugin.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build the TypeScript transport and install the TUI
        run: |
          cd packages/nexus-api-client
          npm ci
          npm run build
          cd ../nexus-tui
          bun install --frozen-lockfile

      - name: Prepare native TypeScript Search facts and credentials
        run: |
          while read -r label grpc_port http_port credentials root; do
            docker exec \
              -e NEXUS_TS_SEARCH_FIXTURE="/tmp/ts-search-${label}.json" \
              -e NEXUS_TS_SEARCH_ROOT="$root" \
              -e NEXUS_SEARCH_TEST_HTTP="http://127.0.0.1:${http_port}" \
              -e NEXUS_SEARCH_PLUGIN_TARGET="127.0.0.1:${grpc_port}" \
              -e NEXUS_SEARCH_PLUGIN_TLS_CA="/tmp/${credentials}/tls/ca.pem" \
              -e NEXUS_SEARCH_PLUGIN_TLS_CERT="/tmp/${credentials}/tls/node.pem" \
              -e NEXUS_SEARCH_PLUGIN_TLS_KEY="/tmp/${credentials}/tls/node-key.pem" \
              -e NEXUS_SEARCH_TEST_ADMIN_KEY="/tmp/${credentials}/search-admin-key" \
              nexus-e2e python /tests/scripts/ts_search_fixture.py prepare
            docker cp "nexus-e2e:/tmp/ts-search-${label}.json" "/tmp/ts-search-${label}.json"
          done <<'FIXTURES'
          keyword 2326 2327 search-credentials /docs
          hybrid 2126 2127 search-quality /workspace
          FIXTURES

      - name: Verify Search through the real TUI worker and terminal renderer
        working-directory: packages/nexus-tui
        env:
          NEXUS_TS_SEARCH_FIXTURE: /tmp/ts-search-keyword.json
          NEXUS_TS_SEARCH_HYBRID_FIXTURE: /tmp/ts-search-hybrid.json
        run: |
          test -s "$NEXUS_TS_SEARCH_FIXTURE"
          test -s "$NEXUS_TS_SEARCH_HYBRID_FIXTURE"
          bun test --timeout 30000 tests/e2e/native-search.test.tsx

      - name: Clean up TypeScript Search facts and credentials
        if: always()
        run: |
          for label in keyword hybrid; do
            destination="/tmp/ts-search-${label}.json"
            if docker exec nexus-e2e test -s "$destination"; then
              docker exec -e NEXUS_TS_SEARCH_FIXTURE="$destination" \
                nexus-e2e python /tests/scripts/ts_search_fixture.py cleanup
            fi
          done

      - name: Collect container logs on failure
        if: failure() || cancelled()
        run: |
          docker inspect nexus-e2e --format 'exit_code={{.State.ExitCode}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started_at={{.State.StartedAt}} finished_at={{.State.FinishedAt}} error={{json .State.Error}}' || true
          echo "Crash signatures from container logs:"
          docker logs nexus-e2e 2>&1 | grep -E -m 20 'Illegal instruction|Traceback|ERROR:|FATAL:|panic|segmentation fault|core dumped' || true
          echo "Last 200 container log lines:"
          docker logs nexus-e2e 2>&1 | tail -200 || true

      - name: Collect sidecar logs on failure
        if: failure() || cancelled()
        run: |
          echo "Search-plugin sidecar (published image) last 200 log lines:"
          docker logs --tail=200 nexus-search-plugin-node 2>&1 || true
          docker logs --tail=200 nexus-search-credentials-node 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f nexus-e2e 2>/dev/null || true
          docker rm -f nexus-search-plugin-node 2>/dev/null || true
          docker rm -f nexus-search-credentials-node 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Tag promotion (review R2, #4613 ask 3): mutable/public tags — edge,
  # stable, latest, semver — are applied ONLY after the e2e smoke passed
  # against the immutable staging references.  A broken build therefore
  # leaves every public tag pointing at the last good image instead of
  # shipping and going red after the fact.  Dispatch runs publish only
  # their custom/SHA tag, so there is nothing to promote there.
  # ---------------------------------------------------------------------------
  promote-tags:
    name: Promote release tags
    needs: [build-and-push, push-cluster-manifest, e2e-edge]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine promotion tags (server image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For tagged releases: v1.2.3 -> 1.2.3, latest, stable
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # For main, develop, or tagged releases: edge
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Determine promotion tags (cluster image)
        id: cluster_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}

      # Paired promotion (review R3): the server/plugin-host pair must
      # move in lockstep.  Registries offer no cross-repo transaction,
      # so: capture the cluster tags' PRIOR digests, promote cluster
      # first, then server; if the server promotion fails, restore the
      # cluster tags to their prior digests so the public pair never
      # stays split.  (A pull landing inside the small promote window
      # can still observe a mismatch — deployments needing a hard
      # guarantee pin both images by digest per
      # docs/deployment/search-plugin.md.)
      # DOCKER_METADATA_OUTPUT_JSON holds the LAST metadata-action
      # invocation — both tag sets are pinned explicitly instead.
      - name: Promote paired release tags (rollback on partial failure)
        env:
          SERVER_SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}
          CLUSTER_SOURCE: ${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ needs.push-cluster-manifest.outputs.version }}
          SERVER_TAGS_JSON: ${{ steps.meta.outputs.json }}
          CLUSTER_TAGS_JSON: ${{ steps.cluster_meta.outputs.json }}
        run: |
          # Strict mode (review R5): an unguarded cluster-promotion
          # failure previously fell through to server promotion,
          # leaving the pair split behind a green step.  Every
          # promotion is now explicitly branch-guarded; -e catches
          # anything unguarded, pipefail catches jq/inspect pipes.
          set -euo pipefail
          promote() {
            local source="$1" tags_json="$2"
            local tag_args=()
            while IFS= read -r tag; do
              tag_args+=("-t" "$tag")
            done < <(jq -r '.tags[]' <<< "$tags_json")
            docker buildx imagetools create "${tag_args[@]}" "$source"
          }

          # Symmetric snapshot + rollback for ONE image repo (review
          # R6/R7).  Snapshot is FAIL-CLOSED: only a positively
          # identified manifest-not-found marks a tag as new; any
          # other inspect failure (network/auth/registry) aborts the
          # step BEFORE any promotion, so rollback never acts on a
          # guessed state.  Rollback restores prior digests only —
          # GHCR's package API deletes whole VERSIONS (a version
          # carries EVERY tag aliased to that manifest, including the
          # immutable staging SHA), so freshly minted tags are never
          # API-deleted; they are reported for manual removal instead.
          snapshot() {
            # $1 = tags_json; echoes "tag digest" lines (digest empty = new)
            local tag digest err
            while IFS= read -r tag; do
              if digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/tmp/inspect-err); then
                printf '%s %s\n' "$tag" "$digest"
              else
                err=$(cat /tmp/inspect-err)
                if printf '%s' "$err" | grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN|no such manifest'; then
                  printf '%s \n' "$tag"
                else
                  echo "::error::could not snapshot $tag before promotion (treating as fatal, not as a new tag): $err" >&2
                  return 1
                fi
              fi
            done < <(jq -r '.tags[]' <<< "$1")
          }

          rollback_image() {
            # $1 = source ref (for base repo), $2 = snapshot lines
            local base="${1%%:*}"
            while IFS=' ' read -r tag digest; do
              [ -z "$tag" ] && continue
              if [ -n "$digest" ]; then
                docker buildx imagetools create -t "$tag" "${base}@${digest}" || \
                  echo "::error::rollback of $tag failed — repair manually"
              else
                echo "::error::tag $tag was freshly minted by this failed promotion — remove it manually (GHCR has no safe single-tag delete; the package-version API would also delete the staging SHA aliased to the same manifest)"
              fi
            done <<< "$2"
          }

          if ! cluster_snapshot=$(snapshot "$CLUSTER_TAGS_JSON"); then
            exit 1
          fi
          if ! server_snapshot=$(snapshot "$SERVER_TAGS_JSON"); then
            exit 1
          fi

          if ! promote "$CLUSTER_SOURCE" "$CLUSTER_TAGS_JSON"; then
            echo "::error::cluster tag promotion failed — rolling back partial cluster tags"
            rollback_image "$CLUSTER_SOURCE" "$cluster_snapshot"
            exit 1
          fi

          if ! promote "$SERVER_SOURCE" "$SERVER_TAGS_JSON"; then
            echo "::error::server tag promotion failed — rolling back BOTH image repos (a multi-tag promote may have partially applied)"
            rollback_image "$SERVER_SOURCE" "$server_snapshot"
            rollback_image "$CLUSTER_SOURCE" "$cluster_snapshot"
            exit 1
          fi

      - name: Inspect promoted tags
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.CLUSTER_IMAGE_NAME }}:${{ steps.cluster_meta.outputs.version }}"
