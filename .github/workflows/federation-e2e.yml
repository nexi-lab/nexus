name: Federation E2E

# Runs `tests/e2e/docker/test_federation_runbook.py` against the
# 3-voter HA cluster in
# `dockerfiles/docker-compose.federation-runbook.yml`.  The suite
# binds 1-to-1 to docs/architecture/federation-cross-machine-runbook.html
# and locks the cross-machine L1 milestone (Win↔Mac sharedzone byte-
# exact read, landed 2026-06-06) into CI so the six-months bug class
# the runbook describes cannot regress silently.
#
# Why this is a separate workflow (vs docker-integration.yml):
#   docker-integration.yml is disabled per #1720 and exercises a much
#   broader matrix (mounts, MCP, skills, postgres, …). Re-enabling all
#   of it is its own scope. This workflow targets the federation
#   surface only — small, fast, deterministic.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'dockerfiles/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'rust/**'
      # Federation-relevant Python surfaces only — avoid spinning up the
      # full Docker matrix for unrelated src/nexus/ changes (e.g. search,
      # rebac, sandbox, tui). The job builds the image from src/nexus
      # via Dockerfile, but the *test* surface only exercises the raft +
      # gRPC + federation handshake paths, so the trigger should match.
      - 'src/nexus/raft/**'
      - 'src/nexus/grpc/**'
      - 'src/nexus/remote/**'
      - 'src/nexus/server/rpc/services/federation_rpc.py'
      - 'src/nexus/server/rpc/services/__init__.py'
      - 'src/nexus/cli/commands/federation.py'
      - 'src/nexus/cli/commands/zone.py'
      - 'tests/e2e/docker/test_federation*.py'
      - '.dockerignore'
      - '.github/workflows/federation-e2e.yml'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  federation-e2e:
    name: Federation E2E (Docker)
    runs-on: ubuntu-latest
    # Cold cache: image build + cluster up + 58 tests is ~12-15 min on
    # 2-vCPU runners. Warm gha cache shaves the rust compile to ~2 min.
    # 30 min upper bound leaves margin for slow-building dependencies.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect federation-relevant changes
        id: federation_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --prune origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD > /tmp/federation_changed_files.txt
          cat /tmp/federation_changed_files.txt

          # Note: the workflow file itself is intentionally NOT in this regex.
          # Editing federation-e2e.yml on a PR should not force a full Docker
          # cluster build for an unrelated change. Workflow validation runs
          # on the post-merge push to develop via on.push.paths.
          if grep -Eq '^(Dockerfile|dockerfiles/|Cargo\.toml$|Cargo\.lock$|pyproject\.toml$|rust/|src/nexus/raft/|src/nexus/grpc/|src/nexus/remote/|src/nexus/server/rpc/services/federation_rpc\.py$|src/nexus/server/rpc/services/__init__\.py$|src/nexus/cli/commands/federation\.py$|src/nexus/cli/commands/zone\.py$|tests/e2e/docker/test_federation.*\.py$|tests/e2e/docker/runbook_helpers\.py$|\.dockerignore$)' /tmp/federation_changed_files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip federation E2E
        if: steps.federation_changes.outputs.run != 'true'
        run: |
          echo "No federation-relevant files changed; reporting required check without running Docker federation suite."

      - name: Set up Docker Buildx
        if: steps.federation_changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      # Pin SSOT: the nexus-vfs SHA the cluster binary + plugin dylibs
      # compile against lives in `Cargo.toml`'s workspace dep rev.
      # Parse it once and reuse for the checkout step below.
      - name: Read NEXUS_VFS_REV from Cargo.toml
        if: steps.federation_changes.outputs.run == 'true'
        id: vfs_rev
        run: |
          sha=$(grep -oP '(?<=rev = ")[a-f0-9]{40}' Cargo.toml | sort -u | head -1)
          if [ -z "$sha" ]; then
            echo "::error::Could not parse nexus-vfs SHA from Cargo.toml"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved nexus-vfs SHA: $sha"

      - name: Checkout nexus-vfs source at pinned SHA
        if: steps.federation_changes.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: nexi-lab/nexus-vfs
          ref: ${{ steps.vfs_rev.outputs.sha }}
          path: nexus-vfs-src
          fetch-depth: 1

      # Build the production cluster image first, with a registry
      # cache. The federation-test runner FROMs the same image so
      # both stay on one buildx instance.  `build-contexts` feeds the
      # checked-out nexus-vfs source tree to the Dockerfile's
      # `COPY --from=nexus-vfs-src` step.
      - name: Build nexusd-cluster image
        if: steps.federation_changes.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.nexusd-cluster
          build-contexts: |
            nexus-vfs-src=nexus-vfs-src
          load: true
          tags: nexusd-cluster:latest
          cache-from: type=gha,scope=federation-e2e
          cache-to: type=gha,scope=federation-e2e,mode=max

      - name: Build witness + federation-test images
        if: steps.federation_changes.outputs.run == 'true'
        # BUILDX_BUILDER=default forces this compose build to use the
        # docker-daemon builder rather than setup-buildx-action@v3's
        # docker-container builder.  Dockerfile.federation-test starts
        # `FROM nexusd-cluster:latest`; that image was loaded into the
        # daemon by the previous step's `load: true`, but a docker-
        # container builder runs in an isolated context that does NOT
        # see locally-loaded daemon images and tries to pull from
        # Docker Hub instead — which fails because the image is not
        # published.  Switching to the default builder for this step
        # resolves the FROM against the local daemon, which is the
        # correct boundary for an inter-image dependency built within
        # the same workflow run.
        env:
          BUILDX_BUILDER: default
        run: |
          docker compose -f dockerfiles/docker-compose.federation-runbook.yml build \
            witness test

      - name: Start federation cluster
        if: steps.federation_changes.outputs.run == 'true'
        run: |
          docker compose -f dockerfiles/docker-compose.federation-runbook.yml up -d \
            founder joiner witness
          docker compose -f dockerfiles/docker-compose.federation-runbook.yml ps

      - name: Wait for all three voters healthy
        if: steps.federation_changes.outputs.run == 'true'
        run: |
          deadline=$((SECONDS + 180))
          while [ $SECONDS -lt $deadline ]; do
            if docker exec nexus-runbook-founder bash -c 'timeout 1 bash -c "</dev/tcp/localhost/2126" 2>/dev/null' \
            && docker exec nexus-runbook-joiner bash -c 'timeout 1 bash -c "</dev/tcp/localhost/2126" 2>/dev/null' \
            && docker exec nexus-runbook-witness bash -c 'timeout 1 bash -c "</dev/tcp/localhost/2126" 2>/dev/null'; then
              echo "All three voters healthy (gRPC port 2126 reachable) after ${SECONDS}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Timed out waiting for voters ready (180s)"
          docker compose -f dockerfiles/docker-compose.federation-runbook.yml logs --tail=300
          exit 1

      - name: Run federation runbook E2E tests
        if: steps.federation_changes.outputs.run == 'true'
        run: |
          docker compose -f dockerfiles/docker-compose.federation-runbook.yml \
            run --rm test

      - name: Dump container logs on failure
        if: failure() && steps.federation_changes.outputs.run == 'true'
        run: |
          for c in nexus-runbook-founder nexus-runbook-joiner nexus-runbook-witness; do
            echo "::group::$c"
            docker logs $c --tail=400 2>&1 || echo "(no logs)"
            echo "::endgroup::"
          done

      - name: Tear down
        if: always() && steps.federation_changes.outputs.run == 'true'
        run: |
          docker compose -f dockerfiles/docker-compose.federation-runbook.yml down -v --remove-orphans || true
