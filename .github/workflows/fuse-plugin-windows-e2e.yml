name: FUSE Plugin Windows E2E

# Runs `tests/e2e/windows/test_fuse_plugin_winfsp_e2e.py` against a
# real WinFsp mount on a `windows-latest` runner.
#
# Unlike the Linux E2E (which uses Docker because /dev/fuse fits the
# container model), this suite runs natively — WinFsp is a Windows
# kernel driver and there's no equivalent container surface.  The
# runner installs WinFsp via chocolatey, builds nexusd-cluster + the
# signed FUSE plugin dylib, mounts the plugin at a drive letter, and
# exercises every WinFsp callback the v3 KernelHandle adapter wires
# via plain `cmd.exe` commands with a gRPC `vfs_stat` / `vfs_read`
# cross-check at every step.
#
# Cross-layer pattern matches `cc-tasks-share-e2e.yml` (Linux Docker
# E2E covering FUSE + LocalConnector + federation) so a regression
# on either the plugin or the kernel side surfaces as a mismatch
# rather than a silent pass.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'rust/services/fuse-plugin/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/windows/**'
      - '.github/workflows/fuse-plugin-windows-e2e.yml'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuse-plugin-windows-e2e:
    name: FUSE Plugin Windows E2E
    runs-on: windows-latest
    # Cold cache: cluster + plugin build + WinFsp install + test
    # suite is ~15 min; 30 min upper bound matches the Linux E2E's
    # budget with margin for Windows-specific overhead (slower disk).
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Windows-FUSE-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --prune origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD > /tmp/changed_files.txt
          cat /tmp/changed_files.txt
          if grep -Eq '^(rust/services/fuse-plugin/|Cargo\.toml$|Cargo\.lock$|tests/e2e/windows/|\.github/workflows/fuse-plugin-windows-e2e\.yml$)' /tmp/changed_files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — no relevant changes
        if: steps.changes.outputs.run != 'true'
        run: |
          echo "No FUSE-plugin-relevant Windows changes; reporting required check without running suite."

      # WinFsp is the Windows kernel-side userspace-filesystem driver the
      # plugin depends on at runtime.  Pull the fixed-version .msi from the
      # VENDOR GitHub release behind an actions/cache — NOT
      # `choco install winfsp`.  community.chocolatey.org is a rate-limited
      # free service that explicitly warns against CI use; a 503/rate-limit
      # there failed this job even though our code is fine, and it recurs.
      # Caching the pinned .msi keeps the hot path network-free on a cache
      # hit and, on the one-time miss, fetches the release origin (not
      # Chocolatey's re-host).  Mirrors the #4646 cache-then-download
      # pattern used for the ORT dylib + fastembed model.
      - name: Cache WinFsp installer (pinned .msi)
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\winfsp.msi
          key: winfsp-msi-2.1.25156

      - name: Install WinFsp (vendor .msi, no Chocolatey)
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\winfsp.msi"
          if (-not (Test-Path $msi)) {
            $url = 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi'
            Write-Host "WinFsp installer cache miss; downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          } else {
            Write-Host "WinFsp installer restored from cache"
          }
          # Silent install (runner is Administrator); WinFsp lands the .sys
          # driver + userspace DLL under C:\Program Files (x86)\WinFsp\.
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "msiexec returned $($p.ExitCode) installing WinFsp"
            exit 1
          }
          # Verify the driver landed.
          if (-not (Test-Path 'C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll')) {
            Write-Error "WinFsp install did not place winfsp-x64.dll"
            exit 1
          }

      # windows-latest has LLVM preinstalled at C:\Program Files\LLVM
      # — winfsp-sys's build script needs libclang via LIBCLANG_PATH.
      - name: Verify LLVM present (LIBCLANG_PATH)
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) {
            Write-Error "Expected libclang.dll at C:\Program Files\LLVM\bin\ (windows-latest preinstall)"
            exit 1
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        if: steps.changes.outputs.run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Match pyproject.toml's `requires-python = ">=3.14"`.  Without
      # this, windows-latest's default Python (3.13.x today) rejects
      # `pip install -e .` with ERROR: requires a different Python.
      - name: Install Python 3.14
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Rust cache
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuse-plugin-windows-e2e

      # SSOT: the nexus-vfs SHA the cluster binary compiles against
      # lives in `Cargo.toml`'s workspace dep rev.  Extract once,
      # reuse below for nexusd-cluster install.
      - name: Read NEXUS_VFS_REV from Cargo.toml
        if: steps.changes.outputs.run == 'true'
        id: vfs_rev
        run: |
          sha=$(grep -oP '(?<=rev = ")[a-f0-9]{40}' Cargo.toml | sort -u | head -1)
          if [ -z "$sha" ]; then
            echo "::error::Could not parse nexus-vfs SHA from Cargo.toml"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Install nexusd-cluster from nexus-vfs (pinned)
        if: steps.changes.outputs.run == 'true'
        env:
          REV: ${{ steps.vfs_rev.outputs.sha }}
        run: |
          set -euo pipefail
          cargo install --locked \
            --git https://github.com/nexi-lab/nexus-vfs \
            --rev "$REV" \
            --bin nexusd-cluster nexus-cluster
        # `cargo install` lands the binary in `$CARGO_HOME/bin` which
        # is already on $PATH for subsequent steps via setup-rust-
        # toolchain.

      - name: Build + sign FUSE plugin dylib
        if: steps.changes.outputs.run == 'true'
        env:
          PLUGIN_SIGNING_PRIVKEY: ${{ secrets.PLUGIN_SIGNING_PRIVKEY }}
        run: |
          set -euo pipefail
          if [ -z "$PLUGIN_SIGNING_PRIVKEY" ]; then
            echo "::error::PLUGIN_SIGNING_PRIVKEY secret is not available — cannot sign the FUSE plugin"
            exit 1
          fi
          # cargo install of nexusd-cluster from upstream brings its
          # own protoc inside the build environment; for the plugin
          # cargo invocation below, set PROTOC explicitly to avoid
          # picking up a different version from $PATH.
          export PROTOC="$(which protoc 2>/dev/null || true)"
          if [ -z "$PROTOC" ]; then
            choco install protoc -y --no-progress
            export PROTOC="C:/ProgramData/chocolatey/lib/protoc/tools/bin/protoc.exe"
          fi
          cargo build --release -p nexus-fuse-plugin --target x86_64-pc-windows-msvc
          # Windows dylib filename: strip the `lib` prefix, .dll
          # extension.  Sign in-place per sign_plugin.py contract.
          # sign_plugin.py imports `cryptography` for Ed25519 — the
          # windows-latest runner has Python but not the wheel, so
          # install it before invoking the signer.
          python -m pip install --quiet cryptography
          python scripts/sign_plugin.py \
            target/x86_64-pc-windows-msvc/release/nexus_fuse_plugin.dll

      - name: Prepare plugin dir
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.nexus/plugins
          cp target/x86_64-pc-windows-msvc/release/nexus_fuse_plugin.dll ~/.nexus/plugins/
          cp target/x86_64-pc-windows-msvc/release/nexus_fuse_plugin.dll.sig ~/.nexus/plugins/

      - name: "Run FUSE plugin Windows E2E (daemon + tests, single step)"
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        env:
          NEXUS_FUSE_WINDOWS_E2E: "1"
          NEXUS_CLUSTER_GRPC: "127.0.0.1:2126"
          NEXUS_FUSE_MOUNT_POINT: "M:"
          # Unlocks `winfsp_diag!(...)` in the plugin — production
          # daemons leave this unset and pay zero per-callback cost.
          # CI sets it so the full per-call trace stream lands in
          # nexusd.err.log, which the next step uploads as an artifact.
          NEXUS_FUSE_PLUGIN_TRACE: "1"
        run: |
          # CONSOLIDATED SINGLE STEP: launch daemon → wait → tests → teardown.
          #
          # Why one step: GHA tracks each step's process tree in a Windows
          # Job Object with `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` set.  When
          # the step's pwsh exits, the OS terminates EVERY process in the
          # job — child processes can't escape via -NoNewWindow=false,
          # -WindowStyle Hidden, Start-Job, or any other PowerShell flag.
          # Prior commits (79697ba5e diagnostics → 30beadf52
          # -WindowStyle Hidden) confirmed: `procAlive=False` from iter=1
          # even after switching window styles.  The ONLY way to keep
          # the daemon alive for tests is to keep everything in the same
          # step's pwsh process tree.
          $datadir = "$env:USERPROFILE\.nexus\data"
          $plugindir = "$env:USERPROFILE\.nexus\plugins"
          New-Item -ItemType Directory -Force -Path $datadir | Out-Null

          # WinFsp install puts `winfsp-x64.dll` at
          # `C:\Program Files (x86)\WinFsp\bin\` but the installer does
          # NOT add the dir to system PATH.  The FUSE plugin DLL has
          # `winfsp-x64.dll` in its static import table, so Windows
          # `LoadLibraryExW` walks exe-dir → System32 → CWD → PATH at
          # plugin load time and fails with error 126 ("module not
          # found") if none resolves it.  Prepending here is the
          # minimum-surface fix; the daemon inherits this PATH.
          $env:PATH = "C:\Program Files (x86)\WinFsp\bin;$env:PATH"

          # Pre-flight: confirm M: is free.  If a future runner image
          # starts mapping M:, pick the next free letter.
          $existing = Get-PSDrive -PSProvider FileSystem | ForEach-Object { $_.Name }
          Write-Host "Existing FS drives: $($existing -join ', ')"
          if ($existing -contains "M") {
            Write-Error "Drive M is already mapped on this runner.  Pick another letter."
            exit 1
          }

          # Env the FUSE plugin reads at create-time.  Start-Process
          # inherits these from the current pwsh session.
          $env:NEXUS_PLUGIN_DIR = $plugindir
          $env:NEXUS_FUSE_MOUNT_POINT = "M:"
          $env:NEXUS_FUSE_VFS_ROOT = "/"
          $env:NEXUS_BIND_ADDR = "127.0.0.1:2126"
          $env:NEXUS_NO_TLS = "true"
          $env:NEXUS_DATA_DIR = $datadir

          # Phase G (nexus-vfs #118): no --bootstrap-mode; the fresh
          # empty data_dir + empty peers + no federation env = row 2
          # (RootlessDynamic).  Runtime API drives zone formation
          # (which is exactly what this FUSE plugin E2E does via
          # the plugin's own runtime create_zone calls).
          $proc = Start-Process -FilePath nexusd-cluster `
            -ArgumentList @(
              "--plugin-dir", $plugindir,
              "--bind-addr", "127.0.0.1:2126",
              "--data-dir", $datadir,
              "--no-tls"
            ) `
            -RedirectStandardOutput nexusd.log `
            -RedirectStandardError nexusd.err.log `
            -NoNewWindow `
            -PassThru
          Write-Host "nexusd-cluster started, pid=$($proc.Id)"

          # Wait for gRPC + drive letter ready, with diagnostics.
          $deadline = (Get-Date).AddSeconds(180)
          $iter = 0
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            $iter++
            $grpcOK = $false
            try {
              $tcp = New-Object Net.Sockets.TcpClient
              $tcp.Connect("127.0.0.1", 2126)
              if ($tcp.Connected) { $grpcOK = $true }
              $tcp.Close()
            } catch { }
            $driveOK = Test-Path "M:\"
            $procAlive = ($null -ne (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue))
            if ($grpcOK -and $driveOK) {
              Write-Host "Cluster healthy (gRPC + M:\\ drive mounted) after iter=$iter"
              $ready = $true
              break
            }
            if (($iter % 10) -eq 1) {
              Write-Host "iter=$iter grpcOK=$grpcOK driveOK=$driveOK procAlive=$procAlive pid=$($proc.Id)"
            }
            Start-Sleep -Seconds 2
          }

          $testRc = 1
          try {
            if (-not $ready) {
              Write-Error "::error::Timed out waiting for cluster ready (180s)"
              Write-Host "Drives: $((Get-PSDrive -PSProvider FileSystem | ForEach-Object { $_.Name }) -join ', ')"
              Write-Host "Process alive: $(if (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue) {'YES'} else {'NO (exited)'})"
            } else {
              # `[test]` extra pulls pytest + pytest-asyncio
              # (defined in pyproject.toml [project.optional-dependencies]).
              # Plain `pip install -e .` excludes them because they
              # are dev deps, not runtime; the test step then fails
              # at `python -m pytest` with "No module named pytest".
              python -m pip install -e ".[test]"
              if ($LASTEXITCODE -ne 0) {
                Write-Error "::error::pip install -e .[test] failed (exit=$LASTEXITCODE)"
              } else {
                # `python -m pytest` instead of plain `pytest` — pwsh
                # doesn't auto-include `<python>/Scripts/` (where pip
                # drops console scripts) on PATH the way bash + venv
                # activation do, so the bare command isn't found.
                # Invoking through `python -m` resolves via Python's
                # own module path, no PATH wrangling needed.
                python -m pytest tests/e2e/windows/test_fuse_plugin_winfsp_e2e.py -v --no-header -o "addopts="
                $testRc = $LASTEXITCODE
              }
            }
          } finally {
            # Teardown: stop daemon + dump logs.  Always runs even if
            # tests fail or wait timed out — guarantees logs reach
            # the CI viewer regardless.
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            # Console preview only — the full files go up as an
            # artifact in the next step, byte-exact, no Tail
            # truncation interfering with the sudocode IO stream.
            if (Test-Path nexusd.log) {
              Write-Host "=== nexusd.log (last 200 lines — full file in artifact) ==="
              Get-Content nexusd.log -Tail 200
            }
            if (Test-Path nexusd.err.log) {
              Write-Host "=== nexusd.err.log (last 200 lines — full file in artifact) ==="
              Get-Content nexusd.err.log -Tail 200
            }
          }
          exit $testRc

      # Always-uploaded so failure forensics aren't subject to GHA's
      # per-step log truncation (~4 MB) OR PowerShell `Get-Content
      # -Tail`'s line-count cap.  The artifact is the full byte-
      # exact daemon stdio, downloadable from the workflow run page
      # for as long as the artifact retention policy keeps it.
      - name: Upload daemon logs as artifact
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nexusd-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nexusd.log
            nexusd.err.log
          if-no-files-found: warn
          retention-days: 14
