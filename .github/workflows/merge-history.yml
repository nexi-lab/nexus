name: Merge History

on:
  pull_request:
    branches: [main, develop]
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: Verify Merge Commit Contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify merges preserve their parents' changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python scripts/check_merge_history.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Test the history guard with real Git repositories
        run: |
          python -m pip install pytest
          python -m pytest tests/unit/ci/test_merge_history.py --noconftest -o addopts= -q
