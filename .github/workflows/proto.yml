name: Protocol

# Exchange proto files migrated to nexus-vfs (#4259).
# This workflow is retained for buf.yaml / buf.gen.yaml changes only.
# Proto lint and breaking-change detection for exchange protos now runs
# in the nexus-vfs CI pipeline.

on:
  push:
    branches: [main, develop]
    paths:
      - "buf.yaml"
      - "buf.gen.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "buf.yaml"
      - "buf.gen.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-check:
    name: Proto Lint & Breaking Change Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip — exchange protos migrated to nexus-vfs
        run: |
          echo "Exchange proto files migrated to nexus-vfs (#4259)."
          echo "Proto lint and breaking-change detection runs in the nexus-vfs CI pipeline."
          echo "This workflow only triggers on buf.yaml / buf.gen.yaml changes."
