name: Repo Boundary

# DRY between nexus + nexus-vfs.  Kernel-tier code (contracts / lib /
# transport / kernel / raft + profiles/cluster + proto, plus the
# kernel-tier `backends` crate's source files) was moved to nexus-vfs
# in #4259 and MUST NOT reappear here — the dual-repo split was made
# specifically to prevent that drift.
#
# `rust/backends/` itself is a shared directory: nexus-vfs ships
# kernel-tier backend SOURCE under it (a single `backends` crate;
# blocked here by the kernel-source file gate below), and nexus ships
# driver-kind backend DYLIB sub-crates that wrap those sources
# (`rust/backends/local-connector/`, …) — same conceptual neighborhood,
# different build artifact.  Service-kind plugin dylibs (vault, …)
# live under `rust/services/<name>/` next to the service crate source
# they wrap.
#
# Companion gate in nexus-vfs forbids the service-tier paths
# (rust/services, rust/backends/local-connector).
# Either gate firing means the cross-repo boundary is being violated;
# the fix is to move the offending path back to the correct repo, not
# to disable the gate.

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  forbid-kernel-tier-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid kernel-tier paths
        run: |
          set -e
          # Whole-tree paths that belong exclusively in nexus-vfs.
          forbidden=(
            rust/contracts
            rust/lib
            rust/transport
            rust/kernel
            rust/raft
            rust/profiles/cluster
            proto
          )
          violations=()
          for p in "${forbidden[@]}"; do
            if [ -e "$p" ]; then
              violations+=("$p")
            fi
          done
          # `rust/backends/` itself is shared with nexus-vfs (see
          # header).  Block only the kernel-tier backend SOURCE crate
          # — its Cargo.toml + src/ at the directory root — so the
          # nexus-side driver-dylib sub-crates
          # (rust/backends/local-connector/, …) remain free to live here.
          if [ -f "rust/backends/Cargo.toml" ] || [ -d "rust/backends/src" ]; then
            violations+=("rust/backends/Cargo.toml or rust/backends/src/ (kernel-tier source crate)")
          fi
          if [ "${#violations[@]}" -gt 0 ]; then
            for v in "${violations[@]}"; do
              echo "::error::path '$v' belongs in nexus-vfs (kernel-tier SSOT), not nexus"
            done
            echo ""
            echo "If you intentionally meant to move this path into nexus, update"
            echo "the boundary list in .github/workflows/repo-boundary.yml in BOTH"
            echo "repos and document the move in the PR body."
            exit 1
          fi
          echo "Repo boundary OK — no kernel-tier paths present."
