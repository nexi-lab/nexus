name: Test

on:
  push:
    branches: [main, develop, SETUP]
  pull_request:
    branches: [main, develop]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required for third-party PyO3 sdist builds (e.g. pdf-inspector).
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # Detect whether only docs/non-code files changed.
  # Downstream jobs skip heavy work when code_changed == 'false',
  # but still report SUCCESS so required checks pass on doc-only PRs.
  detect-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'rust/**'
              - 'pyproject.toml'
              - 'Cargo.*'
              - '.github/workflows/**'
              # Kernel image pins: the Dockerfiles' NEXUS_VFS_REV decides
              # which kernel ships — an image-only rev bump must not skip
              # the pinned-kernel smoke + restart-survival gate (#4343).
              - 'Dockerfile'
              - 'dockerfiles/**'

  # Single-job pattern (matches federation-e2e.yml / api-surface.yml):
  # always runs so the required check reports exactly one conclusion;
  # the per-step `if:` gate keeps the actual work path-filtered while a
  # leading skip-notice step gives SUCCESS for path-skipped runs.
  rpc-parity:
    name: RPC Parity Check
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — RPC parity check not needed (clean SUCCESS)"

      - name: Check RPC Parity (ENFORCEMENT)
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          echo "RPC parity check: test_rpc_parity.py was removed in test cleanup."
          echo "RPC parity is verified by integration/e2e tests."
          echo "Skipping — no dedicated parity test file."

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [detect-changes]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.14"]

    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — Test Python ${{ matrix.python-version }} on ${{ matrix.os }} not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          uv pip install -e ".[dev,test]"

      - name: Run unit tests
        if: needs.detect-changes.outputs.code_changed == 'true'
        timeout-minutes: 30
        run: |
          start=$(date +%s)
          uv run --no-sync python -Xfaulthandler -m pytest tests/unit -v --durations=10 -n auto --dist loadgroup \
            --timeout=60 --timeout-method=signal -p no:cacheprovider \
            --cov=nexus --cov-report=term-missing --cov-report=xml
          status=$?
          echo $(( $(date +%s) - start )) > unit_test_duration_sec.txt
          # timeout returns 137 (128+9=SIGKILL) when it kills the process.
          # Treat this as success if tests actually passed (duration file exists
          # and was written before the kill).
          if [ $status -eq 137 ] && [ -f unit_test_duration_sec.txt ]; then
            echo "::warning::pytest killed by timeout watchdog (tokio thread hang). Tests passed."
            exit 0
          fi
          exit $status
        shell: bash

      - name: Unit test duration (target <3min; fail if >8min)
        if: always() && needs.detect-changes.outputs.code_changed == 'true'
        run: |
          if [ ! -f unit_test_duration_sec.txt ]; then exit 0; fi
          dur=$(cat unit_test_duration_sec.txt)
          echo "### Unit tests" >> $GITHUB_STEP_SUMMARY
          echo "Duration: **${dur}s** (target &lt;180s; max 1200s)" >> $GITHUB_STEP_SUMMARY
          if [ "$dur" -gt 1200 ]; then
            echo "::error::Unit tests took ${dur}s (max 1200s). Keep the suite lean; see tests/unit/README.md"
            exit 1
          fi
        shell: bash

      - name: Verify benchmark collection
        if: needs.detect-changes.outputs.code_changed == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          uv run --no-sync pytest tests/benchmarks/ --collect-only -q -o "addopts="

  e2e-self-contained:
    name: E2E Tests (Self-Contained)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — E2E (Self-Contained) not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test]"

      # The nexus-cluster binary is required by NexusFS (KernelClient spawns
      # it as a subprocess). Binary SSOT is now nexus-vfs; install via
      # cargo install --locked from the git repo.
      - name: Set up Rust toolchain
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache nexus-cluster install
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-nexus-cluster

      - name: Install nexus-cluster from nexus-vfs (pinned rev)
        if: needs.detect-changes.outputs.code_changed == 'true'
        # Same rev the repo ships (Cargo.toml pins == Dockerfile ARGs,
        # enforced by the smoke job preflight). Unpinned installs track
        # nexus-vfs HEAD and let E2E pass/fail on unreviewed upstream
        # movement (#4343).
        run: |
          REV=$(grep 'nexus-vfs' Cargo.toml | grep -m1 -oE 'rev = "[a-f0-9]{40}"' | cut -d'"' -f2)
          if [ -z "$REV" ]; then
            echo "::error::could not extract nexus-vfs rev pin from Cargo.toml"
            exit 1
          fi
          cargo install --locked --git https://github.com/nexi-lab/nexus-vfs --rev "$REV" --bin nexusd-cluster nexus-cluster
          sudo ln -sf $(which nexusd-cluster) /usr/local/bin/nexus-cluster

      # Pre-build the nexus-server image once with buildx + GHA layer cache.
      # The ``running_nexus`` fixture in tests/e2e/self_contained/conftest.py
      # otherwise calls ``nexus up --build`` for every approvals test class
      # and pays the full Rust+Python image build (~5-10 min) on cold runners
      # — a single fixture instantiation timed out at 600s in PR #3961
      # reruns and consumed half the job budget before any test ran.
      - name: Set up Docker Buildx
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Pre-build nexus-server image
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/nexi-lab/nexus:latest
            nexus-server:latest
          cache-from: type=gha,scope=e2e-self-contained
          cache-to: type=gha,scope=e2e-self-contained,mode=max

      - name: Run self-contained e2e tests
        if: needs.detect-changes.outputs.code_changed == 'true'
        env:
          # Image is already loaded into the local docker daemon via the
          # pre-build step above, so the fixture can skip ``--build`` and
          # call plain ``nexus up``. Cuts ~5-10 min off each approvals
          # test class fixture invocation.
          NEXUS_E2E_SKIP_BUILD: "1"
        run: |
          # ``-Xfaulthandler`` plus pytest's built-in ``faulthandler_timeout``
          # ini option dumps a Python + native stack trace from every thread
          # if a test hangs > 60s — when the suite stalls, the log shows the
          # exact frame stuck (PR #3890 hunt for an inter-file hang).
          uv run --no-sync python -Xfaulthandler -m pytest tests/e2e/self_contained/ -v \
            --timeout=120 --timeout-method=signal \
            -o faulthandler_timeout=60 -o addopts=
        # 45 min budget = Rust build (~3 min warm, ~5 min cold) +
        # Docker pre-build (~3 min warm, ~10 min cold) +
        # ~20 min for the test bodies. Per-test --timeout=120 still
        # catches real hangs fast.
        timeout-minutes: 45

  e2e-postgres:
    name: E2E Tests (PostgreSQL)
    needs: detect-changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXUS_DATABASE_URL: postgresql://nexus_test:nexus_test@localhost:5432/nexus_test
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — E2E (PostgreSQL) not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test,postgres]"

      - name: Run PostgreSQL e2e tests
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          uv run --no-sync pytest tests/e2e/postgres/ --ignore=tests/e2e/postgres/migrations -v --timeout=120 -o "addopts="
        timeout-minutes: 10

      - name: Run auth envelope-encryption tests (#3803)
        if: needs.detect-changes.outputs.code_changed == 'true'
        env:
          TEST_POSTGRES_URL: postgresql+psycopg2://nexus_test:nexus_test@localhost:5432/nexus_test
        run: |
          uv run --no-sync pytest \
            src/nexus/bricks/auth/tests/test_envelope.py \
            src/nexus/bricks/auth/tests/test_envelope_contract.py \
            src/nexus/bricks/auth/tests/test_postgres_envelope_integration.py \
            src/nexus/bricks/auth/tests/test_rotate_kek_cli.py \
            -v --timeout=60 -o "addopts="
        timeout-minutes: 10

  e2e-redis:
    name: E2E Tests (Redis)
    needs: detect-changes
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXUS_REDIS_URL: redis://localhost:6379
      NEXUS_DRAGONFLY_COORDINATION_URL: redis://localhost:6379
      REDIS_ENABLED: "1"
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — E2E (Redis) not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test]"

      - name: Run Redis e2e tests
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          uv run --no-sync pytest tests/e2e/redis/ -v --timeout=120 -o "addopts="
        timeout-minutes: 10

  e2e-docker:
    name: E2E Tests (Docker)
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — E2E (Docker) not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test]"

      - name: Run Docker e2e tests
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          uv run --no-sync pytest tests/e2e/docker/ -v --timeout=180 -o "addopts="
        timeout-minutes: 15

  e2e-nats:
    name: E2E Tests (NATS)
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      NEXUS_NATS_URL: nats://localhost:4222
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — E2E (NATS) not needed (clean SUCCESS)"

      - name: Start NATS with JetStream
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          docker run -d --name nats -p 4222:4222 nats:latest -js
          sleep 2

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test]"

      - name: Run NATS e2e tests
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          uv run --no-sync pytest tests/e2e/nats/ -v --timeout=120 -o "addopts="
        timeout-minutes: 10

  # ── nexus-fs standalone package validation ─────────────────────────────
  nexus-fs-smoke:
    name: nexus-fs Smoke Test
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "packages/nexus-fs/pyproject.toml"

      - name: Build nexus-fs wheel
        run: |
          pip install hatchling
          # pyproject.toml uses packages = ["../../src/nexus"] which only works
          # in-tree. For CI wheel builds, temporarily rewrite to a local symlink.
          ln -s ../../src src
          sed -i 's|"../../src/nexus"|"src/nexus"|' pyproject.toml
          python -m hatchling build -t wheel -d ../../dist/
          git checkout pyproject.toml
          rm -f src
          ls -lh ../../dist/
        working-directory: packages/nexus-fs

      - name: Validate wheel metadata
        run: |
          pip install twine check-wheel-contents
          twine check --strict dist/*
          # W002 (duplicate files) can occur due to symlink resolution in hatchling;
          # log but don't fail — pydistcheck size gate catches bloated wheels.
          check-wheel-contents dist/*.whl || echo "::warning::check-wheel-contents found issues (non-fatal)"

      - name: Validate wheel size and portability
        run: |
          pip install pydistcheck
          pydistcheck --max-allowed-size-compressed '5M' --ignore 'mixed-file-extensions' dist/*.whl

      - name: Install in clean environment (with timing)
        env:
          VIRTUAL_ENV: /tmp/nexus-fs-test
        run: |
          uv venv --python 3.14 $VIRTUAL_ENV
          start_time=$(date +%s%N)
          uv pip install --python $VIRTUAL_ENV/bin/python dist/*.whl
          end_time=$(date +%s%N)
          install_ms=$(( (end_time - start_time) / 1000000 ))
          echo "Install time: ${install_ms}ms"
          echo "### nexus-fs install time" >> $GITHUB_STEP_SUMMARY
          echo "**${install_ms}ms**" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test — import
        run: |
          /tmp/nexus-fs-test/bin/python -c "
          import nexus.fs
          print(f'nexus-fs v{nexus.fs.__version__}')
          _ = nexus.fs.parse_uri
          _ = nexus.fs.LOCAL_CONTEXT
          print('Import OK')
          "

      - name: Smoke test — CLI
        run: |
          /tmp/nexus-fs-test/bin/nexus-fs --help
          /tmp/nexus-fs-test/bin/nexus-fs doctor

      - name: Smoke test — fsspec entry point
        run: |
          uv pip install --python /tmp/nexus-fs-test/bin/python fsspec
          /tmp/nexus-fs-test/bin/python -c "
          import fsspec
          cls = fsspec.get_filesystem_class('nexus')
          print(f'fsspec entry point OK: {cls}')
          "

      - name: Smoke test — S3 extra
        run: |
          uv pip install --python /tmp/nexus-fs-test/bin/python boto3
          /tmp/nexus-fs-test/bin/python -c "
          from nexus.backends.storage.path_s3 import PathS3Backend
          print('S3 backend import OK')
          "

      - name: Smoke test — GCS extra
        run: |
          uv pip install --python /tmp/nexus-fs-test/bin/python google-cloud-storage
          /tmp/nexus-fs-test/bin/python -c "
          from nexus.backends.storage.cas_gcs import CASGCSBackend
          print('GCS backend import OK')
          "

      - name: Cold import time gate (budget 240ms, min of 5 runs)
        run: |
          # Run 5 times and take the MINIMUM. The median still carries shared-
          # runner noise into the verdict: on develop the median measured 202ms
          # (fd87d84b7) -> 221ms (a783c08fe) -> 261ms/FAIL (466a60b37) across
          # commits whose import path differed by ~23 lines of pydantic fields —
          # a ±30ms runner lottery against a 240ms budget. The minimum is the
          # cost floor the code actually mandates: noisy neighbors can only
          # inflate a sample, never deflate it, so the floor rises ONLY when a
          # real import-cost regression lands (which is what this gate exists
          # to catch).
          measurements=()
          for i in 1 2 3 4 5; do
            /tmp/nexus-fs-test/bin/python -X importtime -c "import nexus.fs" 2> /tmp/importtime_${i}.log
            cumulative_us=$(/tmp/nexus-fs-test/bin/python -c "
          import re
          with open('/tmp/importtime_${i}.log') as f:
              lines = f.read().strip().splitlines()
          last = lines[-1]
          match = re.search(r'\|\s+(\d+)\s+\|', last)
          print(match.group(1) if match else '0')
          ")
            ms=$((cumulative_us / 1000))
            measurements+=($ms)
            echo "  Run ${i}: ${ms}ms"
          done
          IFS=$'\n' sorted=($(sort -n <<<"${measurements[*]}")); unset IFS
          actual_ms=${sorted[0]}
          echo "Min import time: ${actual_ms}ms (budget: 240ms)"
          echo "### nexus-fs import time" >> $GITHUB_STEP_SUMMARY
          echo "**${actual_ms}ms** min of [${measurements[0]}, ${measurements[1]}, ${measurements[2]}, ${measurements[3]}, ${measurements[4]}]ms (budget: 240ms)" >> $GITHUB_STEP_SUMMARY
          if [ "$actual_ms" -gt 240 ]; then
            echo "::error::Min import time ${actual_ms}ms exceeds 240ms budget"
            exit 1
          fi

  # ── nexusd-cluster boot smoke test ──────────────────────────────────
  # Builds the nexus-local `nexusd-cluster` (the shipped production binary:
  # nexus-vfs cluster profile + the managed_agent control plane, #36) and
  # gates it — boot smoke, restart-survival, and the raw ACP tunnel E2E.
  nexusd-cluster-smoke:
    name: nexusd-cluster Smoke Test
    needs: detect-changes
    runs-on: ubuntu-latest
    # One `--path` cargo install plus the Python restart-survival +
    # tunnel gates; rust-cache keeps warm runs well under this.
    timeout-minutes: 30
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — nexusd-cluster smoke not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache nexus-cluster install
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nexusd-cluster-smoke

      - name: Kernel pin consistency preflight
        if: needs.detect-changes.outputs.code_changed == 'true'
        # Every nexus-vfs pin in the repo must agree: the Cargo.toml
        # crate pins, the Cargo.lock resolution, and the remaining image
        # ARGs (dockerfiles/Dockerfile.{minimal,raft-server,raft-witness}).
        # The main image's nexusd-cluster now pins nexus-vfs THROUGH
        # Cargo.lock (it builds the nexus-local `nexusd` crate, #36), not
        # an ARG. A partial bump ships a kernel the gate below never
        # tested — the exact drift class behind #4343.
        run: |
          set -euo pipefail
          # Every nexus-vfs install — in Dockerfiles AND workflow
          # files — must carry an explicit --rev AND --locked. RUN/run
          # blocks span backslash continuations, so join continuation
          # lines per file before matching — a same-line grep misses
          # blocks whose flags were dropped. Without --rev the install
          # tracks HEAD; without --locked it resolves transitive deps
          # fresh at build time, so a new release of ANY dep (e.g.
          # rcgen 0.14.8) can break every image overnight despite the
          # rev pin.
          # URL kept in a variable so this scanner's own source lines
          # never contain the full match set (no self-flagging).
          VFS_GIT='--git https://github.com/nexi-lab/nexus-vfs'
          UNPINNED=""
          UNLOCKED=""
          for f in Dockerfile dockerfiles/* .github/workflows/*.yml; do
            [ -f "$f" ] || continue
            INSTALLS=$(sed -e ':a' -e '/\\$/N' -e 's/\\\n//' -e 'ta' "$f" \
              | grep -v '^[[:space:]]*#' \
              | grep 'cargo install' \
              | grep -F -- "$VFS_GIT" || true)
            [ -n "$INSTALLS" ] || continue
            BAD=$(echo "$INSTALLS" | grep -v '\-\-rev' || true)
            BADLOCK=$(echo "$INSTALLS" | grep -v '\-\-locked' || true)
            if [ -n "$BAD" ]; then
              UNPINNED="${UNPINNED}${f}: ${BAD}"$'\n'
            fi
            if [ -n "$BADLOCK" ]; then
              UNLOCKED="${UNLOCKED}${f}: ${BADLOCK}"$'\n'
            fi
          done
          if [ -n "$UNPINNED" ]; then
            echo "::error::nexus-vfs install without --rev (tracks HEAD):"
            echo "$UNPINNED"
            exit 1
          fi
          if [ -n "$UNLOCKED" ]; then
            echo "::error::nexus-vfs install without --locked (fresh dep resolution drifts):"
            echo "$UNLOCKED"
            exit 1
          fi
          CARGO_REVS=$(grep 'nexus-vfs' Cargo.toml | grep -oE 'rev = "[a-f0-9]{40}"' | grep -oE '[a-f0-9]{40}' | sort -u)
          LOCK_REVS=$(grep -oE 'nexus-vfs\?rev=[a-f0-9]{40}' Cargo.lock | grep -oE '[a-f0-9]{40}' | sort -u)
          DOCKER_REVS=$(grep -rh -oE 'ARG NEXUS_VFS_REV=[a-f0-9]{40}' Dockerfile dockerfiles/ | grep -oE '[a-f0-9]{40}' | sort -u)
          echo "Cargo.toml pins:  $CARGO_REVS"
          echo "Cargo.lock pins:  $LOCK_REVS"
          echo "Dockerfile pins:  $DOCKER_REVS"
          # Empty extraction means the format drifted and the guard is
          # comparing nothing — fail closed, not open.
          for SET in "$CARGO_REVS" "$LOCK_REVS" "$DOCKER_REVS"; do
            if [ -z "$SET" ]; then
              echo "::error::a nexus-vfs pin source extracted zero revs — pin-extraction pattern regressed"
              exit 1
            fi
          done
          UNIQUE=$(printf '%s\n%s\n%s\n' "$CARGO_REVS" "$LOCK_REVS" "$DOCKER_REVS" | sort -u | grep -c . )
          if [ "$UNIQUE" -ne 1 ]; then
            echo "::error::nexus-vfs pins diverge across Cargo.toml / Cargo.lock / Dockerfiles — partial bump ships an untested kernel"
            exit 1
          fi

      - name: Install nexusd-cluster (the shipped production binary)
        if: needs.detect-changes.outputs.code_changed == 'true'
        # Production ships the nexus-local `nexusd` crate as `nexusd-cluster`
        # — the KERNEL-ARCHITECTURE §7 `cluster` profile PLUS the
        # managed_agent control plane. It composes nexus-vfs cluster boot +
        # managed_agent, so it must be built from THIS tree (`--path
        # rust/nexusd`) — the gate then tests the EXACT binary the image
        # ships. The pure nexus-vfs `nexusd-cluster` (no services) is gated
        # in nexus-vfs CI (cluster-binary-build.yml, incl. its ≤15.5 MiB size
        # budget), so it is not re-installed here. `--locked` honors the
        # source tree's Cargo.lock (the nexus-vfs pin the preflight validated).
        run: |
          echo "Installing nexusd-cluster from the nexus-local crate rust/nexusd"
          cargo install --locked --path rust/nexusd --bin nexusd-cluster

      - name: nexusd-cluster size budget (cluster profile purity)
        if: needs.detect-changes.outputs.code_changed == 'true'
        # The production cluster binary is size-gated (KERNEL-ARCHITECTURE §7;
        # mirrors nexus-vfs cluster-binary-build.yml's linux budget). The
        # nexus-vfs gate only covers the PURE cluster binary; production ships
        # this nexus-local one (cluster profile + managed_agent), so it needs
        # its own guard. managed_agent is a small control-plane addition
        # (~14.9 MiB release/stripped); driver-s3 / connectors must NOT leak
        # into the default (slim) build — that leak is the #36 regression this
        # gate exists to catch.
        run: |
          BIN="$HOME/.cargo/bin/nexusd-cluster"
          MAX=16252928  # 15.5 MiB — matches the nexus-vfs linux cluster budget
          actual=$(stat -c%s "$BIN")
          echo "nexusd-cluster size: $actual bytes (max: $MAX)"
          if [ "$actual" -gt "$MAX" ]; then
            echo "::error::nexusd-cluster ($actual bytes) exceeds the cluster size budget ($MAX). A driver/connector likely leaked into the default slim build — keep driver-s3 & connectors behind opt-in features (KERNEL-ARCHITECTURE §7)."
            exit 1
          fi

      - name: Boot smoke test
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          DATA_DIR=$(mktemp -d)
          # Smoke: empty peers + no federation env + empty data_dir
          # → Phase G row 2 (RootlessDynamic).  Daemon comes up
          # rootless; that is exactly what this smoke exercises
          # (gRPC + tracing + tokio runtime start-and-shutdown).
          RUST_LOG=info nexusd-cluster \
            --bind-addr 127.0.0.1:2126 \
            --no-tls --data-dir "$DATA_DIR" &
          PID=$!
          echo "Started nexusd-cluster (PID=$PID), waiting 5s for boot..."

          sleep 5

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::nexusd-cluster exited during startup (likely panicked)"
            wait "$PID" || true
            exit 1
          fi

          echo "nexusd-cluster is alive after 5s — sending SIGTERM..."
          kill "$PID"
          wait "$PID"
          EXIT_CODE=$?
          rm -rf "$DATA_DIR"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::nexusd-cluster exited with code $EXIT_CODE on shutdown (likely panicked)"
            exit 1
          fi
          echo "nexusd-cluster shut down cleanly — smoke test passed"

      # Restart-survival regression (#4343): the VFS namespace must
      # outlive a kernel restart. Runs against the EXACT pinned binary
      # installed above (NEXUS_KERNEL_BINARY bypasses PATH lookup), so
      # a rev bump that loses durable-metastore wiring fails this job.
      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test]"

      - name: Restart-survival regression test (#4343)
        if: needs.detect-changes.outputs.code_changed == 'true'
        timeout-minutes: 15
        run: |
          # The VFS namespace must outlive a kernel restart. Runs against the
          # exact production binary installed above (NEXUS_KERNEL_BINARY
          # bypasses PATH lookup), so a rev bump that loses durable-metastore
          # wiring fails this job.
          export NEXUS_KERNEL_BINARY="/home/runner/.cargo/bin/nexusd-cluster"
          test -x "$NEXUS_KERNEL_BINARY" || { echo "::error::nexusd-cluster missing at $NEXUS_KERNEL_BINARY"; exit 1; }
          uv run --no-sync python -m pytest tests/integration/test_kernel_restart_survival.py -v -o "addopts="

      - name: Managed-agent raw ACP tunnel E2E (#36)
        if: needs.detect-changes.outputs.code_changed == 'true'
        timeout-minutes: 10
        # The raw ACP control-plane spawn + DT_STREAM stdio tunnel live in
        # nexusd-cluster (it brings up the managed_agent service). Boot it via
        # the KernelClient spawn harness and drive start_session(spawn_spec) +
        # StreamWriteNowait/StreamReadAt end to end over gRPC — the exact wire
        # path an embedder (sudowork grpc-js) uses. Guards the daemon-level
        # tunnel the in-process raw_spawn unit tests can't reach.
        run: |
          export NEXUS_KERNEL_BINARY="/home/runner/.cargo/bin/nexusd-cluster"
          test -x "$NEXUS_KERNEL_BINARY" || { echo "::error::nexusd-cluster missing at $NEXUS_KERNEL_BINARY"; exit 1; }
          uv run --no-sync python -m pytest tests/integration/test_managed_agent_tunnel_e2e.py -v -o "addopts="

  migration-test:
    name: Migration Tests (SQLite)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — Migration (SQLite) not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test]"

      - name: Run migration tests (SQLite)
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          uv run --no-sync pytest tests/e2e/postgres/migrations/ -v -o "addopts="

  migration-test-pg:
    name: Migration Tests (PostgreSQL)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXUS_DATABASE_URL: postgresql://nexus_test:nexus_test@localhost:5432/nexus_test
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — Migration (PostgreSQL) not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test,postgres]"

      - name: Run migration tests (PostgreSQL)
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          uv run --no-sync pytest tests/e2e/postgres/migrations/ -v -o "addopts="
