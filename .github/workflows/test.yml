  migration-test-pg:
    name: Migration Tests (PostgreSQL)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # `+psycopg2` pins SQLAlchemy to the psycopg2 driver.  Without
      # it, SQLAlchemy 2.x's `postgresql://` scheme prefers the
      # psycopg (v3) dialect, which imports `psycopg` at engine-create
      # time; the runner only installs psycopg2-binary, so the tests
      # fail at fixture setup with a ModuleNotFoundError.  Making the
      # driver explicit is the least-surprise fix — the tests all rely
      # on psycopg2-binary already being on the venv.
      NEXUS_DATABASE_URL: postgresql+psycopg2://nexus_test:nexus_test@localhost:5432/nexus_test
    steps:
      - name: Skip notice (no code changes)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: echo "No code changes — Migration (PostgreSQL) not needed (clean SUCCESS)"

      - name: Checkout code
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: needs.detect-changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv venv --python 3.14

      - name: Install dependencies
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: uv pip install -e ".[dev,test,postgres]"

      - name: Run migration tests (PostgreSQL)
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          uv run --no-sync pytest tests/e2e/postgres/migrations/ -v -o "addopts="
