name: TypeScript Packages

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - '.github/workflows/ts-packages.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - '.github/workflows/ts-packages.yml'

jobs:
  api-client:
    name: "@nexus-ai-fs/api-client"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nexus-api-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  nexus-pay-ts:
    name: "@nexus-ai-fs/pay"
    runs-on: ubuntu-latest
    needs: api-client
    defaults:
      run:
        working-directory: packages/nexus-pay-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      # Build api-client first (nexus-pay-ts depends on it)
      - run: cd ../nexus-api-client && npm ci
      - run: npm install
      - run: npm run lint
      - run: npm run test:coverage

  nexus-tui:
    name: "@nexus-ai-fs/tui"
    runs-on: ubuntu-latest
    needs: api-client
    defaults:
      run:
        working-directory: packages/nexus-tui
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Build api-client first
      - run: cd ../nexus-api-client && npm ci

      - run: bun install --frozen-lockfile
      - name: Install the terminal E2E dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison pkg-config libevent-dev libncurses-dev libutempter-dev
          # tmux 3.4 can lose SIGCHLD during utmp cleanup, leaving exited panes
          # as zombies with no exit status: https://github.com/tmux/tmux/issues/4559.
          build_dir=$(mktemp -d "${RUNNER_TEMP}/nexus-tmux.XXXXXX")
          curl --fail --location https://github.com/tmux/tmux/releases/download/3.6b/tmux-3.6b.tar.gz --output "$build_dir/tmux.tar.gz"
          echo "390759d25fdba016887ec982b808927e637070fd7d03a8021f8ef3102b9ae3c7  $build_dir/tmux.tar.gz" | sha256sum --check
          tar -xzf "$build_dir/tmux.tar.gz" --directory "$build_dir"
          cd "$build_dir/tmux-3.6b"
          ./configure --prefix="$build_dir/install" --enable-utempter
          make -j2
          make install
          echo "$build_dir/install/bin" >> "$GITHUB_PATH"
          "$build_dir/install/bin/tmux" -V
      - run: bun test
      - run: bun run lint
      - run: bun run test:package

  windows-tui-launcher:
    name: Windows TUI launcher
    runs-on: windows-latest
    timeout-minutes: 15
    needs: api-client
    env:
      GOMAXPROCS: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build the shared native API client
        working-directory: packages/nexus-api-client
        run: npm ci
      - name: Install the terminal consumer
        working-directory: packages/nexus-tui
        run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - name: Install CLI test dependencies
        run: |
          uv venv --python 3.14
          uv pip install -e ".[dev,test]"
      - name: Verify actual Bun launch and Windows child exit status
        run: uv run --no-sync python -m pytest tests/unit/cli/test_tui_launcher.py -n 0 -q
      - name: Verify an isolated installation of the packed terminal
        working-directory: packages/nexus-tui
        run: bun run test:package

  native-tui:
    name: Native TUI acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: api-client
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the shared native API client
        working-directory: packages/nexus-api-client
        run: npm ci
      - name: Install the terminal consumer
        working-directory: packages/nexus-tui
        run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - name: Install native fixture tools
        run: |
          uv venv --python 3.14
          uv pip install -e ".[dev,test]"
      - name: Verify the public CLI uses the installed terminal runtime
        run: uv run --no-sync python -m pytest tests/unit/cli/test_tui_launcher.py -n 0 -q
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: e2e-search-fixture
      - name: Build the pinned native daemon and plugin
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: nice -n 10 bash scripts/build_search_fixture.sh
      - name: Verify native terminal files, identity, Search and revocation
        timeout-minutes: 10
        run: |
          uv run --no-sync python scripts/test_search_local.py \
            --kernel-binary "$NEXUS_KERNEL_BINARY" \
            --plugin-library "$NEXUS_SEARCH_PLUGIN_LIBRARY" \
            --output-dir "$RUNNER_TEMP/native-tui" \
            --keyword-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tui-evidence
          path: |
            ${{ runner.temp }}/native-tui/run-*/results.json
            ${{ runner.temp }}/native-tui/run-*/*tui.log
          retention-days: 7
