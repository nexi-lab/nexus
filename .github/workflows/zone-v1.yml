name: Zone v1

# pdf-inspector (PyO3 0.22) tops out at Python 3.13; same workaround the
# demo-memory workflow pins for its 3.14 uv sync.
env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

on:
  pull_request:
    paths:
      - "contracts/**"
      - "src/nexus/services/zones/**"
      - "src/nexus/remote/kernel_client.py"
      - "src/nexus/remote/rpc_transport.py"
      - "src/nexus/remote/zone_runtime_client.py"
      - "src/nexus/server/api/v2/**zone*"
      - "src/nexus/server/api/v2/routers/sessions.py"
      - "src/nexus/server/lifespan/zone_control.py"
      - "rust/services/rebac/**"
      - "rust/nexusd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/nexus-api-client/**"
      - "tests/e2e/conftest.py"
      - "tests/e2e/server/test_zone*.py"
      - "tests/e2e/server/test_session_runtime_p1a_e2e.py"
      - "tests/e2e/server/test_session_runtime_p1b_e2e.py"
      - "tests/e2e/server/test_full_profile_control_plane_e2e.py"
      - ".github/workflows/zone-v1.yml"
  push:
    branches: [develop]
    paths:
      - "contracts/**"
      - "src/nexus/services/zones/**"
      - "src/nexus/remote/kernel_client.py"
      - "src/nexus/remote/rpc_transport.py"
      - "src/nexus/remote/zone_runtime_client.py"
      - "src/nexus/server/api/v2/**zone*"
      - "src/nexus/server/api/v2/routers/sessions.py"
      - "src/nexus/server/lifespan/zone_control.py"
      - "rust/services/rebac/**"
      - "rust/nexusd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/nexus-api-client/**"
      - "tests/e2e/conftest.py"
      - "tests/e2e/server/test_zone*.py"
      - "tests/e2e/server/test_session_runtime_p1a_e2e.py"
      - "tests/e2e/server/test_session_runtime_p1b_e2e.py"
      - "tests/e2e/server/test_full_profile_control_plane_e2e.py"

jobs:
  python-contract-and-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexus_zone_test
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_zone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --group dev
      - run: uv run python contracts/tools/sync_vendor.py --check
      - run: uv run python scripts/generate_zone_runtime_client.py --check
      - run: uv run ruff check src/nexus/contracts/zone_v1.py src/nexus/services/zones src/nexus/server/api/v2 contracts/tools/sync_vendor.py scripts/generate_zone_runtime_client.py tests/contracts tests/unit/services/test_zone_service.py tests/unit/server/test_zone_v2_api.py
      - name: Python contract, storage, and service tests
        env:
          NEXUS_E2E_DATABASE_URL: postgresql+psycopg2://postgres:nexus@127.0.0.1:5432/nexus_zone_test
        run: uv run pytest -n 0 tests/contracts tests/migrations/test_zone_v1_storage.py tests/unit/services/test_zone_service.py tests/unit/server/test_zone_v2_api.py tests/unit/remote/test_zone_runtime_client.py
      - name: Build kernel from the pinned nexus-vfs rev
        shell: bash
        run: |
          REV=$(grep -m1 -o 'rev = "[0-9a-f]\{40\}"' Cargo.toml | grep -o '[0-9a-f]\{40\}')
          git clone --quiet https://github.com/nexi-lab/nexus-vfs "${RUNNER_TEMP}/nexus-vfs"
          git -C "${RUNNER_TEMP}/nexus-vfs" checkout --quiet "${REV}"
          cargo build --manifest-path "${RUNNER_TEMP}/nexus-vfs/rust/profiles/cluster/Cargo.toml"
      - name: Full-profile Zone HTTP E2E
        env:
          NEXUS_KERNEL_BINARY: ${{ runner.temp }}/nexus-vfs/target/debug/nexusd-cluster
        # shadow_compare is cross-platform (httpx only, conftest has POSIX
        # branches) — it runs here on ubuntu.
        run: uv run pytest -n 0 tests/e2e/server/test_zone_routes_e2e.py tests/e2e/server/test_zone_deprovision_e2e.py tests/e2e/server/test_full_profile_control_plane_e2e.py tests/e2e/server/test_zone_shadow_compare_e2e.py

  windows-fault-injection-e2e:
    # M-14: the four suites below need Windows (ServerHarness's kill path is
    # PowerShell/taskkill; p0_matrix's scenario 17 uses bare taskkill).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --group dev
      - name: Build kernel from the pinned nexus-vfs rev
        shell: bash
        run: |
          REV=$(grep -m1 -o 'rev = "[0-9a-f]\{40\}"' Cargo.toml | grep -o '[0-9a-f]\{40\}')
          git clone --quiet https://github.com/nexi-lab/nexus-vfs "${RUNNER_TEMP}/nexus-vfs"
          git -C "${RUNNER_TEMP}/nexus-vfs" checkout --quiet "${REV}"
          cargo build --manifest-path "${RUNNER_TEMP}/nexus-vfs/rust/profiles/cluster/Cargo.toml"
      - name: Windows-only Zone E2E suites
        env:
          NEXUS_KERNEL_BINARY: ${{ runner.temp }}/nexus-vfs/target/debug/nexusd-cluster
        run: uv run pytest -n 0 tests/e2e/server/test_zone_v2_p0_matrix_e2e.py tests/e2e/server/test_zone_v2_fault_injection_e2e.py tests/e2e/server/test_session_runtime_p1a_e2e.py tests/e2e/server/test_session_runtime_p1b_e2e.py

  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nexus-api-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/nexus-api-client/package-lock.json
      - run: npm ci
      - run: npm test -- --run tests/zones.test.ts
      - run: npm run lint

  rust-production-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: Build kernel from the pinned nexus-vfs rev
        shell: bash
        run: |
          REV=$(grep -m1 -o 'rev = "[0-9a-f]\{40\}"' Cargo.toml | grep -o '[0-9a-f]\{40\}')
          git clone --quiet https://github.com/nexi-lab/nexus-vfs "${RUNNER_TEMP}/nexus-vfs"
          git -C "${RUNNER_TEMP}/nexus-vfs" checkout --quiet "${REV}"
          cargo build --manifest-path "${RUNNER_TEMP}/nexus-vfs/rust/profiles/cluster/Cargo.toml"
