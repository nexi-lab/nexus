[workspace]
resolver = "2"
members = [
    # nexus-owned service modules (peer crate of nexus-vfs kernel).
    "rust/services",
    # nexus-vault — cdylib service plugin for PasswordVaultService,
    # loaded by nexusd-cluster via --plugin-dir.  Sits next to the
    # service crate source it wraps (rust/services/src/password_vault/).
    "rust/services/vault",
    # nexus-local-connector — cdylib driver plugin that exposes a
    # host filesystem subtree through the VFS.  Loaded by
    # nexusd-cluster via --plugin-dir; mounted via
    # `--mount-driver local-connector:<vfs-path>:<config-json>`.
    "rust/backends/local-connector",
    # nexus-fuse-plugin — cdylib service plugin that mounts the Nexus
    # VFS at an operator-named host path via libfuse3 (Linux).  Spawns
    # a fuser-based FUSE event loop in a background thread on
    # `nexus_service_create`; FUSE ops translate in-process to kernel
    # syscalls via the plugin-abi KernelHandle.  Loaded by
    # nexusd-cluster via --plugin-dir alongside nexus-vault.
    "rust/services/fuse-plugin",
]
# nexus-fuse excluded: standalone FUSE daemon with different dependency versions
# from the workspace.  Distinct from nexus-fuse-plugin (the new
# in-process service plugin above) — the legacy daemon talks to a
# Python FastAPI server over HTTPS REST and is being phased out as
# the plugin matures.
exclude = ["nexus-fuse"]

[workspace.dependencies]
# Kernel-tier crates from nexus-vfs (external git dependency).
# SSOT: https://github.com/nexi-lab/nexus-vfs
# Pinned at the nexus-vfs main commit that landed #41 (closes the
# latent replay_existing_mounts iter_dt_mount_entries try_read race
# that #40's timing change exposed reliably — the boot DT_MOUNT scan
# now waits for `applied_index >= commit_index` before reading, so a
# restart's cross-zone routes are always re-wired).  Bump alongside
# the rest of nexus-vfs updates when a downstream change needs newer
# kernel bits.
contracts = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "e68353c4b1556e20321efbfd52e4ed1a045f66a5" }
lib = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "e68353c4b1556e20321efbfd52e4ed1a045f66a5" }
transport = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "e68353c4b1556e20321efbfd52e4ed1a045f66a5" }
backends = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "e68353c4b1556e20321efbfd52e4ed1a045f66a5", default-features = false }
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "e68353c4b1556e20321efbfd52e4ed1a045f66a5", default-features = false }
raft = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "e68353c4b1556e20321efbfd52e4ed1a045f66a5", default-features = false, features = ["grpc"] }
nexus-plugin-abi = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "e68353c4b1556e20321efbfd52e4ed1a045f66a5" }
# Local service crate (nexus-owned).
services = { path = "rust/services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng", "std"] }
regex = "1.10"
memchr = "2.7"
roaring = "0.11"
globset = "0.4"
blake3 = "1.5"
string-interner = "0.20"
regex-syntax = "0.8"
crc32fast = "1.4"
fastcdc = "4.0"
mimalloc = { version = "0.1", default-features = false }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
prost = "0.14"
tonic-prost = "0.14"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
