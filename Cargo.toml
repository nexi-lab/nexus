[workspace]
resolver = "2"
members = [
    # nexus-owned service modules (peer crate of nexus-vfs kernel).
    "rust/services",
    # nexus-vault — cdylib service plugin for PasswordVaultService,
    # loaded by nexusd-cluster via --plugin-dir.  Sits next to the
    # service crate source it wraps (rust/services/src/password_vault/).
    "rust/services/vault",
    # nexus-local-connector — cdylib driver plugin that exposes a
    # host filesystem subtree through the VFS.  Loaded by
    # nexusd-cluster via --plugin-dir; mounted via
    # `--mount-driver local-connector:<vfs-path>:<config-json>`.
    "rust/backends/local-connector",
    # nexus-fuse-plugin — cdylib service plugin that mounts the Nexus
    # VFS at an operator-named host path via libfuse3 (Linux).  Spawns
    # a fuser-based FUSE event loop in a background thread on
    # `nexus_service_create`; FUSE ops translate in-process to kernel
    # syscalls via the plugin-abi KernelHandle.  Loaded by
    # nexusd-cluster via --plugin-dir alongside nexus-vault.
    "rust/services/fuse-plugin",
]
# nexus-fuse excluded: standalone FUSE daemon with different dependency versions
# from the workspace.  Distinct from nexus-fuse-plugin (the new
# in-process service plugin above) — the legacy daemon talks to a
# Python FastAPI server over HTTPS REST and is being phased out as
# the plugin matures.
exclude = ["nexus-fuse"]

[workspace.dependencies]
# Kernel-tier crates from nexus-vfs (external git dependency).
# SSOT: https://github.com/nexi-lab/nexus-vfs
# Pinned at the nexus-vfs main commit that landed #84 (Phase 1 of
# the bottom-up re-attempt of reverted PR #82): pure file-
# organization refactor relocating `dispatch_federation_peer` + 5
# `federation_peer_X` helpers + 2 slot accessors from io.rs /
# mod.rs to kernel/federation.rs — their architecturally correct
# home per docs/KERNEL-ARCHITECTURE.md §3.  Zero behavioural
# delta; E2E-validated against Federation E2E + cc-tasks-share
# E2E suites before merge.
# Builds on prior landmarks: #57 plugin-as-gRPC-service routing,
# #58 sealed-keystore signing trust root, #60 KernelHandle v3
# sys_stat_batch, #61 per-call EC/SC primitives, #62 CLI flag rename,
# #63 EC hot-path activation revert, #65 EC drain hardening, #66
# voter-default flip, #67 driver-readdir ABI v4, #68
# driver-delete-file + driver-stat, #69 driver-rmdir, #70
# FederationPeerClient + DRIVER_RMDIR ABI v5, #75 placeholder
# inherits parent metastore, #76–#78 sys_unlink dispatch chain,
# #79 DRY federation-peer-mount predicate + PeerBlobClient
# reentrancy, #80 sys_write defer-to-peer, #81 preserve miss-on-
# dispatch-failure semantics, #84 relocate federation-peer
# dispatch to kernel/federation.rs.  Bump alongside the rest of
# nexus-vfs updates when a downstream change needs newer kernel
# bits.
contracts = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "3bae5089409c8b5e1a6c30dd9eef4d9cbf543385" }
lib = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "3bae5089409c8b5e1a6c30dd9eef4d9cbf543385" }
transport = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "3bae5089409c8b5e1a6c30dd9eef4d9cbf543385" }
backends = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "3bae5089409c8b5e1a6c30dd9eef4d9cbf543385", default-features = false }
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "3bae5089409c8b5e1a6c30dd9eef4d9cbf543385", default-features = false }
raft = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "3bae5089409c8b5e1a6c30dd9eef4d9cbf543385", default-features = false, features = ["grpc"] }
nexus-plugin-abi = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "3bae5089409c8b5e1a6c30dd9eef4d9cbf543385" }
# Local service crate (nexus-owned).
services = { path = "rust/services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng", "std"] }
regex = "1.10"
memchr = "2.7"
roaring = "0.11"
globset = "0.4"
blake3 = "1.5"
string-interner = "0.20"
regex-syntax = "0.8"
crc32fast = "1.4"
fastcdc = "4.0"
mimalloc = { version = "0.1", default-features = false }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
prost = "0.14"
tonic-prost = "0.14"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

# Patched fuser: macOS build.rs supports libfuse3 feature for FUSE-T.
# Upstream fuser 0.17 hardcodes libfuse2 on macOS; FUSE-T's .pkg only
# ships libfuse3.  This patch adds a cfg(feature = "libfuse3") branch
# to the macOS build.rs path so fuse-plugin links against libfuse3
# natively.  Tracks upstream issue cberner/fuser#273.
[patch.crates-io]
fuser = { path = "rust/vendor/fuser-0.17.0-fuset" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
