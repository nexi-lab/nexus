[workspace]
resolver = "2"
members = [
    # nexus-owned service modules (peer crate of nexus-vfs kernel).
    "rust/services",
    # nexus-vault — cdylib service plugin for PasswordVaultService,
    # loaded by nexusd-cluster via --plugin-dir.  Sits next to the
    # service crate source it wraps (rust/services/src/password_vault/).
    "rust/services/vault",
    # nexus-local-connector — cdylib driver plugin that exposes a
    # host filesystem subtree through the VFS.  Loaded by
    # nexusd-cluster via --plugin-dir; mounted via
    # `--mount-driver local-connector:<vfs-path>:<config-json>`.
    "rust/backends/local-connector",
    # nexus-fuse-plugin — cdylib service plugin that mounts the Nexus
    # VFS at an operator-named host path via libfuse3 (Linux).  Spawns
    # a fuser-based FUSE event loop in a background thread on
    # `nexus_service_create`; FUSE ops translate in-process to kernel
    # syscalls via the plugin-abi KernelHandle.  Loaded by
    # nexusd-cluster via --plugin-dir alongside nexus-vault.
    "rust/services/fuse-plugin",
]
# nexus-fuse excluded: standalone FUSE daemon with different dependency versions
# from the workspace.  Distinct from nexus-fuse-plugin (the new
# in-process service plugin above) — the legacy daemon talks to a
# Python FastAPI server over HTTPS REST and is being phased out as
# the plugin matures.
exclude = ["nexus-fuse"]

[workspace.dependencies]
# All nexus-vfs crates use one revision so the host, plugins and shared
# contracts are built together.
contracts = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964" }
lib = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964" }
transport = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964" }
backends = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964", default-features = false }
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964", default-features = false }
raft = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964", default-features = false, features = ["grpc"] }
nexus-plugin-abi = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964" }
# The cluster daemon library entry (`nexus_cluster::run_with_services`).
# The `nexusd-cluster` binary that composes it now lives in nexus-vfs
# (`rust/profiles/cluster/`); this workspace only pulls the library
# through this dep to link against types (e.g. plugin ABI, service
# decls) at compile time — the daemon itself is installed via
# `cargo install --git nexus-vfs nexus-cluster --bin nexusd-cluster`
# in the Dockerfiles.
nexus-cluster = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964" }
# a2a messaging substrate. `default-features = false` leaves the
# `install` feature (which pulls raft to arm the stream-wakeup observer)
# OFF, so nexus-side consumers link only the stamp hook and stay
# raft-free — they reach raft through kernel.sys_* (§6.1). The substrate
# is armed in production at cluster boot in nexus-vfs, not here.
a2a = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964", default-features = false }
# managed-agent control plane + the shared subprocess host — RELOCATED into
# nexus-vfs (kernel-tier) so the production nexusd-cluster carries the agent
# control plane. `subprocess-host` enables the raw ACP-subprocess spawner (the
# nexus-side acp path + managed-agent both use HostedSubprocess).
managed-agent = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964", default-features = false }
subprocess = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "846bd8aaa7ea29ab813a0991bdf2c4be969c8964" }
# Local service crate (nexus-owned).
services = { path = "rust/services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng", "std"] }
regex = "1.10"
memchr = "2.7"
roaring = "0.11"
globset = "0.4"
blake3 = "1.5"
string-interner = "0.20"
regex-syntax = "0.8"
crc32fast = "1.4"
fastcdc = "4.0"
mimalloc = { version = "0.1", default-features = false }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
prost = "0.14"
tonic-prost = "0.14"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

# Patched fuser: macOS build.rs supports libfuse3 feature for FUSE-T.
# Upstream fuser 0.17 hardcodes libfuse2 on macOS; FUSE-T's .pkg only
# ships libfuse3.  This patch adds a cfg(feature = "libfuse3") branch
# to the macOS build.rs path so fuse-plugin links against libfuse3
# natively.  Tracks upstream issue cberner/fuser#273.
[patch.crates-io]
fuser = { path = "rust/vendor/fuser-0.17.0-fuset" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
