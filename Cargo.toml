[workspace]
resolver = "2"
members = [
    # nexus-owned service modules (peer crate of nexus-vfs kernel).
    "rust/services",
    # nexus-vault — cdylib service plugin for PasswordVaultService,
    # loaded by nexusd-cluster via --plugin-dir.  Sits next to the
    # service crate source it wraps (rust/services/src/password_vault/).
    "rust/services/vault",
    # nexus-local-connector — cdylib driver plugin that exposes a
    # host filesystem subtree through the VFS.  Loaded by
    # nexusd-cluster via --plugin-dir; mounted via
    # `--mount-driver local-connector:<vfs-path>:<config-json>`.
    "rust/backends/local-connector",
    # nexus-fuse-plugin — cdylib service plugin that mounts the Nexus
    # VFS at an operator-named host path via libfuse3 (Linux).  Spawns
    # a fuser-based FUSE event loop in a background thread on
    # `nexus_service_create`; FUSE ops translate in-process to kernel
    # syscalls via the plugin-abi KernelHandle.  Loaded by
    # nexusd-cluster via --plugin-dir alongside nexus-vault.
    "rust/services/fuse-plugin",
]
# nexus-fuse excluded: standalone FUSE daemon with different dependency versions
# from the workspace.  Distinct from nexus-fuse-plugin (the new
# in-process service plugin above) — the legacy daemon talks to a
# Python FastAPI server over HTTPS REST and is being phased out as
# the plugin matures.
exclude = ["nexus-fuse"]

[workspace.dependencies]
# Kernel-tier crates from nexus-vfs (external git dependency).
# SSOT: https://github.com/nexi-lab/nexus-vfs
# Pinned at the nexus-vfs commit that landed PR #106
# (a52f13015, 2026-07-02): identity.json persists the raft
# transport peer address book at platform-native user-data path
# (%LOCALAPPDATA%\Nexus, ~/Library/Application Support/Nexus,
# $XDG_DATA_HOME/nexus).  Boot merges CLI --peers with the
# persisted list, `nexusd-cluster join` sidecar records the
# leader --peer-addr so subsequent restarts (with NEXUS_PEERS
# unset per the entrypoint) still have a transport seed.
# node_id lifecycle unchanged — stays at <data_dir>/.node_id
# under the rotate-on-wipe PR #3996 opaque-ID contract.
# Cumulative stack:
# PR #98 (uniform local-first sys_write), PR #99 (KernelBlobFetcher
# federation cache SSOT-symmetric fix), PR #100 (runtime trust
# dir + SSOT allowlist), PR #101 (--advertise-addr decoupled from
# --hostname + nexusd-cluster join auto-bootstraps parent zone),
# PR #102 (sys_readdir observes DT_DIR backend entries), PR #103
# (restrict observation to DT_DIR — defensive workaround for the
# byte-read regression PR #102 shipped), PR #104 (root-cause fix
# — content_id stamping + drops PR #103's restriction), PR #105
# (size stamping — observation queries backend.stat for DT_REG so
# POSIX read consults the correct st_size).
#
# PR #102 + #103 + #104 close the Phase γ-A native cc-tasks-list
# UX gap end-to-end (both enumeration AND drill-down byte reads):
# Claude Code writes ~/.claude/tasks/<uuid>/1.json directly to host
# fs (bypassing sys_write).  sys_readdir observes the backend
# entries into metastore with `last_writer_address = self` +
# `content_id = Some(backend_path)`; raft replicates.  Peer's
# sys_readdir returns the entry via metastore.list; peer's
# sys_read uses metastore hit → last_writer-aware
# `try_remote_fetch` → writer's backend.read_content(cid) →
# byte-exact.  No new mount type, no schema change, no scatter
# RPC — reuses the try_remote_fetch pathway PR #98/#99 already
# validates.  Enables the peer-shared mount topology (both peers
# `--mount-driver` at the SAME VFS path, e.g. /shared/cc-tasks)
# which makes CC's native `cc tasks list` show a flat merged UUID
# list from both peers, and drilling into a session returns
# byte-exact content from the writer.
#
# PR #104 also fixes a latent bug in the read-path helper
# `observe_backend_content` (introduced in PR #98) that stamped
# content_id=None.  Second cross-peer reads on the same path
# would have dead-ended in try_remote_fetch → self → FileNotFound;
# not caught by tests because they only exercised one cross-peer
# read.  Same root-cause fix applies (stamp content_id from the
# route's backend_path), same SSOT rationale.
#
# PR #101 (preserved) closes two cross-machine federation contract
# gaps that wedged the Mac↔Win cc-tasks-share L1 smoke:
# 1. --advertise-addr / NEXUS_ADVERTISE_ADDR — explicit network
#    endpoint, decoupled from --hostname (display label).  Required
#    for cross-machine federation over overlay networks (Tailscale,
#    WireGuard, VPN) where the OS hostname does not resolve through
#    the overlay.  Falls back to {hostname}:{bind_port} for back-
#    compat — single-node tests unchanged.
# 2. `nexusd-cluster join` auto-bootstraps the parent zone (SOLO,
#    matches the per-node SOLO contract) when the data dir is fresh.
#    Lets joiner-only-flow (no env-var-driven pre-bootstrap) work
#    out of the box.
#
# PR #98 contract (preserved):
#
# WHAT CHANGED for downstream tests:
# * sys_write on a federation-peer-mount placeholder no longer
#   defers bytes to the SSOT peer via RPC.  Instead the placeholder
#   wires an auto-attached PathLocalBackend rooted at
#   `<data_dir>/federation-cache/<zone>/<sanitized-mount>/` so the
#   write lands on the WRITER's local fs.
# * sys_read on federation-peer-mount paths now consults
#   FileMetadata.last_writer_address: if last_writer differs from
#   the local self_address, skip the local backend probe (it may
#   hold orphan bytes from a prior local write that the peer's
#   write superseded) and federation-fetch from the actual writer.
# * The "joiner writes via FUSE -> bytes land on FOUNDER host fs"
#   contract from PR #80 is GONE.  Under the new contract bytes
#   land on the JOINER host fs (in the federation-cache dir); the
#   founder reads them via the new federation peer-fetch fallback.
#
# DELETED kernel surface:
# * RouteResult::via_federation_write + FederationWriteOutcome enum
# * DistributedCoordinator::peer_write trait method
# * FederationGrpcOps::write trait method
# * transport::FederationClient::write impl
#
# Syscall ABI / plugin ABI / raft Command contracts unchanged.
# Predecessors: PR #94 (observability), #96 (federation HAL
# collapse), #97 (FederationWriteOutcome placement fix + new
# kernel-architecture CI lint).
#
# E2E test impact (cc-tasks-share + federation-runbook): tests
# that assert byte residence on the FOUNDER host fs after a joiner
# write need to assert on JOINER host fs (federation-cache subdir)
# instead, plus a new federation-fetch round-trip assertion to
# confirm the founder can READ the joiner's bytes.  Tests that
# only assert byte-exact end-to-end (read returns what was
# written) should pass unchanged.
#
# Bump alongside the rest of nexus-vfs updates when a downstream
# change needs newer kernel bits.
contracts = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "a52f130157995e00428d5b72c2f6eeb944d1e531" }
lib = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "a52f130157995e00428d5b72c2f6eeb944d1e531" }
transport = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "a52f130157995e00428d5b72c2f6eeb944d1e531" }
backends = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "a52f130157995e00428d5b72c2f6eeb944d1e531", default-features = false }
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "a52f130157995e00428d5b72c2f6eeb944d1e531", default-features = false }
raft = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "a52f130157995e00428d5b72c2f6eeb944d1e531", default-features = false, features = ["grpc"] }
nexus-plugin-abi = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "a52f130157995e00428d5b72c2f6eeb944d1e531" }
# Local service crate (nexus-owned).
services = { path = "rust/services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng", "std"] }
regex = "1.10"
memchr = "2.7"
roaring = "0.11"
globset = "0.4"
blake3 = "1.5"
string-interner = "0.20"
regex-syntax = "0.8"
crc32fast = "1.4"
fastcdc = "4.0"
mimalloc = { version = "0.1", default-features = false }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
prost = "0.14"
tonic-prost = "0.14"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

# Patched fuser: macOS build.rs supports libfuse3 feature for FUSE-T.
# Upstream fuser 0.17 hardcodes libfuse2 on macOS; FUSE-T's .pkg only
# ships libfuse3.  This patch adds a cfg(feature = "libfuse3") branch
# to the macOS build.rs path so fuse-plugin links against libfuse3
# natively.  Tracks upstream issue cberner/fuser#273.
[patch.crates-io]
fuser = { path = "rust/vendor/fuser-0.17.0-fuset" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
