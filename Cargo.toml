[workspace]
resolver = "2"
members = [
    # nexus-owned service modules (peer crate of nexus-vfs kernel).
    "rust/services",
    # nexus-vault — cdylib service plugin for PasswordVaultService,
    # loaded by nexusd-cluster via --plugin-dir.  Sits next to the
    # service crate source it wraps (rust/services/src/password_vault/).
    "rust/services/vault",
    # nexus-local-connector — cdylib driver plugin that exposes a
    # host filesystem subtree through the VFS.  Loaded by
    # nexusd-cluster via --plugin-dir; mounted via
    # `--mount-driver local-connector:<vfs-path>:<config-json>`.
    "rust/backends/local-connector",
    # nexus-fuse-plugin — cdylib service plugin that mounts the Nexus
    # VFS at an operator-named host path via libfuse3 (Linux).  Spawns
    # a fuser-based FUSE event loop in a background thread on
    # `nexus_service_create`; FUSE ops translate in-process to kernel
    # syscalls via the plugin-abi KernelHandle.  Loaded by
    # nexusd-cluster via --plugin-dir alongside nexus-vault.
    "rust/services/fuse-plugin",
    # nexus-search-plugin — cdylib service plugin that hosts
    # `nexus.search.v1.SearchService` (recursive glob + regex grep
    # over the kernel VFS) via the Phase P plugin-as-gRPC-service
    # path.  Rust replacement for the Python
    # `nexus.bricks.search.search_service.SearchService`; sequential
    # walk over `sys_readdir` + `sys_read` in v1, trigram / streaming
    # / adaptive-strategy variants land in v2.
    "rust/services/search-plugin",
    # nexusd — the nexus cluster-profile daemon assembly binary
    # (`nexusd-cluster`). Composes the nexus-vfs cluster boot
    # (`nexus_cluster::run_with_services`) with the managed_agent control
    # plane via the ServiceRegistry bring-up seam. This IS the production
    # `cluster` profile (KERNEL-ARCHITECTURE §7) plus the agent control
    # plane; the full/S3 superset is the opt-in `driver-s3` feature.
    "rust/nexusd",
]
# nexus-fuse excluded: standalone FUSE daemon with different dependency versions
# from the workspace.  Distinct from nexus-fuse-plugin (the new
# in-process service plugin above) — the legacy daemon talks to a
# Python FastAPI server over HTTPS REST and is being phased out as
# the plugin matures.
exclude = ["nexus-fuse"]

[workspace.dependencies]
# Kernel-tier crates from nexus-vfs (external git dependency).
# SSOT: https://github.com/nexi-lab/nexus-vfs
#
# Pinned at merged nexus-vfs main after PR #139 (dlc: idempotent DT_MOUNT
# install — fixes the 2-voter cold-start `not leader` deadlock via
# get-before-put; live-verified Win↔Mac) and PR #138 (read ⊥ cache ⊥
# materialize — drop the try_remote_fetch cache-back so cross-node reads
# are on-demand under §3g; + surface previously-swallowed cross-node fetch
# errors). Both raft-contract-correct; cc-tasks §3g cross-node read
# validated bidirectionally live.
#
# Earlier: PR #120 -- S3 Phase H (respect
# identity.zones[].as_role on Row 4 rejoin; wiped learner rejoins as learner,
# not voter — closes the silent-SSOT-violation that was inflating voter set
# on every wipe cycle) on top of PR #113 -- Phase A-G unified bring-up
# (2026-07-05):
# PR #112 lands two bootstrap-safety fixes:
#   (1) split-brain guard — run_daemon refuses `bootstrap_static_async` when
#       `identity.json` already lists persisted peers.  Prevents the
#       "both-founder" misconfig (two nodes each auto-creating sharedzone
#       SOLO on empty data_dir + accidental parallel `NEXUS_FEDERATION_ZONES=
#       sharedzone` both wedging the federation with independent commit
#       histories that raft cannot merge).  Error message names both
#       correct roles: (a) wipe identity if you meant founder; (b) unset
#       NEXUS_FEDERATION_ZONES + run sidecar `join` if you meant joiner.
#   (2) fail-loud gRPC bind — `ZoneManager::start` used to `tracing::error!`
#       + swallow tonic serve errors, leaving daemon half-alive (raft + FUSE
#       + LocalConnector all up, no gRPC listener).  Now exits(1) so
#       supervisors + operator's `echo $?` see the failure at the right
#       level.  Bind failure is unrecoverable from inside the process.
# Companion rename in the same PR: `ZoneManagerBundle.peer_addrs` →
# `cli_peer_addrs`, new `identity_persisted_peers` field.  Docstring on
# the struct explains why the two peer fields are NOT unified (see PR
# body's trade-off analysis — merging breaks either root SOLO invariant
# or S3 reconnect contract).
#
# PR #111 completes the audit PR #110 began —
# 11 additional tracing sites where the field name was ambiguous
# (`peer = <u64>`, `leader = <u64>`, `node_id = <peer.node_id>`) all
# renamed to the disambiguated `peer_node_id` / `leader_node_id` +
# paired `_addr` field where NodeAddress is in scope.  A source-tree
# regression test walks `rust/raft/src/` at test time and rejects the
# retired shapes, closing the audit-methodology gap that let #110's
# manual grep miss these — a future contributor reintroducing
# `peer = target_id` gets red CI on their PR before merge.
# PR #110 closes the user-observable peer-identity
# leak class (6 commits): joiner seed_peers log emits bare host:port;
# SOLO invariant + non-resumable recovery errors use operator peer form;
# tracing/message-format node_id renamed to local_node_id / peer_node_id
# (incl. boot log `Zone 'root' registered (local_node_id=N, peers=P)`);
# to_raft_peer_str / to_operator_str / Display docstrings codify the SRP
# boundary; RaftError::NotLeader.leader_hint hard-renames from
# Option<u64> to Option<String> (operator-form host:port), removing the
# raw-id-in-Display leak at the type-system layer; unit-test regression
# pin asserts Display never embeds a ≥10-digit bare integer.
# PR #109 retires the legacy `<id>@host:port`
# peer address form at the operator boundary via an SRP split —
# `PeerAddress::parse_operator_addr` (used by --peers, NEXUS_PEERS,
# `nexusd-cluster join <peer_addr>`, identity.json load) hard-rejects
# `@` with a migration message; `PeerAddress::parse` (raft-internal
# round-trip: create_zone address-book keying, founder self-registration,
# ConfChange context) keeps the dual-form accept for the authoritative-id
# round-trips it relies on.  Identity persistence uses `to_operator_str`
# (bare `host:port`) so subsequent cold-boot load never trips the
# id-prefix rejection.  Operators no longer sync opaque node_ids between
# peers — `nexusd-cluster join <host:port> <zone> <path>` is the ONE
# accepted shape.
# PR #108 extends the try_remote_fetch
# "sender dispatches, remote handles" pattern from sys_read to
# sys_readdir.  Direction B of the peer-shared topology (Mac lists
# Win's session UUID Mac has never observed) now returns peer-side
# entries without an operator-side warm-up ceremony.  Additive:
# sys_readdir public API unchanged; new sys_readdir_peer_dispatch
# variant exists for the fan-out loop guard on peer-facing gRPC
# handlers.  ReaddirRequest gets a from_peer field (backward-compat
# additive) so 3+ node topologies terminate at the first hop.
# PR #106 identity.json persists the raft
# transport peer address book at platform-native user-data path
# (%LOCALAPPDATA%\Nexus, ~/Library/Application Support/Nexus,
# $XDG_DATA_HOME/nexus).  Boot merges CLI --peers with the
# persisted list, `nexusd-cluster join` sidecar records the
# leader --peer-addr so subsequent restarts (with NEXUS_PEERS
# unset per the entrypoint) still have a transport seed.
# node_id lifecycle unchanged — stays at <data_dir>/.node_id
# under the rotate-on-wipe PR #3996 opaque-ID contract.
# PR #107 (fix): identity peers are transport-only, not bootstrap —
# `ZoneManagerBundle::peer_addrs` reflects CLI --peers only, so
# root's per-node SOLO invariant guard in `bootstrap_or_join_zone`
# does not fire on joiner restart after `nexusd-cluster join`
# recorded a leader address to identity.  Identity's persisted
# peer list still seeds `ZoneManager`'s transport peer map (i.e.
# reconnect hint for federation raft messages).
# Cumulative stack:
# PR #98 (uniform local-first sys_write), PR #99 (KernelBlobFetcher
# federation cache SSOT-symmetric fix), PR #100 (runtime trust
# dir + SSOT allowlist), PR #101 (--advertise-addr decoupled from
# --hostname + nexusd-cluster join auto-bootstraps parent zone),
# PR #102 (sys_readdir observes DT_DIR backend entries), PR #103
# (restrict observation to DT_DIR — defensive workaround for the
# byte-read regression PR #102 shipped), PR #104 (root-cause fix
# — content_id stamping + drops PR #103's restriction), PR #105
# (size stamping — observation queries backend.stat for DT_REG so
# POSIX read consults the correct st_size).
#
# PR #102 + #103 + #104 close the Phase γ-A native cc-tasks-list
# UX gap end-to-end (both enumeration AND drill-down byte reads):
# Claude Code writes ~/.claude/tasks/<uuid>/1.json directly to host
# fs (bypassing sys_write).  sys_readdir observes the backend
# entries into metastore with `last_writer_address = self` +
# `content_id = Some(backend_path)`; raft replicates.  Peer's
# sys_readdir returns the entry via metastore.list; peer's
# sys_read uses metastore hit → last_writer-aware
# `try_remote_fetch` → writer's backend.read_content(cid) →
# byte-exact.  No new mount type, no schema change, no scatter
# RPC — reuses the try_remote_fetch pathway PR #98/#99 already
# validates.  Enables the peer-shared mount topology (both peers
# `--mount-driver` at the SAME VFS path, e.g. /shared/cc-tasks)
# which makes CC's native `cc tasks list` show a flat merged UUID
# list from both peers, and drilling into a session returns
# byte-exact content from the writer.
#
# PR #104 also fixes a latent bug in the read-path helper
# `observe_backend_content` (introduced in PR #98) that stamped
# content_id=None.  Second cross-peer reads on the same path
# would have dead-ended in try_remote_fetch → self → FileNotFound;
# not caught by tests because they only exercised one cross-peer
# read.  Same root-cause fix applies (stamp content_id from the
# route's backend_path), same SSOT rationale.
#
# PR #101 (preserved) closes two cross-machine federation contract
# gaps that wedged the Mac↔Win cc-tasks-share L1 smoke:
# 1. --advertise-addr / NEXUS_ADVERTISE_ADDR — explicit network
#    endpoint, decoupled from --hostname (display label).  Required
#    for cross-machine federation over overlay networks (Tailscale,
#    WireGuard, VPN) where the OS hostname does not resolve through
#    the overlay.  Falls back to {hostname}:{bind_port} for back-
#    compat — single-node tests unchanged.
# 2. `nexusd-cluster join` auto-bootstraps the parent zone (SOLO,
#    matches the per-node SOLO contract) when the data dir is fresh.
#    Lets joiner-only-flow (no env-var-driven pre-bootstrap) work
#    out of the box.
#
# PR #98 contract (preserved):
#
# WHAT CHANGED for downstream tests:
# * sys_write on a federation-peer-mount placeholder no longer
#   defers bytes to the SSOT peer via RPC.  Instead the placeholder
#   wires an auto-attached PathLocalBackend rooted at
#   `<data_dir>/federation-cache/<zone>/<sanitized-mount>/` so the
#   write lands on the WRITER's local fs.
# * sys_read on federation-peer-mount paths now consults
#   FileMetadata.last_writer_address: if last_writer differs from
#   the local self_address, skip the local backend probe (it may
#   hold orphan bytes from a prior local write that the peer's
#   write superseded) and federation-fetch from the actual writer.
# * The "joiner writes via FUSE -> bytes land on FOUNDER host fs"
#   contract from PR #80 is GONE.  Under the new contract bytes
#   land on the JOINER host fs (in the federation-cache dir); the
#   founder reads them via the new federation peer-fetch fallback.
#
# DELETED kernel surface:
# * RouteResult::via_federation_write + FederationWriteOutcome enum
# * DistributedCoordinator::peer_write trait method
# * FederationGrpcOps::write trait method
# * transport::FederationClient::write impl
#
# Syscall ABI / plugin ABI / raft Command contracts unchanged.
# Predecessors: PR #94 (observability), #96 (federation HAL
# collapse), #97 (FederationWriteOutcome placement fix + new
# kernel-architecture CI lint).
#
# E2E test impact (cc-tasks-share + federation-runbook): tests
# that assert byte residence on the FOUNDER host fs after a joiner
# write need to assert on JOINER host fs (federation-cache subdir)
# instead, plus a new federation-fetch round-trip assertion to
# confirm the founder can READ the joiner's bytes.  Tests that
# only assert byte-exact end-to-end (read returns what was
# written) should pass unchanged.
#
# Bump alongside the rest of nexus-vfs updates when a downstream
# change needs newer kernel bits.
contracts = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1" }
lib = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1" }
transport = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1" }
backends = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1", default-features = false }
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1", default-features = false }
raft = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1", default-features = false, features = ["grpc"] }
nexus-plugin-abi = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1" }
# The cluster daemon library entry (`nexus_cluster::run_with_services`),
# consumed by the nexus-side assembly binary (`rust/nexusd`) that composes
# the kernel/federation boot with the nexus service set via the
# ServiceRegistry bring-up seam.
nexus-cluster = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1" }
# a2a messaging substrate. `default-features = false` leaves the
# `install` feature (which pulls raft to arm the stream-wakeup observer)
# OFF, so nexus-side consumers link only the stamp hook and stay
# raft-free — they reach raft through kernel.sys_* (§6.1). The substrate
# is armed in production at cluster boot in nexus-vfs, not here.
a2a = { git = "https://github.com/nexi-lab/nexus-vfs", rev = "5f8b898e84166bdc9cf7b75c077b604c4f9d2ee1", default-features = false }
# Local service crate (nexus-owned).
services = { path = "rust/services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng", "std"] }
regex = "1.10"
memchr = "2.7"
roaring = "0.11"
globset = "0.4"
blake3 = "1.5"
string-interner = "0.20"
regex-syntax = "0.8"
crc32fast = "1.4"
fastcdc = "4.0"
mimalloc = { version = "0.1", default-features = false }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
prost = "0.14"
tonic-prost = "0.14"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

# Patched fuser: macOS build.rs supports libfuse3 feature for FUSE-T.
# Upstream fuser 0.17 hardcodes libfuse2 on macOS; FUSE-T's .pkg only
# ships libfuse3.  This patch adds a cfg(feature = "libfuse3") branch
# to the macOS build.rs path so fuse-plugin links against libfuse3
# natively.  Tracks upstream issue cberner/fuser#273.
[patch.crates-io]
fuser = { path = "rust/vendor/fuser-0.17.0-fuset" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
