[workspace]
resolver = "2"
members = [
    # nexus-owned service modules (peer crate of nexus-vfs kernel).
    "rust/services",
    # nexusd-vault — single-purpose binary hosting PasswordVaultService
    # over gRPC. Runs alongside (not bundled into) cluster.
    "rust/profiles/vault",
]
# nexus-fuse excluded: standalone FUSE daemon with different dependency versions
exclude = ["nexus-fuse"]

[workspace.dependencies]
# Kernel-tier crates from nexus-vfs (external git dependency).
# SSOT: https://github.com/nexi-lab/nexus-vfs
contracts = { git = "https://github.com/nexi-lab/nexus-vfs" }
lib = { git = "https://github.com/nexi-lab/nexus-vfs" }
transport = { git = "https://github.com/nexi-lab/nexus-vfs" }
backends = { git = "https://github.com/nexi-lab/nexus-vfs", default-features = false }
kernel = { git = "https://github.com/nexi-lab/nexus-vfs", default-features = false }
raft = { git = "https://github.com/nexi-lab/nexus-vfs", default-features = false, features = ["grpc"] }
# Local service crate (nexus-owned).
services = { path = "rust/services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng", "std"] }
regex = "1.10"
memchr = "2.7"
roaring = "0.11"
globset = "0.4"
blake3 = "1.5"
string-interner = "0.20"
regex-syntax = "0.8"
crc32fast = "1.4"
fastcdc = "4.0"
mimalloc = { version = "0.1", default-features = false }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
prost = "0.14"
tonic-prost = "0.14"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
