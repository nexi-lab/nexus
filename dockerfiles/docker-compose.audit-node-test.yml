# Audit-Node E2E Test — self-contained federation cluster + audit-node
# =========================================================================
# Previously stacked on top of docker-compose.dynamic-federation-test.yml,
# which was deleted in the same PR that introduced
# docker-compose.federation-runbook.yml.  The audit-node suite uses a
# different topology and zone set (corp / family production zones, plus
# an audit-node learner), so it gets its own self-contained compose
# rather than re-purposing the runbook one.
#
# Usage:
#   docker compose -f dockerfiles/docker-compose.audit-node-test.yml up -d
#   docker compose -f dockerfiles/docker-compose.audit-node-test.yml \
#     run --rm audit-test

services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: nexus-audit-dragonfly
    hostname: dragonfly
    restart: unless-stopped
    command: >
      dragonfly
      --maxmemory=256mb
      --proactor_threads=1
      --logtostderr
      --cache_mode=true
    expose:
      - "6379"
    volumes:
      - audit_dragonfly_data:/data
    networks:
      - audit-nexus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  nexus-1:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.nexusd-cluster
    image: nexusd-cluster:latest
    container_name: nexus-audit-node-1
    hostname: nexus-1
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
    environment:
      NEXUS_DATA_DIR: /app/data
      NEXUS_BIND_ADDR: 0.0.0.0:2126
      NEXUS_ADVERTISE_ADDR: nexus-1:2126
      NEXUS_PEERS: "nexus-2:2126,witness:2126"
      NEXUS_RAFT_TLS: "false"
      RUST_LOG: info,nexus_raft=debug
    volumes:
      - audit_nexus1_data:/app/data
    networks:
      - audit-nexus-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/2126' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  nexus-2:
    image: nexusd-cluster:latest
    container_name: nexus-audit-node-2
    hostname: nexus-2
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
    environment:
      NEXUS_DATA_DIR: /app/data
      NEXUS_BIND_ADDR: 0.0.0.0:2126
      NEXUS_ADVERTISE_ADDR: nexus-2:2126
      NEXUS_PEERS: "nexus-1:2126,witness:2126"
      NEXUS_RAFT_TLS: "false"
      RUST_LOG: info,nexus_raft=debug
    volumes:
      - audit_nexus2_data:/app/data
    networks:
      - audit-nexus-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/2126' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  witness:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.raft-witness
    image: nexus-raft-witness:latest
    container_name: nexus-audit-witness
    hostname: witness
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
    environment:
      NEXUS_BIND_ADDR: 0.0.0.0:2126
      NEXUS_PEERS: "nexus-1:2126,nexus-2:2126,witness:2126"
      NEXUS_DATA_DIR: /home/nexus/data
      RUST_LOG: info,nexus_raft=debug
    volumes:
      - audit_witness_data:/home/nexus/data
    networks:
      - audit-nexus-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/2126' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  audit-node:
    image: nexus-fullnode:latest
    container_name: nexus-audit-node
    hostname: audit-node
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
      nexus-1:
        condition: service_healthy
      nexus-2:
        condition: service_healthy
    environment:
      NEXUS_HOST: 0.0.0.0
      NEXUS_PORT: 2026
      NEXUS_DATA_DIR: /app/data
      NEXUS_PROFILE: cluster
      NEXUS_BIND_ADDR: 0.0.0.0:2126
      NEXUS_ADVERTISE_ADDR: audit-node:2126
      NEXUS_PEERS: "audit-node:2126"
      NEXUS_RAFT_TLS: "false"
      NEXUS_GRPC_BIND_ALL: "true"
      NEXUS_DRAGONFLY_URL: ${NEXUS_DRAGONFLY_URL:-redis://dragonfly:6379}
      NEXUS_API_KEY: ${NEXUS_API_KEY:-sk-test-dynamic-federation-key}
      NEXUS_BACKEND: ${NEXUS_BACKEND:-local}
      NEXUS_USE_UVLOOP: "true"
      RUST_LOG: info,nexus_raft=debug
      NEXUS_AUDIT_NODE_ROLE: "true"
      NEXUS_AUDIT_NODE_ZONE_ID: "audit"
    volumes:
      - audit_audit_node_data:/app/data
    networks:
      - audit-nexus-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2026/healthz/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  audit-test:
    image: nexus-fullnode:latest
    container_name: nexus-audit-test
    profiles:
      - run
    working_dir: /app
    depends_on:
      nexus-1:
        condition: service_healthy
      nexus-2:
        condition: service_healthy
      audit-node:
        condition: service_healthy
    entrypoint: []
    user: "0:0"
    volumes:
      - ..:/app
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/.pytest_cache"
      NEXUS_DOCKER_E2E: "1"
    command: >
      bash -c '
        set -e
        echo "Installing missing test dependencies..."
        pip install --retries 10 --timeout 60 -q \
          -i "${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}" \
          pytest pytest-asyncio pytest-timeout
        echo "Running audit-node long-workflow E2E tests..."
        python -m pytest tests/e2e/docker/test_federation_audit.py -v --no-header -o "addopts=" --timeout=300
      '
    networks:
      - audit-nexus-network

networks:
  audit-nexus-network:
    name: nexus_audit-nexus-network
    driver: bridge

volumes:
  audit_nexus1_data:
    name: nexus-audit-node1-data
  audit_nexus2_data:
    name: nexus-audit-node2-data
  audit_witness_data:
    name: nexus-audit-witness-data
  audit_audit_node_data:
    name: nexus-audit-node-data
  audit_dragonfly_data:
    name: nexus-audit-dragonfly-data
