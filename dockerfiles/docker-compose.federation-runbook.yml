# Federation Runbook E2E — 3-voter sharedzone HA cluster
# =========================================================================
# Single compose for all five test classes in
# tests/e2e/docker/test_federation_runbook.py.
#
# Topology mirrors the production runbook's recommended HA shape:
#
#   founder  (voter, owns local root + creates sharedzone, mounts /shared)
#   joiner   (voter, owns its own local root, joins sharedzone via CLI)
#   witness  (voter, vote-only — joins sharedzone as voter for quorum)
#
# Each node owns its own local root zone. `nexusd-cluster join` (run by
# the test container against the joiner and witness) writes the local
# DT_MOUNT into each node's local root, pointing at the sharedzone
# raft group. See docs/architecture/federation-cross-machine-runbook.html
# for the operator-level write-up of the same flow.
#
# Lifecycle contract — the fixture (not Docker) owns daemon lifecycle.
# No `restart: unless-stopped`: runbook §3b requires the daemon to be
# *down* while the offline `nexusd-cluster join` runs (redb exclusive
# lock).  An auto-restart policy violates that contract and races the
# join binary against a re-spawned daemon.  TestWitnessQuorumHA's
# `docker stop founder` / `docker start founder` semantics also need
# Docker to honor a stop and not bounce the container.
#
# Usage:
#   docker compose -f dockerfiles/docker-compose.federation-runbook.yml up -d founder joiner witness
#   docker compose -f dockerfiles/docker-compose.federation-runbook.yml run --rm test
#   docker compose -f dockerfiles/docker-compose.federation-runbook.yml down -v

# Bootstrap-mode auto-detect entrypoint (shared via YAML anchor).
#
# Why this exists:
#   * Runbook §3b says: pass `static` on first boot (empty data dir),
#     `restart` on subsequent boots (persisted ConfState + DT_MOUNT).
#   * PR #4028 validator enforces this strictly: `static` on a data dir
#     that already holds a 'root' zone fails the boot at parse time.
#   * Our fixture flow stops the joiner, runs offline `join` (writes
#     DT_MOUNT to data dir), then starts the joiner back up.  At that
#     second start the data dir is no longer empty, so we must switch
#     to `restart` — without operator intervention.
#
# S3 Phase G (nexus-vfs #118): the daemon auto-detects boot semantics
# via `plan_boot_action`; no operator declaration needed.  Row 0
# (data_dir has persisted state) → resume from disk regardless of
# env vars, so leftover NEXUS_FEDERATION_* on restart is harmless.
x-runbook-entrypoint: &runbook-entrypoint
  entrypoint:
    - /bin/bash
    - -c
    - |
      set -e
      DATA_DIR="${NEXUS_DATA_DIR:-/app/data}"
      # Reachable 0.0.0.0 bind + --no-tls trips the loopback auth invariant;
      # this is a trusted CI/compose cluster, so take the sanctioned escape.
      exec nexusd-cluster \
        --bind-addr "$${NEXUS_BIND_ADDR:-0.0.0.0:2126}" \
        --data-dir "$$DATA_DIR" \
        --no-tls \
        --insecure-no-auth
  command: []

services:
  founder:
    <<: *runbook-entrypoint
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.nexusd-cluster
    image: nexusd-cluster:latest
    container_name: nexus-runbook-founder
    hostname: founder
    environment:
      NEXUS_HOSTNAME: founder
      NEXUS_BIND_ADDR: 0.0.0.0:2126
      NEXUS_ADVERTISE_ADDR: founder:2126
      NEXUS_ALLOW_HOSTNAME_ADVERTISE: "1"
      NEXUS_DATA_DIR: /app/data
      NEXUS_NO_TLS: "true"
      # First boot only — auto-detect entrypoint strips these on restart.
      NEXUS_CLUSTER_INIT: sharedzone
      NEXUS_CLUSTER_INIT_MOUNTS: /shared=sharedzone
      RUST_LOG: info,nexus_raft=debug
    volumes:
      - runbook_founder_data:/app/data
    networks:
      - nexus-runbook-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/2126' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  joiner:
    <<: *runbook-entrypoint
    image: nexusd-cluster:latest
    container_name: nexus-runbook-joiner
    hostname: joiner
    environment:
      NEXUS_HOSTNAME: joiner
      NEXUS_BIND_ADDR: 0.0.0.0:2126
      NEXUS_ADVERTISE_ADDR: joiner:2126
      NEXUS_ALLOW_HOSTNAME_ADVERTISE: "1"
      NEXUS_DATA_DIR: /app/data
      NEXUS_NO_TLS: "true"
      RUST_LOG: info,nexus_raft=debug
    volumes:
      - runbook_joiner_data:/app/data
    networks:
      - nexus-runbook-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/2126' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  witness:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.raft-witness
    image: nexus-raft-witness:latest
    container_name: nexus-runbook-witness
    hostname: witness
    environment:
      NEXUS_HOSTNAME: witness
      NEXUS_BIND_ADDR: 0.0.0.0:2126
      NEXUS_DATA_DIR: /home/nexus/data
      NEXUS_NO_TLS: "true"
      # Witness self-detects from NEXUS_PEERS (its own boot path keeps
      # the legacy contract — see bin/witness.rs in nexus-vfs).
      NEXUS_PEERS: founder:2126,joiner:2126,witness:2126
      RUST_LOG: info,nexus_raft=debug
    volumes:
      - runbook_witness_data:/home/nexus/data
    networks:
      - nexus-runbook-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/2126' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  test:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.federation-test
    image: nexus-federation-test:latest
    container_name: nexus-runbook-test
    profiles:
      - run
    depends_on:
      founder:
        condition: service_healthy
      joiner:
        condition: service_healthy
      witness:
        condition: service_healthy
    # working_dir, PYTHONPATH, PYTEST_ADDOPTS, command — all inherited
    # from Dockerfile.federation-test (single SSOT for runner runtime
    # config).  Compose owns only topology: read-only source mount,
    # docker socket, cluster gRPC addresses.
    user: "0:0"
    volumes:
      - ..:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NEXUS_RUNBOOK_E2E: "1"
      NEXUS_FOUNDER_GRPC: founder:2126
      NEXUS_JOINER_GRPC: joiner:2126
      NEXUS_WITNESS_GRPC: witness:2126
      NEXUS_FOUNDER_CONTAINER: nexus-runbook-founder
      NEXUS_JOINER_CONTAINER: nexus-runbook-joiner
      NEXUS_WITNESS_CONTAINER: nexus-runbook-witness
      # Volume names the fixture mounts into transient `nexusd-cluster join`
      # sidecars when running the offline join flow.
      NEXUS_FOUNDER_VOLUME: nexus-runbook-founder-data
      NEXUS_JOINER_VOLUME: nexus-runbook-joiner-data
      NEXUS_WITNESS_VOLUME: nexus-runbook-witness-data
      NEXUS_RUNBOOK_NETWORK: nexus-runbook-net
      NEXUS_CLUSTER_IMAGE: nexusd-cluster:latest
    networks:
      - nexus-runbook-net

networks:
  nexus-runbook-net:
    name: nexus-runbook-net
    driver: bridge

volumes:
  runbook_founder_data:
    name: nexus-runbook-founder-data
  runbook_joiner_data:
    name: nexus-runbook-joiner-data
  runbook_witness_data:
    name: nexus-runbook-witness-data
