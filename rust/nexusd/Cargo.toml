[package]
name = "nexusd"
version = "0.1.0"
edition = "2021"
description = "Nexus cluster-profile daemon assembly — nexus-vfs cluster/federation boot composed with the nexus managed_agent control plane via the ServiceRegistry bring-up seam. This IS the `cluster` deployment profile (KERNEL-ARCHITECTURE §7) plus the agent control plane: the slim, size-gated production binary. driver-s3 / the full superset is an opt-in feature, never the default."
authors = ["Nexus Team"]
publish = false

[[bin]]
name = "nexusd-cluster"
path = "src/main.rs"

[features]
default = []
# Opt UP to the full/S3 superset (KERNEL-ARCHITECTURE §7: cluster ⊂ … ⊂ full):
# adds the S3 / R2 object-store driver via `backends` feature unification.
# Default builds stay the slim `cluster` profile (path-local + remote only)
# so the shipped binary keeps the sudowork/edge size budget; only an
# S3-serving tier builds `--features driver-s3`.
driver-s3 = ["dep:backends", "backends/driver-s3"]
# Co-host the real sudocode managed-agent runtime IN-PROCESS. Off by
# default so the slim `cluster` binary stays sudocode-free (profile purity
# — §7); a cohost-enabled build statically links `sudocode-tools` (which
# carries `SudoCodeSpawnAdapter` next to the loop it wraps) and injects it
# via `install_managed_agent_with_spawn`, so a minted agent runs a real LLM
# loop doing in-process `KernelSyscall` calls (no gRPC on its fs path).
# The kernel rev MUST match the workspace pin (both at nexus-vfs `f3031ee`)
# so `SpawnTask<Kernel>` is one type across the seam.
cohost-sudocode = ["dep:sudocode-tools"]

[dependencies]
# Cluster library entry — `nexus_cluster::run_with_services` owns clap
# parsing, the tokio runtime, and the whole kernel + raft + federation boot.
# It already pulls the slim `cluster` backends slice (path-local + remote);
# this crate adds NO extra drivers by default (profile purity — §7).
nexus-cluster = { workspace = true }
# a2a from-stamp hook (its `service_decl`); default-features keeps it
# raft-free (the stream-wakeup observer is armed in cluster boot, not here).
a2a = { workspace = true }
# The agent control plane composed into the daemon at boot — the `cluster`
# profile's managed-agent service (§7). RELOCATED to nexus-vfs, so the assembly
# now links it directly (not via the nexus `services` crate). `subprocess-host`
# enables the raw ACP-subprocess spawner for the sudowork/hydra spawn_spec tunnel.
managed-agent = { workspace = true, features = ["subprocess-host"] }
# Present ONLY to thread the optional `driver-s3` feature into the shared
# `backends` compilation for the full superset; nexusd calls no backends API,
# so it is not pulled at all in the default (slim cluster) build.
backends = { workspace = true, default-features = false, optional = true }
anyhow = "1"

# ── Co-host (opt-in `cohost-sudocode`) ──────────────────────────────────
# The real sudocode agent runtime, linked ONLY when co-hosting. `sudocode-
# tools` reaches `kernel` at the SAME nexus-vfs rev the workspace pins
# (`f3031ee`), so `Kernel` / `AgentDescriptor` / `KernelSyscall` / `AgentState`
# unify across the seam and `SpawnTask<Kernel>` is a single monomorphised
# type. `sudocode-tools` carries BOTH the `spawn_managed_agent` factory and
# the `SudoCodeSpawnAdapter` this binary injects at boot — there is no
# nexus-side co-host glue and no runtime enum to map (the adapter reports
# `kernel::AgentState` directly). Pinned to sudocode main (spawn AgentState
# collapse).
sudocode-tools = { package = "tools", git = "https://github.com/sudoprivacy/sudocode", rev = "dd887ce186b75cf4b23a1905f3b6ea454016cf3a", optional = true }
# Named directly to spell `kernel::kernel::{ServiceDecl, Kernel}` — the
# managed-agent boot decl's return type (both builds) and the co-host
# adapter's `SpawnTask<Kernel>` (cohost build). Already present transitively
# via services / nexus-cluster at the same workspace pin, so this direct dep
# adds no new compilation and keeps one `Kernel` type.
kernel = { workspace = true, default-features = false }
