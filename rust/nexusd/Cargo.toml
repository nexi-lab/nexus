[package]
name = "nexusd"
version = "0.1.0"
edition = "2021"
description = "Nexus cluster-profile daemon assembly — nexus-vfs cluster/federation boot composed with the nexus managed_agent control plane via the ServiceRegistry bring-up seam. This IS the `cluster` deployment profile (KERNEL-ARCHITECTURE §7) plus the agent control plane: the slim, size-gated production binary. driver-s3 / the full superset is an opt-in feature, never the default."
authors = ["Nexus Team"]
publish = false

[[bin]]
name = "nexusd-cluster"
path = "src/main.rs"

[features]
default = []
# Opt UP to the full/S3 superset (KERNEL-ARCHITECTURE §7: cluster ⊂ … ⊂ full):
# adds the S3 / R2 object-store driver via `backends` feature unification.
# Default builds stay the slim `cluster` profile (path-local + remote only)
# so the shipped binary keeps the sudowork/edge size budget; only an
# S3-serving tier builds `--features driver-s3`.
driver-s3 = ["dep:backends", "backends/driver-s3"]
# Opt-in HTTP-API axum listener over the search-plugin gRPC surface
# (part of the R10 nexus-server → pure-Rust migration; epic #4674).
# Linking axum + tonic-client + reqwest transitively adds ~0.7 MiB
# of binary weight — kept OFF in the default slim `cluster` build to
# stay under the §7 size budget.  A cluster tier that serves HTTP
# builds `--features http-api`.  Runtime bring-up ALSO requires
# `NEXUS_HTTP_ADDR` (see `http_api_decl` in main.rs) — the feature
# gates the CODE, the env gates the LISTENER.
http-api = ["dep:nexus-http-api", "dep:tracing"]
# Co-host the real sudocode managed-agent runtime IN-PROCESS. Off by
# default so the slim `cluster` binary stays sudocode-free (profile purity
# — §7); a cohost-enabled build statically links `sudocode-tools` (which
# carries `SudoCodeSpawnAdapter` next to the loop it wraps) and injects it
# via `install_managed_agent_with_spawn`, so a minted agent runs a real LLM
# loop doing in-process `KernelSyscall` calls (no gRPC on its fs path).
# The kernel rev MUST match the workspace pin (both at nexus-vfs `601c2af`)
# so `SpawnTask<Kernel>` is one type across the seam.
cohost-sudocode = ["dep:sudocode-tools"]
# Opt-in ReBAC enforcer — Rust replacement for the Python
# `bricks/rebac/` (part of the R10 pure-Rust `nexus-server`
# migration; epic #4674).  Links `nexus-rebac` (the Zanzibar-shaped
# graph engine + raft-backed tuple store + `PermissionProvider`
# impl) and wires it into the kernel's ONE permission-provider slot
# at boot.  OFF in the default slim `cluster` build AND in
# `--features http-api` — pulls in the `lib::rebac` graph engine +
# `AHashMap` / `string_interner` transitively, so kept behind an
# explicit gate.  Compose via `--features full` for the everything
# build; a la carte `--features rebac,http-api` also works.
#
# The `nexus-http-api?/rebac` chain propagates the rebac feature
# into the http-api crate WHEN http-api is also enabled — so
# `--features http-api,rebac` mounts the `/v2/rebac/tuples`
# router in addition to installing the syscall-time enforcer.
# The `?` gate keeps `--features rebac` alone from pulling in the
# http-api dep (enforcer without HTTP surface is a valid mode).
rebac = ["dep:nexus-rebac", "nexus-http-api?/rebac"]
# Meta-feature: the "full superset" build — enables every opt-in
# service that does not require cross-repo pin coordination
# (§7: cluster ⊂ … ⊂ full).  Downstream tooling that wants every
# in-house capability without spelling each feature builds
# `--features full`.  The slim `cluster` production binary stays
# the default (this meta ONLY pulls features UP, never restricts
# the slim path).
#
# **`cohost-sudocode` NOT included** — it links `sudocode-tools`
# from a pinned rev in a separate repo (sudoprivacy/sudocode) that
# must match the workspace's `nexus-vfs` pin for `SpawnTask<Kernel>`
# to unify.  Bumping either half out of sync fails the build.
# Operators who want the true everything-build spell it explicitly
# as `--features full,cohost-sudocode` (which fails LOUD until the
# sudocode pin is refreshed).
full = ["driver-s3", "http-api", "rebac"]

[dependencies]
# Cluster library entry — `nexus_cluster::run_with_services` owns clap
# parsing, the tokio runtime, and the whole kernel + raft + federation boot.
# It already pulls the slim `cluster` backends slice (path-local + remote);
# this crate adds NO extra drivers by default (profile purity — §7).
nexus-cluster = { workspace = true }
# a2a from-stamp hook (its `service_decl`); default-features keeps it
# raft-free (the stream-wakeup observer is armed in cluster boot, not here).
a2a = { workspace = true }
# The agent control plane composed into the daemon at boot — the `cluster`
# profile's managed-agent service (§7). RELOCATED to nexus-vfs, so the assembly
# now links it directly (not via the nexus `services` crate). `subprocess-host`
# enables the raw ACP-subprocess spawner for the sudowork/hydra spawn_spec tunnel.
managed-agent = { workspace = true, features = ["subprocess-host"] }
# Present ONLY to thread the optional `driver-s3` feature into the shared
# `backends` compilation for the full superset; nexusd calls no backends API,
# so it is not pulled at all in the default (slim cluster) build.
backends = { workspace = true, default-features = false, optional = true }
anyhow = "1"

# ── Co-host (opt-in `cohost-sudocode`) ──────────────────────────────────
# The real sudocode agent runtime, linked ONLY when co-hosting. `sudocode-
# tools` reaches `kernel` at the SAME nexus-vfs rev the workspace pins
# (`601c2af`), so `Kernel` / `AgentDescriptor` / `KernelSyscall` / `AgentState`
# unify across the seam and `SpawnTask<Kernel>` is a single monomorphised
# type. `sudocode-tools` carries BOTH the `spawn_managed_agent` factory and
# the `SudoCodeSpawnAdapter` this binary injects at boot — there is no
# nexus-side co-host glue and no runtime enum to map (the adapter reports
# `kernel::AgentState` directly). Pinned to sudocode main (spawn AgentState
# collapse).
sudocode-tools = { package = "tools", git = "https://github.com/sudoprivacy/sudocode", rev = "69328d3e081e23801a85d022b292c01fe6f184c5", optional = true }
# Named directly to spell `kernel::kernel::{ServiceDecl, Kernel}` — the
# managed-agent boot decl's return type (both builds) and the co-host
# adapter's `SpawnTask<Kernel>` (cohost build). Already present transitively
# via services / nexus-cluster at the same workspace pin, so this direct dep
# adds no new compilation and keeps one `Kernel` type.
kernel = { workspace = true, default-features = false }

# HTTP-API axum shim over the search-plugin gRPC surface (part of
# the R10 nexus-server → pure-Rust migration; epic #4674).  Wired
# in conditionally — only builds a live listener when the
# `http-api` feature is enabled AND `NEXUS_HTTP_ADDR` is set on the
# environment.  Zero cost in the default slim `cluster` build
# (feature off ⇒ crate not linked, ~0.7 MiB weight not shipped).
nexus-http-api = { path = "../services/http-api", optional = true }
# One-line log of "HTTP-API skipped due to malformed NEXUS_HTTP_ADDR"
# in `http_api_decl`.  Only linked when the `http-api` feature is on;
# the rest of nexusd inherits tracing via `nexus-cluster`'s
# `install_tracing` (which itself pulls tracing in unconditionally).
tracing = { version = "0.1", optional = true }

# ReBAC enforcer (opt-in `rebac` feature; folded into `full`). Links
# only when the feature is on — zero cost in the default slim
# `cluster` build and in the `--features http-api` build.  Ships
# `RaftReBACTupleStore` (over the same credential-zone consensus as
# `RaftAuthKeyStore`, one namespace over), `ReBACGraphCache`, and
# `RebacPermissionProvider` — the kernel's ONE `PermissionProvider`
# slot receives an `Arc<Box<Self>>` at boot.
nexus-rebac = { path = "../services/rebac", optional = true }
