[package]
name = "nexus-http-api"
version = "0.1.0"
edition = "2021"
description = "PoC axum-based HTTP-API crate for the nexus-server → pure-Rust migration (epic #4674).  v0 ships a single /v2/status handler so the crate + axum plumbing pattern is proven end-to-end before the router surface grows."

[lib]
name = "nexus_http_api"
crate-type = ["rlib"]

[dependencies]
# axum HTTP surface.  Feature set matches the sibling
# `service-matrix-adapter` axum pin in rust/services/Cargo.toml
# (0.8 + json/http1/tokio/matched-path/query) so both crates
# share the same tower + hyper stack when linked into the same
# binary.
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio", "matched-path", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

# tonic client for talking to the upstream search-plugin (and
# eventually other gRPC services).  Version pinned to the workspace
# `tonic = 0.14` shipping in rust/services/Cargo.toml so the two
# crates share the same hyper stack when co-hosted in one binary.
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }

# Sharded cache for per-upstream tonic Channel — one Channel per
# backend address, dialed lazily on first use.  Same 6.1 pin the
# sibling search-plugin peer-fanout uses (search-plugin/Cargo.toml).
dashmap = "6.1"

# Bearer-token → `OperationContext` SSOT.
#
# The `AuthProvider` trait + `AuthCredentials` + kernel-default
# `NoAuth` live in the nexus-vfs `transport` crate (same rev as
# `contracts`).  Reusing them means the http-api middleware, the
# kernel gRPC interceptor (`transport::grpc::VfsServiceImpl::authenticate`),
# and any future service on the auth plane all resolve credentials
# through ONE trait — not each inventing its own.  The resolved
# `OperationContext` is the SSOT struct every `kernel::sys_*`
# already consumes, so injecting it into request extensions is
# byte-compatible with future direct-syscall handler paths.
contracts = { workspace = true }
transport = { workspace = true }

# Parked-error surfacing at the handler boundary (Ok/Err in the
# lib, mapped to HTTP status in the axum extractor).  Same 1.0 pin
# the sibling search-plugin uses.
thiserror = "1"

[build-dependencies]
# Client-only proto codegen from the workspace's search proto SSOT
# (`rust/services/proto/nexus/search/v1/search.proto`).  Same tool
# stack the sibling search-plugin build.rs uses; the vendored
# `protoc` keeps the build hermetic on hosts without a
# system-installed protobuf-compiler.
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
# In-process router pathway pinning (unit tests use
# `tower::ServiceExt::oneshot`).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Real-TCP integration cover — `tests/serve_e2e.rs` binds an
# ephemeral port with `axum::serve` and hits it via `reqwest` so the
# hyper listener + tower service composition is exercised end-to-end
# alongside the in-process handler tests (rustls off; only need HTTP
# to a loopback listener).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# `tests/glob_e2e.rs` runs a mock `SearchService` implementation on
# an ephemeral tonic server so the axum → tonic-client → gRPC-server
# chain is exercised end-to-end.  The mock only needs the server
# side of tonic + the wrapping stream adapter for the listener.
serde_json = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
