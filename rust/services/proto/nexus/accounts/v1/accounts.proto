syntax = "proto3";
package nexus.accounts.v1;

service AccountsService {
  rpc Register(RegisterRequest) returns (UserProfile);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetProfile(GetProfileRequest) returns (UserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (AccountMessage);
  rpc VerifyEmail(VerifyEmailRequest) returns (AccountMessage);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  optional string username = 3;
  optional string display_name = 4;
}

message LoginRequest {
  string identifier = 1;
  string password = 2;
}

message UserProfile {
  string user_id = 1;
  optional string email = 2;
  optional string username = 3;
  optional string display_name = 4;
  optional string avatar_url = 5;
  string primary_auth_method = 6;
  bool is_global_admin = 7;
  bool email_verified = 8;
  optional string zone_id = 9;
  string created_at = 10;
  optional string last_login_at = 11;
}

message LoginResponse {
  string token = 1;
  UserProfile user = 2;
}

message GetProfileRequest {}

message UpdateProfileRequest {
  optional string display_name = 1;
  optional string avatar_url = 2;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {
  bool success = 1;
}

message RequestEmailVerificationRequest {
  optional string email = 1;
}

message VerifyEmailRequest {
  string token = 1;
}

message AccountMessage {
  string message = 1;
}
