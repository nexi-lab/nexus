// SearchService — the Rust replacement for the Python
// `nexus.bricks.search.search_service.SearchService`.
//
// Exposed by the `nexus-search-plugin` cdylib and routed by
// `nexusd-cluster` via the Phase P plugin-as-gRPC-service path
// (`nexus_plugin_grpc_services` symbol → `PluginProxyService`
// bytes-level dispatch).
//
// v1 scope: recursive glob + regex grep, sequential walk over the
// kernel VFS via `sys_readdir` + `sys_read`. Cross-node paths
// resolve transparently through the same federation `try_remote_fetch`
// fallback local reads use — search on node A sees files hosted on
// node B without any plugin-side federation awareness. Result sets
// are capped by `max_results` on the wire (unary response); streaming
// / trigram / adaptive-strategy variants land in v2.

syntax = "proto3";

package nexus.search.v1;

service SearchService {
  // Recursively walk `root_path`; return the absolute VFS paths of
  // entries matching `pattern`.
  //
  // Pattern is a globset-style glob (`**/*.py`, `docs/*.md`, ...) —
  // MATCHED against each entry's path relative to `root_path`.  The
  // RESPONSE paths are the full absolute VFS path (starts with `/`),
  // matching `GrepMatch.path` convention across the service so callers
  // decode both rpcs' path fields with one rule.
  rpc Glob(GlobRequest) returns (GlobResponse);

  // Recursively walk `root_path` and return every regex match in
  // every file whose path (relative to `root_path`) matches
  // `file_pattern` (leave empty for all files).
  rpc Grep(GrepRequest) returns (GrepResponse);

  // Ranked keyword search over an indexed corpus.  Phase 1 (Query
  // keyword-only) of the Python-parity roadmap — see
  // `PARITY_ROADMAP.md`.  The wire shape carries fields for hybrid
  // and semantic modes as well so future phases (P2 vector, P3
  // fusion) add behaviour, not new RPCs.  For P1, `query_type`
  // values other than KEYWORD are rejected with `Status::unimplemented`.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Add / refresh documents in the corpus.  Walk `root_path`
  // recursively when `recursive=true`, read each regular file via
  // `sys_read`, and add it to the per-zone tantivy index.  Phase 1
  // uses one chunk per file — Phase 4 will fold in the real
  // markdown-/code-aware chunker.
  rpc Index(IndexRequest) returns (IndexResponse);

  // Incremental refresh (Phase 5).  Walks `root_path` like Index,
  // but consults a per-zone (path → mtime_ms) cache and only re-
  // processes files that are new, edited (fresh mtime > cached),
  // or removed (in cache but missing from the walk — dropped from
  // both FTS and ANN).  Files whose mtime matches the cache are
  // skipped — a Refresh over a mostly-unchanged corpus is O(walk +
  // a couple of stat calls) rather than O(full reindex).
  //
  // Callers hit Refresh on a cadence they choose (cron, on-write
  // hook once federation adds one, etc.); nothing about Refresh
  // requires or implies scheduling on the plugin side.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
}

// ── Glob ──────────────────────────────────────────────────────────

message GlobRequest {
  string root_path = 1;
  // globset-style glob. Empty = match every entry.
  string pattern = 2;
  // Safety cap on the returned list. `truncated=true` in the response
  // signals we stopped scanning at this many hits. 0 ⇒ server-side
  // default (10_000).
  uint32 max_results = 3;
  // Auth token per the same convention as vfs.proto; server-side
  // permission gate reads this via OperationContext.
  string auth_token = 4;
  // Sort results by containing-file mtime descending (newest first)
  // BEFORE the `max_results` cap. Requires one `sys_stat` per matched
  // path — for a bounded cap this is sub-ms. Files with unknown mtime
  // (kernel returns `null`) sort last, preserving walk order among
  // themselves. Freshness-aware equivalent of the Python
  // SearchDaemon `recency=on` mode (nexi-lab/nexus#4553) — no
  // fusion-score multiplier applies because Glob has no score.
  bool sort_recency = 5;
}

message GlobResponse {
  // Absolute VFS paths of matching entries (each starts with `/`).
  // Same convention as `GrepMatch.path` — the callers decode both
  // rpcs' path outputs with one rule.
  repeated string paths = 1;
  // `paths.len() == max_results` AND more entries were skipped.
  bool truncated = 2;
  // Non-empty when the walk aborted mid-flight (e.g. root_path
  // not found, permission denied). Callers should treat a
  // non-empty error the same as an empty `paths` list.
  optional string error = 3;
}

// ── Grep ──────────────────────────────────────────────────────────

message GrepRequest {
  string root_path = 1;
  // Regex compiled with the `regex` crate on the server. Anchors,
  // groups, and inline flags (`(?i)`) all work.
  string pattern = 2;
  // Optional file-name filter (globset syntax). Empty ⇒ scan every
  // regular file.
  string file_pattern = 3;
  // Case-insensitive match — layered on top of `pattern` via a
  // regex builder flag (equivalent to a leading `(?i)`, kept as a
  // separate field so the wire distinguishes "explicit case
  // insensitive" from "pattern contains (?i)").
  bool ignore_case = 4;
  // Safety cap; 0 ⇒ server-side default (1_000).
  uint32 max_results = 5;
  // Lines of context to include before / after each match. 0 ⇒ none.
  uint32 before_context = 6;
  uint32 after_context = 7;
  // Invert: return lines that DO NOT match the pattern.
  bool invert_match = 8;
  string auth_token = 9;
  // Sort matches by containing-file mtime descending (newest file
  // first). Matches from the same file keep line-order among
  // themselves — files are the sort unit, so all hits inside one
  // file stay contiguous. See `GlobRequest.sort_recency` for the
  // Python-SearchDaemon mirror context (nexi-lab/nexus#4553).
  bool sort_recency = 10;
}

message GrepMatch {
  // Path is expressed as VFS absolute (starts with `/`).
  string path = 1;
  // 1-indexed line number of the matched line.
  uint32 line_number = 2;
  // The matched line itself (trailing newline stripped).
  string line = 3;
  // Optional context lines, in order. `before` are the lines
  // immediately preceding `line`; `after` are the lines immediately
  // following. Empty when `before_context` / `after_context` is 0.
  repeated string before = 4;
  repeated string after = 5;
}

message GrepResponse {
  repeated GrepMatch matches = 1;
  bool truncated = 2;
  optional string error = 3;
}

// ── Query / Index ─────────────────────────────────────────────────
//
// Ranked search over a persistent per-zone corpus.  Backed by tantivy
// (BM25) in Phase 1; Phase 2 folds in semantic (fastembed + hnsw) and
// Phase 3 folds in hybrid fusion + recency decay.
//
// Wire-shape policy: fields land in the phase that uses them, NOT
// pre-declared.  P2 adds semantic knobs, P3 adds fusion knobs, P6
// adds recency knobs — each phase's proto delta ships with the
// behaviour that gives the field meaning.  Adding a proto3 field is
// O(1); shipping inert fields ahead of time is a tombstone for
// behaviour that doesn't exist yet.
//
// `query_type` is the sole knob P1 needs — it lets P2/P3 lift the
// KEYWORD-only gate without inventing a discriminator.

enum QueryType {
  // proto3 requires a 0 default.  Treated as KEYWORD by callers that
  // don't set the field (single-algorithm P1 has one reasonable
  // interpretation of unset).
  QUERY_TYPE_UNSPECIFIED = 0;
  QUERY_TYPE_KEYWORD = 1;      // BM25 only (P1)
  QUERY_TYPE_SEMANTIC = 2;     // vector-only (P2)
  QUERY_TYPE_HYBRID = 3;       // keyword + vector, fused (P3)
}

// Fusion method for hybrid queries (Phase 3).  Semantics match the
// Python SearchDaemon (#4541):
//
// - RRF: reciprocal-rank fusion, `score = Σ 1 / (k + rank_i)` across
//   the two sources.  Rank-based, no score normalisation needed.
// - WEIGHTED: min-max normalise each source's scores to [0, 1], then
//   `score = (1 - alpha) * keyword + alpha * semantic`.
// - RRF_WEIGHTED: same shape as RRF but each source's contribution
//   is scaled by (1 - alpha) / alpha respectively.
enum FusionMethod {
  FUSION_METHOD_UNSPECIFIED = 0;  // treated as RRF
  FUSION_METHOD_RRF = 1;
  FUSION_METHOD_WEIGHTED = 2;
  FUSION_METHOD_RRF_WEIGHTED = 3;
}

message QueryRequest {
  // Query text.  BM25 tokenization is applied by tantivy's default
  // analyzer (lowercasing + simple tokenizer).
  string q = 1;

  // Zone scoping.  Kernel-tier readers pass a zone-id; the plugin
  // opens the corresponding per-zone index and searches only that
  // zone.  Cross-zone federation is the kernel driver's job — the
  // plugin never sees more than one zone per call (mirrors Glob +
  // Grep behaviour).  Empty ⇒ ROOT_ZONE_ID.
  string zone_id = 2;

  // Max results returned.  0 ⇒ server-side default (10).
  uint32 limit = 3;

  // Optional path-prefix filter.  Matches results whose stored `path`
  // starts with this string.  Empty ⇒ no filter.
  string path_filter = 4;

  // Which retrieval algorithm to run.  P1 rejects anything other than
  // KEYWORD (or UNSPECIFIED, which is treated as KEYWORD).
  QueryType query_type = 5;

  // Auth token — same convention as the sibling RPCs; the kernel-side
  // permission gate reads it via OperationContext.  Read-gating
  // (zone-perm filter, #4557) stays kernel-tier per D5 — the plugin
  // trusts that whoever passed the zone_id already checked read
  // permission.
  string auth_token = 6;

  // ── Hybrid fusion knobs (P3) ───────────────────────────────────
  // Semantic-vs-keyword weight for WEIGHTED / RRF_WEIGHTED.
  // Range [0.0, 1.0]; 0.0 = pure keyword, 1.0 = pure semantic, 0.5
  // = balanced.  Ignored for KEYWORD / SEMANTIC / RRF where the
  // sources are equally weighted or single-sourced.  0.0 default
  // maps to alpha=0.5 on the plugin side so a caller who forgets
  // the field gets the balanced blend, matching Python.
  float alpha = 7;

  // Fusion algorithm — see the `FusionMethod` enum for semantics.
  FusionMethod fusion_method = 8;

  // RRF rank constant.  60 is the paper's canonical value and what
  // Python defaults to; higher values flatten the ranking curve.
  // 0 ⇒ server-side default (60).
  uint32 rrf_k = 9;

  // Per-document chunk cap for final-list pooling (#4542).  Prevents
  // one long file from monopolising the top-N when its per-chunk
  // scores dominate multiple result slots.  0 ⇒ no pooling (backward-
  // compatible with the pre-P3 shape).  Observable from P4 onward
  // once the chunker starts emitting multi-chunk-per-file sets.
  uint32 chunks_per_page = 10;

  // ── Read-side expansion (P4, #4398) ────────────────────────────
  //
  // "none" | "macro"; empty ⇒ no expansion (default).  When set to
  // "macro" each returned hit carries `expanded_context` with the
  // concatenation of the previous + current + next chunk texts,
  // so callers can render a section-sized snippet without a
  // follow-up read.  Matches the Python SearchDaemon expand=macro
  // contract.
  string expand = 11;
}

message QueryResult {
  // Absolute VFS path of the chunk's source file (starts with `/`),
  // matching GlobResponse + GrepMatch convention.
  string path = 1;

  // Which chunk of the file this result is.  0 for whole-file (P1
  // one-chunk-per-file); P4's real chunker will emit higher indices.
  uint32 chunk_index = 2;

  // The chunk's text.  For P1 this is the whole file's text (capped);
  // for P4 it's the actual chunk window.
  string chunk_text = 3;

  // Ranker score.  BM25 for keyword; cosine for semantic; fused for
  // hybrid.  Not comparable across `query_type` values.
  float score = 4;

  // The zone this result belongs to.  Mirrors the request's
  // `zone_id` since a query is single-zone (per D3); the field exists
  // so callers deduping across federated hits from multiple plugins
  // don't need to plumb the request back in.
  string zone_id = 5;

  // Millisecond-resolution mtime of the source file at index time.
  // Optional because P1 tolerates missing mtimes (e.g. streams).  Used
  // by P6's recency scoring.
  optional int64 mtime_ms = 6;

  // Neighbouring-chunk context (P4, #4398).  Populated only when
  // the request's `expand="macro"` — concatenation of the previous
  // + current + next chunk texts under the same `path`, so callers
  // render a section-sized snippet in one pass.  Absent (empty
  // string) for `expand="none"` or when the source file has only
  // this one chunk.
  string expanded_context = 7;
}

message QueryResponse {
  repeated QueryResult results = 1;
  // Set when the request could not be served (e.g. no index for the
  // requested zone_id, invalid path_filter).  Callers treat non-empty
  // error as "empty results, log and move on" per Glob + Grep
  // convention.
  optional string error = 2;
}

message IndexRequest {
  // Walk start.  Absolute VFS path (starts with `/`).
  string root_path = 1;

  // Zone scope — the same rule as `QueryRequest.zone_id`.  Documents
  // are added to the per-zone tantivy index for this zone.
  string zone_id = 2;

  // Recurse into subdirectories.  false ⇒ only direct children of
  // `root_path` (matches Python `recursive=False`).
  bool recursive = 3;

  // Safety cap on the number of documents added in a single call.
  // 0 ⇒ server-side default (10_000).  Callers that need to index a
  // larger corpus call `Index` repeatedly with narrower `root_path`
  // scopes.
  uint32 max_docs = 4;

  // Auth token per the same convention as the sibling RPCs.
  string auth_token = 5;
}

message IndexResponse {
  // Number of documents added / refreshed by this call.
  uint32 indexed_count = 1;
  // Number of paths visited that were skipped (empty file, binary,
  // over-size, non-regular).  Distinct from indexed_count so callers
  // can spot silent skips without diffing before/after counts.
  uint32 skipped_count = 2;
  // Set when the walk aborted (missing root, index-open failure).
  // Callers treat non-empty error as "no documents added, log and
  // retry with narrower scope" per Glob + Grep convention.
  optional string error = 3;
}

message RefreshRequest {
  // Walk start (same shape as IndexRequest.root_path).
  string root_path = 1;
  // Zone scope — same rule as QueryRequest.zone_id.
  string zone_id = 2;
  // Recurse into subdirectories (matches Python `recursive=False`).
  bool recursive = 3;
  // Safety cap on walker size.  0 ⇒ server-side default (10_000).
  uint32 max_docs = 4;
  // Auth token per the sibling RPCs.
  string auth_token = 5;
}

message RefreshResponse {
  // Files re-indexed (new or mtime-changed).  Distinct from a full
  // Index's indexed_count so callers can tell "Refresh saw N
  // changes" from "Index processed N files total".
  uint32 reindexed_count = 1;
  // Files dropped from FTS + ANN because they were in the cache
  // but no longer present in the walked corpus.
  uint32 removed_count = 2;
  // Files whose cached mtime matched the fresh mtime — the whole
  // reason Refresh exists.  Handy for operators to sanity-check
  // the cache is working.
  uint32 unchanged_count = 3;
  // Files visited but skipped for content reasons (empty, binary,
  // oversize) — same shape as IndexResponse.skipped_count.
  uint32 skipped_count = 4;
  // Set when the walk aborted; same convention as IndexResponse.
  optional string error = 5;
}
