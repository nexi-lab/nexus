[package]
name = "nexus-search-common"
version = "0.1.0"
edition = "2021"
description = "Reusable search primitives shared by nexus-http-api, nexus-search-plugin, and the future federated-dispatcher crate: hit type, RRF/weighted fusion, federated-response envelope, degraded-signal helpers."

[lib]
name = "nexus_search_common"
crate-type = ["rlib"]

[dependencies]
# No I/O — pure algorithms + DTOs.  Serde only so a caller that
# serialises the envelope for a gRPC/HTTP boundary can `#[derive]`
# without pulling us onto every leaf DTO.
serde = { workspace = true, features = ["derive"] }
# `Hit::extras` carries backend-specific attribution fields (title_score,
# tier_boost, recency_boost, …) as opaque JSON so this crate does not
# have to grow a field per backend.
serde_json = { workspace = true }
# `DelegationError` uses `#[derive(thiserror::Error)]` so its Display
# matches the Python `PermissionError` message shape 1:1.
thiserror = "1"

# ── Opt-in `transport` feature ──────────────────────────────────
#
# When enabled, exposes `transport::PeerChannelCache` — the shared
# tonic `Channel`-per-peer cache both `nexus-search-plugin`'s peer
# fanout and `nexus-http-api`'s cross-daemon backend depend on.
# Kept optional so a pure-algorithm consumer of this crate (fusion
# only) never links tonic.
tonic = { workspace = true, optional = true }
dashmap = { version = "6.1", optional = true }

[features]
default = []
transport = ["dep:tonic", "dep:dashmap"]

[dev-dependencies]
# The `transport` module's dial-error tests spin a single-threaded
# tokio runtime to poll a future for its sync-side error branch.
# The `transport` feature is enabled for `cargo test`s that touch
# the module; a caller of this crate opting out never pulls tokio.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
