[package]
name = "nexus-search-plugin"
version = "0.1.0"
edition = "2021"
description = "Nexus search plugin — cdylib loaded by `nexusd-cluster` via `--plugin-dir`. Hosts SearchService (recursive glob + regex grep over the kernel VFS) as a Phase P plugin-as-gRPC-service. Rust replacement for the Python `nexus.bricks.search.search_service.SearchService`."
authors = ["Nexus Team"]
publish = false

[lib]
name = "nexus_search_plugin"
# cdylib for the loader to dlopen at startup.  rlib for the in-crate
# unit tests to reach the internal glob/grep walker without going
# through the C ABI.
crate-type = ["cdylib", "rlib"]

[features]
# `semantic` = fastembed + ort dylib for vector-embedding-driven
# SemanticQuery.  Default-on for cluster profile.  With the feature
# OFF, the plugin still ships Query (keyword / BM25) + Glob + Grep;
# SemanticQuery returns a plain error and the AnnIndex primitive
# stays reachable to callers who bring their own vectors.  Graceful
# degradation is deliberate — a missing model / dylib must not take
# down keyword search too.
default = ["semantic"]
semantic = ["dep:fastembed", "dep:ort"]

[dependencies]
# Plugin ABI — stable C ABI contract for dylib plugins.  The
# `declare_service_plugin!` macro + KernelHandle live here.
nexus-plugin-abi = { workspace = true }

# Proto message + tonic server stubs for SearchService.  Generated
# in build.rs from `../proto/nexus/search/v1/search.proto`.
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

# Glob pattern matching — same crate the kernel uses for its own
# glob paths, so pattern semantics stay identical across the
# Python / Rust boundary while the migration is in flight.
globset = { workspace = true }

# Regex engine for grep.  `regex-syntax` is pulled transitively.
regex = { workspace = true }

# JSON parse for the `sys_readdir` return payload (the plugin ABI
# returns `[{"name":<str>,"entry_type":<u8>}, ...]`).
serde = { workspace = true }
serde_json = { workspace = true }

# Diagnostic logging — silent by default; the cluster binary's
# RUST_LOG opts specific targets in.
tracing = "0.1"

# tokio runtime for the async gRPC service impl; the plugin's
# dispatch layer bridges to it via block_on.  `rt-multi-thread` is
# opt-in for the spawn_blocking pool used by the recursive walker so
# concurrent Glob / Grep requests do not serialize on a single-thread
# runtime.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# Bytes for tonic Request/Response body types.
bytes = "1"

# Stream combinators for BatchQuery's bounded, order-preserving
# concurrent dispatch (#4610 — `stream::iter(..).buffered(n)`).
# Already in the tree transitively via tonic; this only makes the
# dependency direct.
futures-util = "0.3"

# Full-text search backend for the Query RPC (Phase 1 of the
# Python-parity roadmap; see PARITY_ROADMAP.md D1).  Pure Rust, no
# native deps — links into this plugin's cdylib only, cluster core
# stays untouched.  BM25 scorer + mmap segments; per-zone indices
# live under `~/.nexus/plugins/search/<zone_id>/fts/`.
tantivy = "0.22"

# ANN vector store for SemanticQuery (Phase 2).  Pure Rust HNSW;
# lives per-zone at `<data>/plugins/search/<zone_id>/ann-<model>-<version>/`.
# Distance = cosine.  Same dylib-boundary story as tantivy — the plugin
# cdylib is where the vector index code lands, cluster core stays lean.
hnsw_rs = "0.3"

# `anndists` is `hnsw_rs`'s distance-metric crate — kept as an explicit
# direct dep because the plugin references `DistCosine` in its own code
# (not as a re-export shim), so a `hnsw_rs` major bump that trims its
# re-export surface would fail LOUD here instead of at a distant callsite.
anndists = "0.1"

# ── semantic (feature-gated) ──────────────────────────────────────
# fastembed = the sentence-transformer runtime; ships tokenizer +
# pooling + normalization + model catalogue (BGE, mE5, MiniLM) atop
# `ort`.  Pinned to =5.17.4 per D2 — 5.15..5.17 have no known
# regressions; a fastembed major bump forcing an ort ABI change would
# fail loud here.  `ort-load-dynamic` = ship onnxruntime.{dll,dylib,so}
# alongside the plugin cdylib rather than static-linking (matches
# signed-release + swap-model-without-resign posture).
fastembed = { version = "=5.17.4", default-features = false, features = [
    "ort-load-dynamic",
], optional = true }

# `ort` is fastembed's transitive dep, but we take a direct pin so
# `ort::init_from(dylib_path)` is in scope at plugin startup.  Version
# range compatible with fastembed 5.17.x (which itself pins
# `ort = 2.0.0-rc.10`); the caret constraint is deliberate — a
# fastembed bump moving to a newer rc must be caught by an explicit
# range bump here, not silently accepted.
ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "load-dynamic",
], optional = true }


# ── remote/API embedder (#4614) ───────────────────────────────────
# Blocking HTTP for `RemoteEmbedder` — embeds via an OpenAI-compatible
# `/v1/embeddings` endpoint when NEXUS_SEARCH_EMBED_API_URL is set.
# Blocking is deliberate: every embed_batch call site already runs on
# a spawn_blocking worker, and reqwest::blocking keeps its own
# dedicated runtime thread so the plugin's tokio pool is never
# re-entered.  rustls so the cdylib carries no OpenSSL linkage to
# manage across platforms; same 0.13 line the wider tree already
# resolves.  NOT feature-gated behind `semantic` — remote embedding
# needs no ONNX, so a non-semantic build still gets a dense lane when
# an API endpoint is configured.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }

# Parking-lot mutex around the per-zone index writer.  tantivy's own
# IndexWriter is Send + Sync but only allows one writer per index at a
# time; the lock is short-held (writer.add_document + writer.commit)
# so contention is negligible, and parking_lot avoids poisoning.
parking_lot = "0.12"

# Sharded concurrent hashmap for the peer-fanout dispatcher's
# per-peer Channel cache.  Same 6.1 pin the sibling `rust/services`
# crate uses (see rust/services/Cargo.toml).  The old
# `Mutex<HashMap>` shape serialised every peer's channel lookup on
# one lock — fine at ≤10 peers, painful past that; DashMap's shard-
# per-bucket lets independent peers dial concurrently without ever
# contending.
dashmap = "6.1"

# Ergonomic error enums for the fts_index module.
thiserror = "1"

[build-dependencies]
tonic-prost-build = "0.14"
# Vendored protoc so the plugin builds on any host without a
# system-wide protobuf-compiler.  Same policy the sibling `vault` +
# `fuse-plugin` crates use for their per-plugin proto codegen.
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
# dlopen self-test for the cdylib — mirrors the sibling
# `nexus-vault/tests/dlopen_self.rs`.  Validates plugin-ABI symbol
# resolution + `nexus_plugin_grpc_services` JSON contract on all
# three `libloading`-supported platforms.
libloading = "0.8"
# cross_allocator_free_e2e.rs sets mimalloc as the test binary's global
# allocator (mirroring the cluster host) so a Grep across the FFI
# boundary into the system-allocator cdylib faithfully reproduces the
# Windows cross-heap free bug (nexus-vfs#236).  prost encodes the Grep
# request / decodes the response through the same plugin-ABI path.
mimalloc = { workspace = true }
prost = { workspace = true }
# TcpListenerStream — federation_e2e.rs binds a peer plugin to a
# loopback ephemeral port + wraps it as a Stream so tonic's
# `serve_with_incoming` can drive it (Server::serve wants a
# SocketAddr, but we need the ephemeral port BEFORE the serve call
# so tests can dial it).  Only needed by that one test; dev-dep so
# the plugin's release build stays lean.
tokio-stream = { version = "0.1", features = ["net"] }
