# MCP tool groups for client configuration and presentation.
# Profiles support single inheritance via `extends`.
# The native owner verifies credentials and enforces file authority.
#
# To override: set NEXUS_TOOL_PROFILES_PATH env var to a custom YAML.

profiles:
  minimal:
    description: "Read-only file access"
    tools:
      - nexus_read_file
      - nexus_list_files
      - nexus_file_info
      - nexus_glob

  coding:
    extends: minimal
    description: "File operations for coding agents"
    tools:
      - nexus_write_file
      - nexus_delete_file
      - nexus_mkdir
      - nexus_rmdir
      - nexus_rename_file
      - nexus_grep

  search:
    extends: minimal
    description: "Native Search operations"
    tools:
      - nexus_grep
      - nexus_semantic_search

  full:
    extends: coding
    description: "All tools (admin/development)"
    tools:
      - nexus_semantic_search
      - nexus_discovery_search_tools
      - nexus_discovery_list_servers
      - nexus_discovery_get_tool_details
      - nexus_discovery_load_tools

default_profile: minimal
